services:
  snappymail:
    image: djmaze/snappymail:v2.38.2
    container_name: snappymail
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_ROOT}/data:/snappymail/data
      # The image also declares VOLUME /var/lib/snappymail (static read-only
      # files baked in at build time, not real user data) — mount it to a
      # named volume so Docker doesn't silently create an anonymous one.
      - snappymail-lib:/var/lib/snappymail
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - homeserver

volumes:
  snappymail-lib:

networks:
  homeserver:
    external: true
