services:
  stalwart:
    ports:
      # Admin UI
      - "8091:8080"
      # All mail ports below 1024 remapped — rootless Podman can't bind privileged ports
      - "8025:25"
      - "8587:587"
      - "8465:465"
      - "8143:143"
      - "8993:993"
      # Sieve (not privileged, binds directly)
      - "4190:4190"
