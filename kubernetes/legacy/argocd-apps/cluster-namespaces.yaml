apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-namespaces
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rajubhimani/homeserver.git
    targetRevision: feature/k8s-pilot
    path: kubernetes/cluster
    directory:
      include: "namespaces.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false   # never auto-delete namespaces — too destructive to automate
      selfHeal: true
