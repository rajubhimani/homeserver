apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rajubhimani/homeserver.git
    targetRevision: feature/k8s-pilot
    path: kubernetes/cluster/traefik
    directory:
      include: "gateway.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
