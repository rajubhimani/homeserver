# Direct LAN-reachable port — see excalidraw/lan-service.yaml for the "why".
#
# Port 8144 matches docs/compose.dev.yml exactly. Stop the Compose version
# (uv run homeserver.py dev down docs) before applying this — same host
# port, can't both bind it.
apiVersion: v1
kind: Service
metadata:
  name: docs-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: docs
  ports:
    - port: 8144
      targetPort: 80
