apiVersion: apps/v1
kind: Deployment
metadata:
  name: orangehrm
  namespace: apps
  labels:
    app: orangehrm
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orangehrm
  template:
    metadata:
      labels:
        app: orangehrm
    spec:
      enableServiceLinks: false
      containers:
        - name: orangehrm
          image: orangehrm/orangehrm:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: orangehrm
  namespace: apps
spec:
  selector:
    app: orangehrm
  ports:
    - port: 80
