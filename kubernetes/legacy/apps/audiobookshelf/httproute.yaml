apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "audiobookshelf.k8s.local"
  rules:
    - backendRefs:
        - name: audiobookshelf
          port: 80
