# Direct LAN-reachable port — see excalidraw/lan-service.yaml for the "why".
#
# Port 8099 matches openproject/compose.dev.yml exactly. Stop the Compose
# version (uv run homeserver.py dev down openproject) before applying this —
# same host port, can't both bind it.
apiVersion: v1
kind: Service
metadata:
  name: openproject-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: openproject
  ports:
    - port: 8099
      targetPort: 80
