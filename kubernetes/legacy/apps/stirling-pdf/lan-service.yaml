# Direct LAN-reachable port — see excalidraw/lan-service.yaml for the "why".
#
# Port 8089 matches stirling-pdf/compose.dev.yml exactly. Stop the Compose
# version (uv run homeserver.py dev down stirling-pdf) before applying this
# — same host port, can't both bind it.
apiVersion: v1
kind: Service
metadata:
  name: stirling-pdf-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: stirling-pdf
  ports:
    - port: 8089
      targetPort: 8080
