# Mirrors karakeep/compose.yml. karakeep-chrome (headless browser) and
# karakeep-meilisearch (search index) are internal-only backing services —
# each gets a ClusterIP Service purely for by-name DNS resolution from the
# main karakeep app, no HTTPRoute/lan-service for either. karakeep-chrome
# needs no persistent storage (nothing written that survives a restart
# matters); karakeep-meilisearch gets a PVC (compose persists it to a named
# volume). Compose's depends_on (karakeep waits on meilisearch healthy +
# chrome started) has no direct k8s equivalent — same documented gap as
# elsewhere in this pilot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  namespace: apps
  labels:
    app: karakeep-chrome
spec:
  replicas: 0
  selector:
    matchLabels:
      app: karakeep-chrome
  template:
    metadata:
      labels:
        app: karakeep-chrome
    spec:
      enableServiceLinks: false
      containers:
        - name: chrome
          image: gcr.io/zenika-hub/alpine-chrome:124
          args:
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - --hide-scrollbars
          ports:
            - containerPort: 9222
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-chrome
  namespace: apps
spec:
  selector:
    app: karakeep-chrome
  ports:
    - port: 9222
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-meilisearch-data
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-meilisearch
  namespace: apps
  labels:
    app: karakeep-meilisearch
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep-meilisearch
  template:
    metadata:
      labels:
        app: karakeep-meilisearch
    spec:
      enableServiceLinks: false
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.51.0
          ports:
            - containerPort: 7700
          env:
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-credentials
                  key: meili-master-key
          volumeMounts:
            - name: data
              mountPath: /meili_data
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-meilisearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-meilisearch
  namespace: apps
spec:
  selector:
    app: karakeep-meilisearch
  ports:
    - port: 7700
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: apps
  labels:
    app: karakeep
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
    spec:
      enableServiceLinks: false
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:release
          ports:
            - containerPort: 3000
          env:
            - name: MEILI_ADDR
              value: http://karakeep-meilisearch:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-credentials
                  key: meili-master-key
            - name: BROWSER_WEB_URL
              value: http://karakeep-chrome:9222
            - name: NEXTAUTH_URL
              value: https://karakeep.k8s.local
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-credentials
                  key: nextauth-secret
            - name: DATA_DIR
              value: /data
            - name: DISABLE_SIGNUPS
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: apps
spec:
  selector:
    app: karakeep
  ports:
    - port: 3000
