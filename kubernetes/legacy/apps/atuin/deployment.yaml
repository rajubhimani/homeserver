apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atuin-config
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin
  namespace: apps
  labels:
    app: atuin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atuin
  template:
    metadata:
      labels:
        app: atuin
    spec:
      enableServiceLinks: false
      containers:
        - name: atuin
          image: ghcr.io/atuinsh/atuin:18.18.1
          args: ["start"]
          env:
            - name: ATUIN_HOST
              value: "0.0.0.0"
            - name: ATUIN_DB_URI
              valueFrom:
                secretKeyRef:
                  name: atuin-db-credentials
                  key: db-uri
            - name: ATUIN_OPEN_REGISTRATION
              value: "true"
            - name: RUST_LOG
              value: "info,atuin_server=debug"
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: atuin-config
---
apiVersion: v1
kind: Service
metadata:
  name: atuin
  namespace: apps
spec:
  selector:
    app: atuin
  ports:
    - port: 8888
