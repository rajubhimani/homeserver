apiVersion: v1
data:
  init.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        GRANT ALL ON SCHEMA public TO "$POSTGRES_USER";
        ALTER SCHEMA public OWNER TO "$POSTGRES_USER";
    EOSQL
kind: ConfigMap
metadata:
  name: forgejo-postgres-init
  namespace: apps
