apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plausible-data
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plausible
  namespace: apps
  labels:
    app: plausible
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plausible
  template:
    metadata:
      labels:
        app: plausible
    spec:
      enableServiceLinks: false
      containers:
        - name: plausible
          image: ghcr.io/plausible/community-edition:v3.2.1
          args: ["sh", "-c", "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"]
          env:
            - name: BASE_URL
              value: https://plausible.k8s.local
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plausible-db-credentials
                  key: database-url
            - name: CLICKHOUSE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plausible-db-credentials
                  key: clickhouse-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: plausible-credentials
                  key: secret-key-base
            - name: TOTP_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: plausible-credentials
                  key: totp-vault-key
            - name: DISABLE_REGISTRATION
              value: invite_only
            - name: ENABLE_EMAIL_VERIFICATION
              value: "false"
            - name: MAXMIND_EDITION
              value: GeoLite2-City
            - name: MAILER_ADAPTER
              value: Bamboo.Mua
            - name: SMTP_HOST_PORT
              value: "587"
            - name: SMTP_HOST_SSL_ENABLED
              value: "false"
            - name: MAILGUN_BASE_URI
              value: https://api.mailgun.net/v3
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /var/lib/plausible
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: plausible-data
---
apiVersion: v1
kind: Service
metadata:
  name: plausible
  namespace: apps
spec:
  selector:
    app: plausible
  ports:
    - port: 8000
