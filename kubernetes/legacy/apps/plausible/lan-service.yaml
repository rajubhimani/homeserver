# Direct LAN-reachable port — the "dev env" equivalent from the compose
# stack (ports exposed directly, no hostname routing needed) vs the
# HTTPRoute's "prod env" equivalent (hostname routing through Traefik).
# For local/LAN testing only, until AdGuard Home is set up as the network's
# DNS resolver to make hostname routing work from every device.
#
# Port 8130 matches plausible/compose.dev.yml exactly — same number you
# already know, no new one to learn. Only the app port is exposed (not
# ClickHouse/Postgres, which aren't LAN-facing in Compose either). Not
# running in Compose (k8s pilot only), so no port conflict.
apiVersion: v1
kind: Service
metadata:
  name: plausible-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: plausible
  ports:
    - port: 8130
      targetPort: 8000
