# Only authentik-server is routed — authentik-worker has no HTTP interface
# of its own (it processes background tasks against the same Postgres/media
# volumes, nothing to route to).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-server
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "authentik.k8s.local"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 9000
