# Gated behind Authentik forward-auth, matching services/nginx-plain/
# templates/default.conf.template's auth_request block for this host in
# Compose — see kubernetes/apps/authentik/forward-auth-middleware.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "temporal.k8s.local"
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: temporal-ui
          port: 8080
