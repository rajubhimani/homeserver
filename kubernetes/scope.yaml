# Which services kubernetes/generate.py renders, grown phase by phase
# (research/kubernetes-compose-parity-plan.md). A managed service is either
# ported, skipped with a reason, or still pending; tests/test_k8s_sync.py
# checks this list against services.json.

# Phase 1 — MIN
ported:
  - beszel
  - cloudflared
  - docs
  - landing

  # Phase 2 — databases: the shared servers (operator-managed) + one pilot
  # app on each
  - shared-postgres
  - shared-mariadb
  - miniflux
  - bookstack

  # Phase 3 (pulled forward): authentik, needed for the forward-auth login
  # in front of the Browser Hub and the other protected hostnames
  - authentik
  # nginx-plain: its routing is Traefik's Gateway + generated HTTPRoutes;
  # only its self-served sites (Browser Hub) run (overrides/nginx-plain.yaml)
  - nginx-plain

  # Phase 3 — the rest of CORE
  - ntfy
  - uptime-kuma
  - adguard-home
  - vaultwarden
  - firefly
  - immich
  - clamav
  - nextcloud
  - onlyoffice
  - whiteboard
  - jellyfin
  - forgejo
  - atuin
  - guacamole
  - it-tools
  - mailpit
  - plausible

# Rendered only for the prod environment. The test cluster must never run
# the Compose stack's Cloudflare tunnel token a second time: Cloudflare would
# split live traffic between Docker and the test cluster.
prod_only:
  - cloudflared

# Not run on Kubernetes, each with the replacement.
skipped:
  wg-easy: "Out of scope for now (decided 2026-10-04): stays on Docker. Prepared in overrides/wg-easy.yaml (host network, UDP 51820 node port, web UI on the node); see docs/services/wg-easy.md."
  portainer: "Needs the Docker socket; Kubernetes UIs are Headlamp and the ArgoCD UI."
