# Rendered only for the prod environment. The test cluster must never run
# the Compose stack's Cloudflare tunnel token a second time: Cloudflare would
# split live traffic between Docker and the test cluster.
prod_only:
  - cloudflared

# Not run on Kubernetes, each with the replacement.
skipped:
  wg-easy: "Stays on Docker (decided 2026-10-04): the VPN is how this machine is reached when something breaks, so it runs independently of the cluster (common homelab practice; wg-easy documents only Docker, Podman and dockerless installs). Prepared in overrides/wg-easy.yaml should that change."
  coolify: "Docker PaaS: deploys apps as Docker containers through the socket. On Kubernetes, ArgoCD and the generated manifests do that job."
  dockge: "Docker Compose stack manager (needs the socket). Kubernetes UIs are the ArgoCD UI and Headlamp."
  dozzle: "Docker log viewer (needs the socket). On Kubernetes, Grafana + Loki (observability) and Headlamp show pod logs."
  portainer: "Needs the Docker socket; Kubernetes UIs are Headlamp and the ArgoCD UI."

