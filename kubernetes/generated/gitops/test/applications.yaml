          enabled: false
          postgresqlHost: shared-postgres
          postgresqlUsername: dagster
          postgresqlDatabase: dagster
          service:
            port: 5432
        telemetry:
          enabled: false
        dagsterWebserver:
          nameOverride: webserver
          replicaCount: 0
          service:
            port: 3000
          readinessProbe:
            httpGet:
              port: 3000
          image:
            tag: 1.13.25
            pullPolicy: IfNotPresent
          labels:
            app.kubernetes.io/part-of: homeserver
            homeserver/service: dagster
          resources:
            limits:
              memory: 512Mi
          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
        dagsterDaemon:
          enabled: false
          image:
            tag: 1.13.25
            pullPolicy: IfNotPresent
          labels:
            app.kubernetes.io/part-of: homeserver
            homeserver/service: dagster
          resources:
            limits:
              memory: 384Mi
          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
        dagster-user-deployments:
          enabled: false
          deployments:
          - name: dagster-user-code
            port: 4000
            image:
              repository: homeserver/dagster-user-code
              tag: 1.13.25
              pullPolicy: IfNotPresent
            dagsterApiGrpcArgs:
            - -f
            - definitions.py
            envSecrets:
            - name: dagster-env
            env:
            - name: DAGSTER_EXECUTOR
              value: multiprocess
            includeConfigInLaunchedRuns:
              enabled: true
            labels:
              app.kubernetes.io/part-of: homeserver
              homeserver/service: dagster
            resources:
              limits:
                memory: 256Mi
            podSecurityContext:
              seccompProfile:
                type: RuntimeDefault
            securityContext:
              allowPrivilegeEscalation: false
        runLauncher:
          type: K8sRunLauncher
          config:
            k8sRunLauncher:
              imagePullPolicy: IfNotPresent
              envSecrets:
