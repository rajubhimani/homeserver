      <script>
        const DOMAIN = 'DOMAIN_PLACEHOLDER';

        // Service + tier + grouping data lives in one place: services.json at
        // the repo root (bind-mounted in) -- see the homeserver-add-service
        // skill. Populated by loadServiceData() before renderCards() runs.
        let SERVICES = [];
        let SUBCATEGORY_LABELS = {};

        async function loadServiceData() {
          const res = await fetch('services.json', { cache: 'no-store' });
          const data = await res.json();
          // Only entries with a category get a card -- tier-only infra entries
          // (cloudflared, nginx-plain, landing itself, ollama) are
          // deliberately invisible here, same as before this was data-driven.
          // Sorted alphabetically by name (case-insensitive) so each category/
          // subgroup grid is easy to scan for a specific service instead of
          // whatever order they happen to appear in services.json (historically
          // insertion/tier order) -- placeCard() appends in this array's order,
          // so sorting here is the single place that controls it.
          SERVICES = data.services.filter(s => s.category)
            .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
          SUBCATEGORY_LABELS = data.subcategoryLabels || {};
        }

        const EXTERNAL_LINK_SVG = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 10 L10 2 M5 2 L10 2 L10 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        // Build one card element from a SERVICES entry, with its public link
        // already pointed at the right subdomain.
        function buildCard(s) {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.service = s.slug;
          card.dataset.category = s.category;
          if (s.subcategory) card.dataset.subcategory = s.subcategory;

          const sub = s.sub || s.slug;
          // s.path is a subpath under THIS card's own subdomain (sub.${DOMAIN}),
          // not the bare apex domain -- Browser Hub's individual browsers live
          // at browser.${DOMAIN}/<path>/ (see docs/services/browser-hub.md),
          // sharing the hub's "browser" subdomain via their own s.sub, not
          // browsing off ${DOMAIN} directly.
          const url = s.path ? `https://${sub}.${DOMAIN}/${s.path}` : `https://${sub}.${DOMAIN}`;
          const label = s.path ? `${sub}.${DOMAIN}/${s.path}` : `${sub}.${DOMAIN}`;
          // Skip the "Replaces: X" suffix when desc already names X (e.g.
          // "Google Drive alternative...") — avoids saying it twice.
          const mentionsReplaces = s.replaces && s.replaces.split(' / ').some(
            alt => s.desc.toLowerCase().includes(alt.split(' (')[0].trim().toLowerCase())
          );
          const tooltip = (s.replaces && !mentionsReplaces) ? `${s.desc} Replaces: ${s.replaces}.` : s.desc;
          card.title = tooltip;

          let secondaryLink = '';
          if (s.testSub) {
            secondaryLink = `
            <a class="card-link-secondary" href="https://${s.testSub}.${DOMAIN}" data-testsub="${s.testSub}" data-testhealth="${s.testHealth || s.testSub}" target="_blank">
              <span class="test-badge">TEST</span><span class="test-dot"></span> ${s.testLabel || ''}
            </a>`;
          }

          card.innerHTML = `
            <div class="card-icon ${s.icon}">
              <svg viewBox="0 0 18 18" fill="none">${s.svg}</svg>
            </div>
            <div class="card-header">
              <span class="card-name">${s.name}</span>
              <span class="status checking"><span class="status-dot"></span><span class="status-text">checking</span></span>
            </div>
            <p class="card-desc">${s.desc}</p>
            <a class="card-link" href="${url}" target="_blank">${label}${EXTERNAL_LINK_SVG}</a>${secondaryLink}`;
          return card;
        }

        function renderCards() {
          const pool = document.getElementById('card-pool');
          // data-order = this card's rank in the already-alphabetized SERVICES
          // array -- placeCard() below inserts by this rank rather than by
          // arrival order, since health checks resolve concurrently/out of
          // order (see placeCard's comment) and a plain appendChild there would
          // place cards in whatever order their network request happened to
          // finish, not alphabetically.
          SERVICES.forEach((s, i) => {
            const card = buildCard(s);
            card.dataset.order = i;
            pool.appendChild(card);
          });
        }

        let activeTab = 'online';

        function switchTab(tab) {
          activeTab = tab;
          document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tab);
          });
          applyTabVisibility();
        }

        function applyTabVisibility() {
          ['online', 'offline'].forEach(t => {
            const s = document.getElementById(`section-${t}`);
            const hasCards = s.querySelectorAll('.grid .card').length > 0;
            s.style.display = (t === activeTab && hasCards) ? '' : 'none';
          });
        }

        // Place a card into the correct online/offline section under its category
        // (and subgroup, if it has one -- categories without subgroups fall back
        // to a single direct grid, same as before subgroups existed).
        function placeCard(card, isOnline) {
          const cat = card.dataset.category;
          const subcat = card.dataset.subcategory;
          const sectionId = isOnline ? 'section-online' : 'section-offline';
          const section = document.getElementById(sectionId);
          const catDiv = section.querySelector(`[data-cat="${cat}"]`);

          let grid;
          if (subcat) {
            let subgroup = catDiv.querySelector(`.subgroup[data-subcat="${subcat}"]`);
            if (!subgroup) {
              subgroup = document.createElement('div');
              subgroup.className = 'subgroup';
              subgroup.dataset.subcat = subcat;
              const label = document.createElement('p');
              label.className = 'subgroup-label';
              label.textContent = SUBCATEGORY_LABELS[subcat] || subcat;
              grid = document.createElement('div');
              grid.className = 'grid';
              subgroup.append(label, grid);
              catDiv.appendChild(subgroup);
            } else {
              grid = subgroup.querySelector('.grid');
            }
          } else {
            grid = catDiv.querySelector(':scope > .grid');
            if (!grid) {
              grid = document.createElement('div');
              grid.className = 'grid';
              catDiv.appendChild(grid);
            }
          }
          // Insert by data-order (this card's rank in the alphabetized SERVICES
          // array) rather than appendChild -- cards arrive here in whatever
          // order their async health check happened to resolve (see
          // checkService/recheckAll), not alphabetically, so a plain append
          // would undo the sort every time cards get placed or re-placed.
          const order = Number(card.dataset.order);
          const next = Array.from(grid.children).find(c => Number(c.dataset.order) > order);
          grid.insertBefore(card, next || null);
          updateVisibility();
        }

        // Show/hide category/subgroup groups, update tab counts, apply active tab
        function updateVisibility() {
          ['online', 'offline'].forEach(t => {
            const section = document.getElementById(`section-${t}`);
            let count = 0;
            section.querySelectorAll('.category').forEach(cat => {
              let n = 0;
              cat.querySelectorAll('.grid').forEach(g => { n += g.children.length; });
              cat.style.display = n > 0 ? '' : 'none';
              cat.querySelectorAll('.subgroup').forEach(sg => {
                sg.style.display = sg.querySelector('.grid').children.length > 0 ? '' : 'none';
              });
              count += n;
            });
            document.querySelector(`.tab-btn[data-tab="${t}"] .tab-count`).textContent = count;
          });
          applyTabVisibility();
        }

        async function pingHealth(service) {
          try {
            const res = await fetch(`/health/${service}`, { signal: AbortSignal.timeout(6000), redirect: 'manual', cache: 'no-store' });
            return res.status === 0 || (res.status >= 200 && res.status < 500);
          } catch {
            return false;
          }
        }

        async function checkService(card) {
          const service = card.dataset.service;
          const badge = card.querySelector('.status');
          const text  = badge.querySelector('.status-text');
          // Any card can carry one or more secondary "test instance" links --
          // set testSub (and optionally testHealth/testLabel) on its SERVICES
          // entry and it's automatically OR'd into the main status (online if
          // the main instance OR any test instance is up).
          const testLinks = Array.from(card.querySelectorAll('.card-link-secondary[data-testsub]'));

          const [mainUp, testResults] = await Promise.all([
            pingHealth(service),
            Promise.all(testLinks.map(link => pingHealth(link.dataset.testhealth || link.dataset.testsub))),
          ]);

          testLinks.forEach((link, i) => {
            const dot = link.querySelector('.test-dot');
            if (dot) dot.className = `test-dot ${testResults[i] ? 'online' : 'offline'}`;
          });

          const up = mainUp || testResults.some(Boolean);

          badge.className = `status ${up ? 'online' : 'offline'}`;
          text.textContent = up ? 'online' : 'offline';
          placeCard(card, up);
        }

        // Re-check every card in place -- placeCard() already inserts each card
        // at its correct sorted position (data-order is a fixed alphabetical
        // rank) and moves it between the online/offline grids if its status
        // changed, so there's no need to clear categories out first. Doing that
        // used to make every section/tab-count flash empty for the duration of
        // each health check, which read as the whole page "refreshing".
        function recheckAll() {
          document.querySelectorAll('.card[data-service]').forEach(checkService);
        }

        (async () => {
          await loadServiceData();
          renderCards();
          // Initial check: pull all cards from pool and check each one
          document.querySelectorAll('#card-pool .card[data-service]').forEach(checkService);
          setInterval(recheckAll, 30000);
        })();
      </script>
    </body>
    </html>
  services-landing-nginx-conf: |
    server {
        listen 80;

        # Use Docker's internal DNS, resolve at request time not startup
        resolver RESOLVER_PLACEHOLDER valid=10s;

        # Applied to all proxy (health check) locations that don't override add_header.
        # Prevents browsers from caching health check responses — a stale 200 would
        # show a stopped service as online. location / has its own add_header directives
        # so it does NOT inherit these; static HTML caching is controlled there.
        proxy_hide_header Content-Type;
        add_header Content-Type "text/plain" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        location /health/immich {
            set $upstream http://immich-serverUPSTREAM_SUFFIX_PLACEHOLDER:2283;
            proxy_pass $upstream/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

