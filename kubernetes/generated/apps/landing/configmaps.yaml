          </button>
          <a class="docs-link" href="https://docs.DOMAIN_PLACEHOLDER" target="_blank" rel="noopener">
            <svg viewBox="0 0 18 18" fill="none">
              <path d="M9 4.5 C7.2 3.5 4.7 3.5 3 4.2 V13.7 C4.7 13 7.2 13 9 14 C10.8 13 13.3 13 15 13.7 V4.2 C13.3 3.5 10.8 3.5 9 4.5 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
