    \n    <div class=\"footer\">\n      Built and maintained by AUTHOR_PLACEHOLDER \xB7 LOCATION_PLACEHOLDER \xB7 YEAR_PLACEHOLDER\n\
    \    </div>\n  </div>\n\n  <script>\n    const DOMAIN = 'DOMAIN_PLACEHOLDER';\n\n    // Service + tier + grouping data\
    \ lives in one place: services.json at\n    // the repo root (bind-mounted in) -- see the homeserver-add-service\n   \
    \ // skill. Populated by loadServiceData() before renderCards() runs.\n    let SERVICES = [];\n    let SUBCATEGORY_LABELS\
    \ = {};\n\n    async function loadServiceData() {\n      const res = await fetch('services.json', { cache: 'no-store'\
