    \ 30000);\n    })();\n  </script>\n</body>\n</html>\n"
  services-landing-nginx-conf: "server {\n    listen 80;\n\n    # Use Docker's internal DNS, resolve at request time not startup\n\
    \    resolver RESOLVER_PLACEHOLDER valid=10s;\n\n    # Applied to all proxy (health check) locations that don't override\
    \ add_header.\n    # Prevents browsers from caching health check responses \u2014 a stale 200 would\n    # show a stopped\
    \ service as online. location / has its own add_header directives\n    # so it does NOT inherit these; static HTML caching\
    \ is controlled there.\n    proxy_hide_header Content-Type;\n    add_header Content-Type \"text/plain\" always;\n    add_header\
    \ Cache-Control \"no-store, no-cache, must-revalidate\" always;\n\n    location / {\n        root /usr/share/nginx/html;\n\
    \        index index.html;\n        add_header Cache-Control \"no-store, no-cache, must-revalidate\";\n        add_header\
    \ Pragma \"no-cache\";\n        expires 0;\n    }\n\n    location /health/immich {\n        set $upstream http://immich-serverUPSTREAM_SUFFIX_PLACEHOLDER:2283;\n\
    \        proxy_pass $upstream/;\n        proxy_connect_timeout 3s;\n        proxy_read_timeout 5s;\n    }\n\n    location\
    \ /health/nextcloud {\n        set $upstream http://nextcloudUPSTREAM_SUFFIX_PLACEHOLDER:80;\n        # Nextcloud validates\
    \ the Host header against trusted_domains \u2014 the bare \"/\"\n        # arrives with an untrusted Host and gets rejected\
    \ with 400. /status.php is\n        # Nextcloud's own lightweight status endpoint (same one its Docker healthcheck\n \
    \       # uses) and only needs a Host it trusts, e.g. localhost.\n        proxy_pass $upstream/status.php;\n        proxy_set_header\
    \ Host localhost;\n        proxy_connect_timeout 3s;\n        proxy_read_timeout 5s;\n    }\n\n    location /health/jellyfin\
    \ {\n        set $upstream http://jellyfinUPSTREAM_SUFFIX_PLACEHOLDER:8096;\n        proxy_pass $upstream/;\n        proxy_connect_timeout\
