    \    .sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));\n      SUBCATEGORY_LABELS = data.subcategoryLabels\
    \ || {};\n    }\n\n    const EXTERNAL_LINK_SVG = '<svg viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2 10 L10 2 M5 2\
    \ L10 2 L10 7\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>';\n\
    \n    // Build one card element from a SERVICES entry, with its public link\n    // already pointed at the right subdomain.\n\
    \    function buildCard(s) {\n      const card = document.createElement('div');\n      card.className = 'card';\n    \
    \  card.dataset.service = s.slug;\n      card.dataset.category = s.category;\n      if (s.subcategory) card.dataset.subcategory\
    \ = s.subcategory;\n\n      const sub = s.sub || s.slug;\n      // s.path is a subpath under THIS card's own subdomain\
    \ (sub.${DOMAIN}),\n      // not the bare apex domain -- Browser Hub's individual browsers live\n      // at browser.${DOMAIN}/<path>/\
    \ (see docs/services/browser-hub.md),\n      // sharing the hub's \"browser\" subdomain via their own s.sub, not\n   \
    \   // browsing off ${DOMAIN} directly.\n      const url = s.path ? `https://${sub}.${DOMAIN}/${s.path}` : `https://${sub}.${DOMAIN}`;\n\
    \      const label = s.path ? `${sub}.${DOMAIN}/${s.path}` : `${sub}.${DOMAIN}`;\n      // Skip the \"Replaces: X\" suffix\
    \ when desc already names X (e.g.\n      // \"Google Drive alternative...\") \u2014 avoids saying it twice.\n      const\
    \ mentionsReplaces = s.replaces && s.replaces.split(' / ').some(\n        alt => s.desc.toLowerCase().includes(alt.split('\
    \ (')[0].trim().toLowerCase())\n      );\n      const tooltip = (s.replaces && !mentionsReplaces) ? `${s.desc} Replaces:\
    \ ${s.replaces}.` : s.desc;\n      card.title = tooltip;\n\n      let secondaryLink = '';\n      if (s.testSub) {\n  \
    \      secondaryLink = `\n        <a class=\"card-link-secondary\" href=\"https://${s.testSub}.${DOMAIN}\" data-testsub=\"\
    ${s.testSub}\" data-testhealth=\"${s.testHealth || s.testSub}\" target=\"_blank\">\n          <span class=\"test-badge\"\
    >TEST</span><span class=\"test-dot\"></span> ${s.testLabel || ''}\n        </a>`;\n      }\n\n      card.innerHTML = `\n\
    \        <div class=\"card-icon ${s.icon}\">\n          <svg viewBox=\"0 0 18 18\" fill=\"none\">${s.svg}</svg>\n    \
    \    </div>\n        <div class=\"card-header\">\n          <span class=\"card-name\">${s.name}</span>\n          <span\
    \ class=\"status checking\"><span class=\"status-dot\"></span><span class=\"status-text\">checking</span></span>\n   \
    \     </div>\n        <p class=\"card-desc\">${s.desc}</p>\n        <a class=\"card-link\" href=\"${url}\" target=\"_blank\"\
    >${label}${EXTERNAL_LINK_SVG}</a>${secondaryLink}`;\n      return card;\n    }\n\n    function renderCards() {\n     \
    \ const pool = document.getElementById('card-pool');\n      // data-order = this card's rank in the already-alphabetized\
    \ SERVICES\n      // array -- placeCard() below inserts by this rank rather than by\n      // arrival order, since health\
    \ checks resolve concurrently/out of\n      // order (see placeCard's comment) and a plain appendChild there would\n \
    \     // place cards in whatever order their network request happened to\n      // finish, not alphabetically.\n     \
    \ SERVICES.forEach((s, i) => {\n        const card = buildCard(s);\n        card.dataset.order = i;\n        pool.appendChild(card);\n\
    \      });\n    }\n\n    let activeTab = 'online';\n\n    function switchTab(tab) {\n      activeTab = tab;\n      document.querySelectorAll('.tab-btn').forEach(btn\
    \ => {\n        btn.classList.toggle('active', btn.dataset.tab === tab);\n      });\n      applyTabVisibility();\n   \
    \ }\n\n    function applyTabVisibility() {\n      ['online', 'offline'].forEach(t => {\n        const s = document.getElementById(`section-${t}`);\n\
    \        const hasCards = s.querySelectorAll('.grid .card').length > 0;\n        s.style.display = (t === activeTab &&\
    \ hasCards) ? '' : 'none';\n      });\n    }\n\n    // Place a card into the correct online/offline section under its\
    \ category\n    // (and subgroup, if it has one -- categories without subgroups fall back\n    // to a single direct grid,\
    \ same as before subgroups existed).\n    function placeCard(card, isOnline) {\n      const cat = card.dataset.category;\n\
    \      const subcat = card.dataset.subcategory;\n      const sectionId = isOnline ? 'section-online' : 'section-offline';\n\
    \      const section = document.getElementById(sectionId);\n      const catDiv = section.querySelector(`[data-cat=\"${cat}\"\
    ]`);\n\n      let grid;\n      if (subcat) {\n        let subgroup = catDiv.querySelector(`.subgroup[data-subcat=\"${subcat}\"\
    ]`);\n        if (!subgroup) {\n          subgroup = document.createElement('div');\n          subgroup.className = 'subgroup';\n\
    \          subgroup.dataset.subcat = subcat;\n          const label = document.createElement('p');\n          label.className\
    \ = 'subgroup-label';\n          label.textContent = SUBCATEGORY_LABELS[subcat] || subcat;\n          grid = document.createElement('div');\n\
    \          grid.className = 'grid';\n          subgroup.append(label, grid);\n          catDiv.appendChild(subgroup);\n\
    \        } else {\n          grid = subgroup.querySelector('.grid');\n        }\n      } else {\n        grid = catDiv.querySelector(':scope\
    \ > .grid');\n        if (!grid) {\n          grid = document.createElement('div');\n          grid.className = 'grid';\n\
    \          catDiv.appendChild(grid);\n        }\n      }\n      // Insert by data-order (this card's rank in the alphabetized\
    \ SERVICES\n      // array) rather than appendChild -- cards arrive here in whatever\n      // order their async health\
    \ check happened to resolve (see\n      // checkService/recheckAll), not alphabetically, so a plain append\n      // would\
    \ undo the sort every time cards get placed or re-placed.\n      const order = Number(card.dataset.order);\n      const\
    \ next = Array.from(grid.children).find(c => Number(c.dataset.order) > order);\n      grid.insertBefore(card, next ||\
    \ null);\n      updateVisibility();\n    }\n\n    // Show/hide category/subgroup groups, update tab counts, apply active\
    \ tab\n    function updateVisibility() {\n      ['online', 'offline'].forEach(t => {\n        const section = document.getElementById(`section-${t}`);\n\
    \        let count = 0;\n        section.querySelectorAll('.category').forEach(cat => {\n          let n = 0;\n      \
    \    cat.querySelectorAll('.grid').forEach(g => { n += g.children.length; });\n          cat.style.display = n > 0 ? ''\
    \ : 'none';\n          cat.querySelectorAll('.subgroup').forEach(sg => {\n            sg.style.display = sg.querySelector('.grid').children.length\
    \ > 0 ? '' : 'none';\n          });\n          count += n;\n        });\n        document.querySelector(`.tab-btn[data-tab=\"\
    ${t}\"] .tab-count`).textContent = count;\n      });\n      applyTabVisibility();\n    }\n\n    async function pingHealth(service)\
    \ {\n      try {\n        const res = await fetch(`/health/${service}`, { signal: AbortSignal.timeout(6000), redirect:\
    \ 'manual', cache: 'no-store' });\n        return res.status === 0 || (res.status >= 200 && res.status < 500);\n     \
    \ } catch {\n        return false;\n      }\n    }\n\n    async function checkService(card) {\n      const service = card.dataset.service;\n\
    \      const badge = card.querySelector('.status');\n      const text  = badge.querySelector('.status-text');\n      //\
    \ Any card can carry one or more secondary \"test instance\" links --\n      // set testSub (and optionally testHealth/testLabel)\
    \ on its SERVICES\n      // entry and it's automatically OR'd into the main status (online if\n      // the main instance\
    \ OR any test instance is up).\n      const testLinks = Array.from(card.querySelectorAll('.card-link-secondary[data-testsub]'));\n\
    \n      const [mainUp, testResults] = await Promise.all([\n        pingHealth(service),\n        Promise.all(testLinks.map(link\
    \ => pingHealth(link.dataset.testhealth || link.dataset.testsub))),\n      ]);\n\n      testLinks.forEach((link, i) =>\
    \ {\n        const dot = link.querySelector('.test-dot');\n        if (dot) dot.className = `test-dot ${testResults[i]\
    \ ? 'online' : 'offline'}`;\n      });\n\n      const up = mainUp || testResults.some(Boolean);\n\n      badge.className\
    \ = `status ${up ? 'online' : 'offline'}`;\n      text.textContent = up ? 'online' : 'offline';\n      placeCard(card,\
    \ up);\n    }\n\n    // Re-check every card in place -- placeCard() already inserts each card\n    // at its correct sorted\
    \ position (data-order is a fixed alphabetical\n    // rank) and moves it between the online/offline grids if its status\n\
    \    // changed, so there's no need to clear categories out first. Doing that\n    // used to make every section/tab-count\
