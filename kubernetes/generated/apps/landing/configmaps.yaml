  services-landing-entrypoint-sh: |
    #!/bin/sh
    set -e
    YEAR=$(date +%Y)
    sed \
      -e "s/DOMAIN_PLACEHOLDER/${DOMAIN}/g" \
      -e "s/AUTHOR_PLACEHOLDER/${AUTHOR}/g" \
      -e "s/LOCATION_PLACEHOLDER/${LOCATION}/g" \
      -e "s/YEAR_PLACEHOLDER/${YEAR}/g" \
      -e "s/SITE_NAME_PLACEHOLDER/${SITE_NAME}/g" \
      -e "s/TAGLINE_PLACEHOLDER/${TAGLINE}/g" \
      -e "s/PLAUSIBLE_SCRIPT_PLACEHOLDER/${PLAUSIBLE_SCRIPT}/g" \
      /template/index.html > /usr/share/nginx/html/index.html
    # nginx.conf needs DOMAIN too — some health checks (Zulip's) validate the
    # Host header strictly and reject anything but the real configured domain.
    # The health checks proxy through variables, so nginx needs an explicit DNS
    # resolver. "auto" takes this container's own nameserver from
    # /etc/resolv.conf: Docker's embedded DNS (127.0.0.11) under Compose,
    # kube-dns under Kubernetes. Upstreams get UPSTREAM_SUFFIX appended (empty
    # under Compose; ".apps.svc.cluster.local" under Kubernetes, because nginx's
    # resolver doesn't apply the pod's search domains).
    RESOLVER="${NGINX_RESOLVER:-auto}"
    if [ "$RESOLVER" = "auto" ]; then
      RESOLVER=$(awk '/^nameserver/ {print $2; exit}' /etc/resolv.conf)
      case "$RESOLVER" in *:*) RESOLVER="[$RESOLVER]" ;; esac
    fi
    sed \
      -e "s/DOMAIN_PLACEHOLDER/${DOMAIN}/g" \
      -e "s/RESOLVER_PLACEHOLDER/${RESOLVER}/g" \
      -e "s/UPSTREAM_SUFFIX_PLACEHOLDER/${UPSTREAM_SUFFIX:-}/g" \
      -e "s/WG_EASY_HOST_PLACEHOLDER/${WG_EASY_HOST:-172.18.0.1}/g" \
      /template/nginx.conf > /etc/nginx/conf.d/default.conf
    exec nginx -g 'daemon off;'
  services-landing-index-html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>SITE_NAME_PLACEHOLDER</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --pt-accent: #1D9E75;
          --pt-accent-dark: #0F6E56;
          --bg-primary: #ffffff;
          --bg-secondary: #f5f5f3;
          --text-primary: #1a1a1a;
          --text-secondary: #6b6b6b;
          --text-tertiary: #9b9b9b;
          --border: rgba(0,0,0,0.10);
          --border-hover: rgba(0,0,0,0.22);
          --shadow: 0 1px 3px rgba(0,0,0,0.06);
          --shadow-hover: 0 4px 12px rgba(0,0,0,0.10);
          --radius-md: 8px;
          --radius-lg: 12px;
          --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
          :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #161616;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-tertiary: #505050;
            --border: rgba(255,255,255,0.10);
            --border-hover: rgba(255,255,255,0.22);
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.4);
            --pt-accent: #2bc492;
            --pt-accent-dark: #1D9E75;
          }
        }

        body {
          font-family: var(--font);
          background: var(--bg-secondary);
          color: var(--text-primary);
          min-height: 100vh;
          padding: 2rem 1.5rem;
        }

        .wrap {
          max-width: 1400px;
          margin: 0 auto;
        }

        /* ── Header ────────────────────────────────────────────────────── */
        .header {
          text-align: center;
          padding: 2.5rem 0 2rem;
          border-bottom: 0.5px solid var(--border);
          margin-bottom: 2.5rem;
        }

        .logo {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 0.75rem;
        }

        .logo-mark {
          width: 40px;
          height: 40px;
          border-radius: var(--radius-md);
          background: var(--pt-accent);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }

        .logo-mark svg { width: 22px; height: 22px; }

        .logo-name {
          font-size: 24px;
          font-weight: 600;
          color: var(--text-primary);
          letter-spacing: -0.4px;
        }

        .logo-name span { color: var(--pt-accent); }

        .tagline {
          font-size: 15px;
          color: var(--text-secondary);
          line-height: 1.6;
        }

        .docs-link {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 13px;
          font-weight: 500;
          color: var(--pt-accent);
          text-decoration: none;
          padding: 5px 12px;
          margin-left: auto;
          align-self: center;
          border-radius: 999px;
          border: 1px solid var(--border);
          transition: border-color 0.15s ease, background 0.15s ease;
        }

        .docs-link:hover {
          border-color: var(--pt-accent);
          background: color-mix(in srgb, var(--pt-accent) 8%, transparent);
        }

        .docs-link svg { width: 14px; height: 14px; }

        /* ── Tab bar ───────────────────────────────────────────────────── */
        .tab-bar {
          display: flex;
          gap: 2px;
          margin-bottom: 2rem;
          border-bottom: 1px solid var(--border);
        }

        .tab-btn {
          display: flex;
          align-items: center;
          gap: 7px;
          padding: 0.5rem 1.125rem 0.625rem;
          font-size: 13px;
          font-weight: 500;
          color: var(--text-secondary);
          background: none;
          border: none;
          border-bottom: 2px solid transparent;
          margin-bottom: -1px;
          cursor: pointer;
          transition: color 0.15s, border-color 0.15s;
          font-family: var(--font);
        }

        .tab-btn:hover { color: var(--text-primary); }

        .tab-btn.active {
          color: var(--text-primary);
          border-bottom-color: var(--pt-accent);
        }

        .tab-count {
          font-size: 11px;
          font-weight: 600;
          padding: 1px 7px;
          border-radius: 20px;
          background: var(--border);
          color: var(--text-secondary);
          transition: background 0.2s, color 0.2s;
        }

        .tab-btn.active[data-tab="online"]  .tab-count { background: var(--pt-accent); color: #fff; }
        .tab-btn.active[data-tab="offline"] .tab-count { background: #c0392b; color: #fff; }

        /* ── Status groups (Online / Offline) ──────────────────────────── */
        .status-group { margin-bottom: 3rem; }

        .sg-dot { display: none; }

        /* ── Category sections (within each status group) ──────────────── */
        .category { margin-bottom: 2rem; }

        .section-label {
          font-size: 11px;
          font-weight: 600;
          color: var(--text-tertiary);
          letter-spacing: 0.1em;
          text-transform: uppercase;
          margin-bottom: 0.875rem;
        }

        /* ── Subgroups (within a category) ──────────────────────────────── */
        .subgroup { margin-bottom: 1.25rem; }
        .subgroup:last-child { margin-bottom: 0; }

        .subgroup-label {
          font-size: 10px;
          font-weight: 600;
          color: var(--text-tertiary);
          letter-spacing: 0.06em;
          text-transform: uppercase;
          opacity: 0.7;
          margin-bottom: 0.625rem;
        }

        /* ── Responsive grid ───────────────────────────────────────────── */
        .grid {
          display: grid;
          gap: 12px;
          grid-template-columns: 1fr;
        }

        @media (min-width: 480px) {
          .grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 768px) {
          .grid { grid-template-columns: repeat(3, 1fr); }
          body { padding: 2rem 2rem; }
        }

        @media (min-width: 1100px) {
          .grid { grid-template-columns: repeat(4, 1fr); }
          body { padding: 2.5rem 3rem; }
        }

        @media (min-width: 1400px) {
          .grid { grid-template-columns: repeat(5, 1fr); }
        }

        /* ── Cards ─────────────────────────────────────────────────────── */
        .card {
          background: var(--bg-primary);
          border: 0.5px solid var(--border);
          border-radius: var(--radius-lg);
          padding: 1.125rem;
          display: flex;
          flex-direction: column;
          gap: 10px;
          box-shadow: var(--shadow);
          transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
          text-decoration: none;
          cursor: default;
        }

        .card:hover {
          border-color: var(--border-hover);
          box-shadow: var(--shadow-hover);
          transform: translateY(-1px);
        }

        .card-icon {
          width: 34px;
          height: 34px;
          border-radius: var(--radius-md);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }

        .card-icon.teal   { background: #E1F5EE; }
        .card-icon.blue   { background: #E6F1FB; }
        .card-icon.purple { background: #EEE6FB; }
        .card-icon.orange { background: #FBF1E6; }
        .card-icon.red    { background: #FBE6E6; }
        .card-icon.pink   { background: #FBE6F3; }
        .card-icon.gray   { background: #EBEBEB; }
        .card-icon.yellow { background: #FBF8E6; }
        .card-icon.green  { background: #E8F5E9; }

        @media (prefers-color-scheme: dark) {
          .card-icon.teal   { background: #04342C; }
          .card-icon.blue   { background: #042C53; }
          .card-icon.purple { background: #2C0453; }
          .card-icon.orange { background: #532C04; }
          .card-icon.red    { background: #530404; }
          .card-icon.pink   { background: #530432; }
          .card-icon.gray   { background: #333333; }
          .card-icon.yellow { background: #3D3804; }
          .card-icon.green  { background: #0A2E0C; }
        }

        .card-icon svg { width: 18px; height: 18px; }

        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
        }

        .card-name {
          font-size: 14px;
          font-weight: 500;
          color: var(--text-primary);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* ── Status badge ──────────────────────────────────────────────── */
        .status {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          font-size: 10px;
          font-weight: 500;
          padding: 2px 7px;
          border-radius: 20px;
          white-space: nowrap;
          flex-shrink: 0;
          transition: background 0.3s, color 0.3s;
        }

        .status.checking { color: #888; background: #ebebeb; }
        .status.online   { color: var(--pt-accent-dark); background: #E1F5EE; }
        .status.offline  { color: #c0392b; background: #FBE6E6; }

        @media (prefers-color-scheme: dark) {
          .status.checking { color: #666; background: #2a2a2a; }
          .status.online   { background: #04342C; color: #2bc492; }
          .status.offline  { background: #530404; color: #e57373; }
        }

        .status-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          flex-shrink: 0;
          transition: background 0.3s;
        }

        .status.checking .status-dot { background: #999; }
        .status.online   .status-dot { background: var(--pt-accent); }
        .status.offline  .status-dot { background: #c0392b; }

        /* ── Card body ─────────────────────────────────────────────────── */
        .card-desc {
          font-size: 12px;
          color: var(--text-secondary);
          line-height: 1.5;
          flex: 1;
        }

        .card-link {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          font-size: 12px;
          color: var(--pt-accent);
          font-weight: 500;
          margin-top: 2px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .card-link svg { width: 11px; height: 11px; flex-shrink: 0; }

        .card-link-secondary {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          font-size: 11px;
          color: var(--text-tertiary);
          font-weight: 500;
          margin-top: 4px;
          overflow: hidden;
