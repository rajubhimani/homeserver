  setup-md: "# Homeserver\n\n> Self-hosted personal cloud on your own hardware.\n> Replaces Google Drive, Google Photos, Netflix,\
    \ and more.\n> Family-ready with individual logins.\n\n---\n\n## What's in the stack\n\n64 services grouped the same way\
    \ as the [landing page](docs/07-landing.md) tiles. Bare\nlinks \u2014 hover (or tap-and-hold on mobile) any name for what\
    \ it does and what it replaces.\n\n### Storage & Media\n\n[Nextcloud](docs/services/nextcloud.md \"Personal file storage,\
    \ sync, and sharing. Google Drive alternative with calendar, contacts, and more.\") \xB7\n[Immich](docs/services/immich.md\
    \ \"Self-hosted photo and video backup. Google Photos alternative with facial recognition and smart search.\") \xB7\n\
    [Jellyfin](docs/services/jellyfin.md \"Stream movies, TV shows, and music from your own server. Netflix alternative with\
    \ no subscriptions.\") \xB7\n[Syncthing](docs/services/syncthing.md \"Continuous P2P file sync between your devices. No\
    \ cloud middleman \u2014 direct device-to-device. Replaces: Dropbox Sync.\") \xB7\n[Audiobookshelf](docs/services/audiobookshelf.md\
    \ \"Self-hosted audiobook and podcast server. Stream from anywhere with the mobile app. Replaces: Audible.\")\n\n### Productivity\n\
    \n**Notes & Knowledge** \u2014 [Trilium Notes](docs/services/trilium.md \"Hierarchical, scriptable notes with attributes\
    \ and relations. A personal wiki + database hybrid.\") \xB7 [SilverBullet](docs/services/silverbullet.md \"Markdown notes\
    \ with a query language over your own space. Lightweight, single space. Replaces: Obsidian (self-hosted).\") \xB7 [Outline](docs/services/outline.md\
    \ \"Polished self-hosted team wiki and docs, good search. Logs in via Authentik. Replaces: Notion / Confluence.\") \xB7\
    \ [BookStack](docs/services/bookstack.md \"Shelves/books/chapters/pages wiki. One book per homelab service, one page per\
    \ gotcha. Replaces: Confluence.\") \xB7 [AppFlowy](docs/services/appflowy.md \"Open-source Notion alternative. Collaborative\
    \ docs, databases, kanban, and AI writing tools.\") \xB7 [Excalidraw](docs/services/excalidraw.md \"Hand-drawn-style whiteboard\
    \ for diagrams and sketches. Local-only by default, no server-side storage. Replaces: draw.io / Miro.\") \xB7 [Karakeep](docs/services/karakeep.md\
    \ \"Bookmark manager with AI auto-tagging and full-text search of saved pages. Replaces: Pocket / Raindrop.\") \xB7 [Nextcloud\
    \ Whiteboard](docs/services/whiteboard.md \"Infinite-canvas whiteboard for sketching and diagramming together in real\
    \ time, built into Nextcloud \u2014 a self-hosted Miro alternative.\")\n\n**Project & Task Mgmt** \u2014 [Vikunja](docs/services/vikunja.md\
    \ \"To-do list and task management app. Organize projects, set due dates, and track work. Replaces: Todoist.\") \xB7 [OpenProject](docs/services/openproject.md\
    \ \"Open-source project management. Gantt charts, Kanban, sprints, wikis and time tracking. Replaces: Jira / Asana.\"\
    ) \xB7 [Plane](docs/services/plane.md \"Modern open-source project management. Issues, cycles, modules and analytics.\
    \ Jira alternative.\")\n\n**Documents** \u2014 [Paperless-ngx](docs/services/paperless.md \"Scan, index, and archive all\
    \ your documents. Full-text search with OCR \u2014 go paperless. Replaces: Scansnap cloud.\") \xB7 [Stirling PDF](docs/services/stirling-pdf.md\
    \ \"Full PDF toolkit with Word/Excel conversion via LibreOffice. Start manually on demand. Replaces: Adobe Acrobat.\"\
    ) \xB7 [Documenso](docs/services/documenso.md \"Sign documents electronically and collect signatures from others \u2014\
    \ a self-hosted alternative to DocuSign.\") \xB7 [ONLYOFFICE](docs/services/onlyoffice.md \"Real-time collaborative editing\
    \ for Word, Excel, and PowerPoint documents stored in Nextcloud \u2014 a self-hosted Microsoft Office alternative built\
    \ for native .docx/.xlsx/.pptx compatibility.\")\n\n**Finance & Business** \u2014 [Firefly III](docs/services/firefly.md\
    \ \"Personal finance manager. Track income, expenses, budgets and accounts in one place. Replaces: YNAB / Mint.\") \xB7\
    \ [Ghostfolio](docs/services/ghostfolio.md \"Investment portfolio tracker for stocks, ETFs, mutual funds and crypto across\
    \ all your brokers. Live prices, performance, allocation and dividends in one dashboard. Replaces: Kuvera / INDmoney /\
    \ Sharesight.\") \xB7 [InvoiceShelf](docs/services/invoiceshelf.md \"Self-hosted invoicing and billing. Create invoices,\
    \ track expenses, accept payments. Replaces: FreshBooks.\") \xB7 [Cal.com](docs/services/calcom.md \"Share a booking page\
    \ so people can schedule meetings with you automatically \u2014 a self-hosted alternative to Calendly.\") \xB7 [OrangeHRM](docs/services/orangehrm.md\
    \ \"Open-source HR management \u2014 employee records, leave, time tracking, recruitment. Replaces: BambooHR / Workday.\"\
    )\n\n**Reading & Feeds** \u2014 [Miniflux](docs/services/miniflux.md \"Minimalist RSS reader. Follow blogs, news, and\
    \ podcasts without tracking or algorithms. Replaces: Feedly.\") \xB7 [Wallabag](docs/services/wallabag.md \"Read-it-later\
    \ app, self-hosted Pocket alternative. Saves a clean, readable copy of articles.\") \xB7 [Listmonk](docs/services/listmonk.md\
    \ \"Send and manage email newsletters and mailing lists \u2014 a self-hosted alternative to Mailchimp.\")\n\n**Chat &\
    \ Messaging** \u2014 [Mattermost](docs/services/mattermost.md \"Slack-style team chat: channels, DMs, threads. Lighter\
    \ self-hosted footprint than Rocket.Chat/Zulip.\") \xB7 [Rocket.Chat](docs/services/rocketchat.md \"Full-featured team\
    \ chat with channels, apps, and webhooks. Heaviest of the chat playground trio (MongoDB replica set + NATS). Replaces:\
    \ Slack.\") \xB7 [Zulip](docs/services/zulip.md \"Topic-threaded team chat, good for organized async discussion. Postgres\
    \ + RabbitMQ + Redis + Memcached backing services. Replaces: Slack.\") \xB7 [Mail-Archiver](docs/services/mail-archiver.md\
    \ \"Continuous backup of your real mailboxes (Microsoft 365 via Graph API, or any IMAP). Search, export as mbox/EML, and\
    \ copy everything into a new provider when you switch. Replaces: Microsoft Purview / MailStore.\") \xB7 [Bichon](docs/services/bichon.md\
    \ \"Lightweight email archiver with fast full-text search, tags, threads, and attachment browsing. Single container, no\
    \ database - pulls from any IMAP account (OAuth2 included). Replaces: MailStore Home.\")\n\n**AI** \u2014 [Open WebUI](docs/services/open-webui.md\
    \ \"Chat interface for AI models running entirely on your own hardware, served by Ollama \u2014 like ChatGPT, but private,\
    \ offline, and free to use.\") \xB7 [Ollama](docs/services/ollama.md \"Runs large language models locally and serves them\
    \ to Open WebUI over the internal network \u2014 the actual AI engine behind the chat interface. Also reachable directly\
    \ (behind login) for other tools that speak the Ollama API.\")\n\n**Home** \u2014 [Mealie](docs/services/mealie.md \"\
    Recipe manager and meal planner. Save recipes, plan your week, and generate shopping lists. Replaces: Recipe apps.\")\
    \ \xB7 [HomeBox](docs/services/homebox.md \"Home inventory tracker with QR labels. Log what's in every box, drawer, and\
    \ closet, then scan to find it. Replaces: Sortly.\")\n\n### Dev & Security\n\n**Git & CI** \u2014 [Forgejo](docs/services/forgejo.md\
    \ \"Self-hosted Git with repos, issues, pull requests, and CI/CD actions. Open governance, low resource usage. Replaces:\
    \ GitHub.\") \xB7 [GitLab CE](docs/services/gitlab.md \"Full DevOps platform. Self-hosted Git with CI/CD pipelines, container\
    \ registry, and issue tracking. Replaces: GitHub / GitLab.com.\")\n\n**Identity & Secrets** \u2014 [Vaultwarden](docs/services/vaultwarden.md\
    \ \"Self-hosted password manager. Bitwarden-compatible \u2014 use any Bitwarden app to sync passwords. Replaces: 1Password\
    \ / LastPass.\") \xB7 [Authentik](docs/services/authentik.md \"Single sign-on for all your services. One login, one identity,\
    \ full access control. Replaces: Okta / Auth0.\")\n\n**Automation & Low-code** \u2014 [n8n](docs/services/n8n.md \"Self-hosted\
    \ workflow automation \u2014 connect apps and services together with a drag-and-drop builder, like Zapier or Make, without\
    \ writing code.\") \xB7 [Airflow](docs/services/airflow/airflow.md \"Programmatically author, schedule, and monitor workflows\
    \ as Python DAGs. The industry-standard workflow orchestrator.\") \xB7 [Temporal](docs/services/temporal/temporal.md \"\
    Durable execution engine for reliable distributed workflows \u2014 automatic retries, state persistence, and long-running\
    \ processes that survive crashes.\") \xB7 [Dagster](docs/services/dagster/dagster.md \"Data orchestrator built around\
    \ software-defined assets \u2014 track lineage, materialize pipelines, observe data quality. Ships with an empty placeholder\
    \ pipeline.\") \xB7 [NocoDB](docs/services/nocodb.md \"Turn a database into an easy-to-use spreadsheet \u2014 browse,\
    \ filter, and edit data without writing SQL. A self-hosted alternative to Airtable.\") \xB7 [Supabase](docs/services/supabase.md\
    \ \"Self-hosted backend for building apps \u2014 database, user logins, file storage, and live data updates in one place.\
    \ A self-hosted alternative to Firebase.\")\n\n**Tools** \u2014 [IT-Tools](docs/services/it-tools.md \"~80 browser-only\
    \ dev utilities in one place: JWT decoder, cron parser, hash/UUID/base64, regex tester. Replaces: assorted sketchy websites.\"\
    ) \xB7 [Mailpit](docs/services/mailpit.md \"SMTP catcher for the whole stack \u2014 point any service at it and see the\
    \ email it would have sent, nothing ever actually delivered. Replaces: Mailtrap.\") \xB7 [Coolify](docs/services/coolify.md\
    \ \"Deploy your own apps and websites from a Git repo with one click \u2014 a self-hosted alternative to Vercel or Heroku.\"\
    ) \xB7 [Penpot](docs/services/penpot.md \"Design app mockups, websites, and interfaces, then share them for feedback \u2014\
    \ a self-hosted alternative to Figma.\") \xB7 [Plausible](docs/services/plausible.md \"See how many people visit your\
    \ websites and what they click on, without tracking cookies \u2014 a privacy-friendly alternative to Google Analytics.\"\
    ) \xB7 [Atuin](docs/services/atuin.md \"Sync your command-line history across all your machines and search it with context\
    \ (folder, exit code) \u2014 like browser history, but for your terminal. Replaces: plain bash/zsh history file.\")\n\n\
    ### System\n\n[Uptime Kuma](docs/services/uptime-kuma.md \"Monitor all your services and get alerted when something goes\
    \ down. Self-hosted uptime tracking. Replaces: Pingdom.\") \xB7\n[Beszel](docs/services/beszel.md \"Lightweight server\
    \ monitoring. CPU, memory, disk, and Docker container stats with alerts. Replaces: Netdata / Datadog.\") \xB7\n[Observability](docs/services/observability.md\
    \ \"Dashboards showing how healthy and busy every service in this stack is \u2014 CPU, memory, and searchable logs in\
    \ one place, powered by Grafana. Replaces: Datadog / Grafana Cloud.\") \xB7\n[Portainer](docs/services/portainer.md \"\
    Docker container management UI. Inspect, start/stop, and manage all containers from the browser.\") \xB7\n[Dockge](docs/services/dockge.md\
    \ \"Fancy Docker Compose stack manager. Deploy and manage stacks via a clean web UI.\") \xB7\n[Dozzle](docs/services/dozzle.md\
    \ \"Real-time Docker container log viewer in the browser. Quickly tail logs from any running container.\") \xB7\n[Guacamole](docs/services/guacamole.md\
    \ \"Remote-control another computer from any web browser, no software to install \u2014 over VNC, RDP, or SSH, from your\
    \ LAN or anywhere on the internet. Replaces: TeamViewer / AnyDesk.\") \xB7\n[Browser Hub](docs/services/browser-hub.md\
    \ \"One login, then pick from ten real browsers (Firefox, Chromium, Brave, Mullvad Browser, LibreWolf, Zen, Helium, Chrome,\
    \ Edge, Vivaldi) running on the server and controlled from any device \u2014 the page loads and the traffic goes out from\
    \ your server, so it reaches sites your local connection can't. Each browser only exists at its own /path/ here, not its\
    \ own web address.\") \xB7\n[Firefox](docs/services/firefox.md \"General-purpose remote Firefox \u2014 part of the Browser\
    \ Hub, one login for all ten browsers here.\") \xB7\n[Chromium](docs/services/chromium.md \"Remote Chromium \u2014 for\
    \ sites/tools that specifically need Chrome/Chromium. Part of the Browser Hub, one login for all ten browsers here.\"\
    ) \xB7\n[Brave](docs/services/brave.md \"Privacy-focused, ad-blocking-by-default remote browser. Part of the Browser Hub,\
    \ one login for all ten browsers here.\") \xB7\n[Mullvad Browser](docs/services/mullvad-browser.md \"Hardened, anti-fingerprinting\
    \ Firefox fork built with the Tor Project \u2014 does not itself route traffic through the Tor network. Part of the Browser\
    \ Hub, one login for all ten browsers here.\") \xB7\n[LibreWolf](docs/services/librewolf.md \"Privacy-hardened Firefox\
    \ fork with telemetry removed and uBlock Origin built in. Part of the Browser Hub, one login for all ten browsers here.\"\
    ) \xB7\n[Zen](docs/services/zen.md \"Firefox-based browser with vertical tabs, split view and a clean, modern layout.\
    \ Part of the Browser Hub, one login for all ten browsers here.\") \xB7\n[Helium](docs/services/helium.md \"Privacy-first\
    \ Chromium-based browser with ad-blocking built in and Google services stripped out. Part of the Browser Hub, one login\
    \ for all ten browsers here.\") \xB7\n[Chrome](docs/services/chrome.md \"The official Google Chrome, for sites that only\
    \ work properly in Chrome. Sends usage data to Google \u2014 use it for compatibility, not everyday privacy. Part of the\
    \ Browser Hub, one login for all ten browsers here.\") \xB7\n[Edge](docs/services/edge.md \"The official Microsoft Edge,\
    \ for Microsoft 365 and sites that insist on Edge. Sends usage data to Microsoft \u2014 use it for compatibility, not\
    \ everyday privacy. Part of the Browser Hub, one login for all ten browsers here.\") \xB7\n[Vivaldi](docs/services/vivaldi.md\
    \ \"Power-user Chromium browser with tab stacking, built-in mail and calendar, and heavy customisation. Part of the Browser\
    \ Hub, one login for all ten browsers here.\") \xB7\n[AdGuard Home](docs/services/adguard-home.md \"Network-wide DNS ad/tracker\
    \ blocking. DNS itself is LAN-only (port 53) \u2014 this links to the admin panel. Replaces: Pi-hole.\") \xB7\n[wg-easy](docs/services/wg-easy.md\
    \ \"Self-hosted WireGuard VPN with a web UI. Full-tunnel or split-tunnel client profiles, reachable over IPv6 to work\
    \ around ISP CGNAT with zero port forwarding. Replaces: Tailscale.\") \xB7\n[ntfy](docs/services/ntfy.md \"Self-hosted\
    \ push notifications. Scripts and services curl a message straight to your phone. Replaces: Pushover / Pushbullet.\")\
    \ \xB7\n[Docs](docs/services/docs.md \"Searchable site over every doc in this repo \u2014 setup guides, service reference,\
    \ all per-service notes, live off the source files. Replaces: Read the Docs.\")\n\n### Infrastructure\n\n[Cloudflare Tunnel](docs/services/cloudflared.md\
    \ \"Public HTTPS access, no open ports \u2014 replaces Port forwarding\") \xB7\n[nginx-plain](docs/04-nginx.md \"Reverse\
    \ proxy, default \u2014 replaces Manual nginx config\") \xB7\nNginx Proxy Manager (optional, UI-based reverse proxy \u2014\
    \ see [04 \u2014 Nginx](docs/04-nginx.md)) \xB7\n[CrowdSec](docs/services/crowdsec.md \"Collaborative intrusion detection,\
    \ detection-only, see TODO.md \u2014 replaces fail2ban\") \xB7\n[ClamAV](docs/services/clamav.md \"Antivirus scanning\
    \ daemon backing Nextcloud's files_antivirus app. No UI of its own.\") \xB7\n[Landing page](docs/07-landing.md \"Service\
    \ dashboard with live status\")\n\nFull per-service detail (ports, setup steps, gotchas): [Services Reference](docs/11-services-reference.md).\n\
    \n---\n\n## How traffic flows\n\n```mermaid\nsequenceDiagram\n    participant B as Browser\n    participant CF as Cloudflare\
    \ Edge\n    participant CT as cloudflared\n    participant NX as nginx-plain:80\n    participant C as container (by name)\n\
    \n    B->>CF: HTTPS request\n    Note over CF: TLS terminates here\n    CF->>CT: outbound tunnel connection<br/>(no inbound\
    \ port ever opened)\n    CT->>NX: plain HTTP\n    NX->>C: proxy_pass, routed by server_name\n    C-->>NX: response\n \
    \   NX-->>CT: response\n    CT-->>CF: response\n    CF-->>B: HTTPS response\n```\n\nCloudflare handles TLS. Internal traffic\
    \ is plain HTTP.\n`nginx-plain` resolves services by Docker container name on the `homeserver` network.\n\n> **Optional:**\
    \ replace `nginx-plain` with Nginx Proxy Manager (NPM) for a UI-based config\n> and Let's Encrypt. See [04 \u2014 Nginx](docs/04-nginx.md).\n\
    \n---\n\n## Requirements\n\n- Any x86-64 machine (laptop, mini PC, old desktop) \u2014 Linux, Mac, or Windows all work\n\
    - Minimum 4 GB RAM (8 GB+ recommended)\n- One drive for OS + Docker (SSD preferred)\n- One drive for data (internal or\
    \ USB, formatted ext4)\n- Ubuntu 24.04 LTS (or any Debian-based distro) for the primary/production deployment target described\
    \ below \u2014 Docker Desktop works fine on Mac/Windows for development\n- [uv](https://docs.astral.sh/uv/) to run `homeserver.py`\
    \ (`uv sync` once, then `uv run homeserver.py ...`) \u2014 no other dependencies, it's stdlib-only. `pyproject.toml` pins\
    \ the exact Python minor version (currently 3.14); `uv` downloads a matching interpreter automatically if you don't already\
    \ have one, so you don't need to install Python yourself\n- A domain on Cloudflare \u2014 or use [Tailscale](docs/03b-tailscale.md)\
    \ for local/testing access\n\n---\n\n## Setup path\n\nGo through these in order. Each doc links to the next.\n\n| # |\
    \ Doc | What you do |\n| --- | --- | --- |\n| [01](docs/01-data-drive.md) | Prepare Data Drive | Format the data drive,\
    \ mount it, create the folder structure |\n| [02](docs/02-docker-network.md) | Docker + Shared Network | Install Docker,\
    \ create the `homeserver` bridge network |\n| [03](docs/03-access.md) | **Choose access method** | Pick Cloudflare (public)\
    \ or Tailscale (private) \u2014 only do one |\n| [03a](docs/03a-cloudflare.md) | \u21B3 Cloudflare Tunnel | Set up cloudflared\
    \ + DNS for public HTTPS access |\n| [03b](docs/03b-tailscale.md) | \u21B3 Tailscale | Private access by IP, no domain\
    \ needed |\n| [04](docs/04-nginx.md) | Reverse proxy | nginx-plain (default) or Nginx Proxy Manager (optional UI) |\n\
    | [05](docs/05-nextcloud.md) | Nextcloud | File storage, family accounts, external storage |\n| [06](docs/06-immich.md)\
    \ | Immich | Photo backup, mobile app, face recognition (optional) |\n| [07](docs/07-landing.md) | Landing Page | Service\
    \ dashboard showing live status for all services |\n| [08](docs/08-maintenance.md) | Maintenance | Monthly updates, health\
    \ checks, remote management, resource-constrained hosts, troubleshooting |\n| [09](docs/09-firewall.md) | Firewall | UFW\
    \ rules, port binding strategy (dev vs prod) |\n| [10](docs/10-new-services.md) | New Services | Add any service from\
    \ the stack \u2014 step-by-step for each |\n| [11](docs/11-services-reference.md) | Services Reference | All ports, proxy\
    \ config, per-service notes |\n| [12](docs/12-orchestration.md) | Orchestration Services | Airflow vs. Temporal vs. Dagster\
    \ \u2014 what each is actually for and how they compose (only relevant if you're using one of the three) |\n| [13](docs/13-auth-posture.md)\
    \ | Auth Posture | Which services have real accounts vs. a shared password vs. no login at all, and which are realistic\
    \ candidates for Authentik forward-auth |\n\n**Start here \u2192 [01 \u2014 Prepare Data Drive](docs/01-data-drive.md)**\n\
    \n---\n\n## Reference\n\nQuick links for day-to-day use once the stack is running.\n\n| Doc | When to use |\n| --- | ---\
    \ |\n| [Services Reference](docs/11-services-reference.md) | Look up any service's port, proxy config, or setup notes\
    \ |\n| [Maintenance](docs/08-maintenance.md) | Update images, check health, troubleshoot |\n| [Docker Cheatsheet](docs/docker-cheatsheet.md)\
    \ | Images, containers, volumes, networks, cleanup commands |\n| [Kubernetes Pilot](docs/12-kubernetes-pilot.md) | Experimental,\
    \ parallel to Compose \u2014 not required setup |\n\n---\n\n## Quick commands\n\n```bash\n# Service tiers \u2014 MIN \u2282\
    \ CORE \u2282 ALL\nuv run homeserver.py dev up min          # infrastructure only (beszel, cloudflared, nginx-plain, landing,\
    \ docs, portainer)\nuv run homeserver.py dev up core         # min + nextcloud\nuv run homeserver.py dev up all      \
    \    # everything (core + all extra services)\n\nuv run homeserver.py dev down min        # stop min (reverse order)\n\
    uv run homeserver.py dev down core       # stop core (reverse order)\nuv run homeserver.py dev down all        # stop\
    \ everything, including optional profiles\n\n# Start / stop one service\nuv run homeserver.py dev up jellyfin\nuv run\
    \ homeserver.py dev down jellyfin\n\n# Follow logs\nuv run homeserver.py dev logs nextcloud\n\n# Immich \u2014 ML (face/object\
    \ recognition) starts by default; exclude it with:\nuv run homeserver.py dev up immich --no-ml\n\n# Pull latest images\
    \ and recreate\nuv run homeserver.py dev update all\nuv run homeserver.py dev update running  # only currently running\
    \ services\n\n# Production (ports bound to 127.0.0.1 only)\nuv run homeserver.py prod up all\n```\n\n**Backups are automatic:**\
    \ `down` snapshots a service's data every time it stops (add `--no-backup` to skip). See the `homeserver-backups` skill\
    \ for `snapshots`/`restore --snapshot`/retention config \u2014 this is the safety net for both routine restarts and migrating\
    \ to a different machine.\n\n---\n\n## Folder structure\n\n```text\n~/homeserver/\n\u251C\u2500\u2500 homeserver.py  \
