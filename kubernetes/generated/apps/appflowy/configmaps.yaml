apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-nginx-files
  labels:
    app.kubernetes.io/part-of: homeserver
    homeserver/service: appflowy
data:
  services-appflowy-nginx-conf: |
    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 80;
            listen [::]:80;

            underscores_in_headers on;

            # GoTrue auth service
            location /gotrue/ {
                proxy_pass http://appflowy-gotrue:9999/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }

            # MinIO S3 API for presigned upload/download URLs (appflowy_cloud 0.18+
            # refuses to start without APPFLOWY_S3_PRESIGNED_URL_ENDPOINT). Same
            # block as AppFlowy-Cloud's own nginx.conf: Host must be the internal
            # MinIO host, because the URLs are signed against it.
            location /minio-api/ {
                proxy_pass http://appflowy-minio:9000;
                proxy_set_header Host appflowy-minio:9000;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;

                rewrite ^/minio-api/(.*) /$1 break;

                proxy_connect_timeout 300s;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
                proxy_request_buffering off;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                chunked_transfer_encoding off;
                client_max_body_size 0;
            }

            # AppFlowy Cloud REST API
            location /api/ {
                proxy_pass http://appflowy-cloud:8000/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                client_max_body_size 512m;
            }

            # AppFlowy Cloud WebSocket — web client sends /ws/{workspace_id}/ but
            # appflowy_cloud:0.16+ expects /ws/v2/{workspace_id}; rewrite here.
            location ~ ^/ws/(?!v[12]/)([^/?]+) {
                rewrite ^/ws/([^/?]+)(.*)$ /ws/v2/$1$2 break;
                proxy_pass http://appflowy-cloud:8000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 86400s;
            }

            # /ws/v1 and /ws/v2/{id} pass through directly
            location /ws {
                proxy_pass http://appflowy-cloud:8000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 86400s;
            }

            # Admin frontend
            location /web/ {
                proxy_pass http://appflowy-admin:3000/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }

            # Main web frontend
            location / {
                proxy_pass http://appflowy-web:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
    }
