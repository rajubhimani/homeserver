---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-triggerer
  labels:
    app.kubernetes.io/part-of: homeserver
    homeserver/service: airflow
    app.kubernetes.io/name: airflow-triggerer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow-triggerer
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: homeserver
        homeserver/service: airflow
        app.kubernetes.io/name: airflow-triggerer
      annotations:
        homeserver/config-sha256: 7e8f33c0541890aeac7cb60daaa3c4d0d6fbea357db00f5cc6ddd4fd9f843fa2
    spec:
      enableServiceLinks: false
      initContainers:
      - name: wait-db
        image: alpine:3.24.2
        envFrom:
        - secretRef:
            name: airflow-env
        command:
        - sh
        - -c
        - until nc -z -w 2 "$DB_HOST" "$DB_PORT"; do echo "waiting for $DB_HOST:$DB_PORT"; sleep 2; done
      - name: airflow-init
        image: apache/airflow:3.3.1-python3.12
        command:
        - /bin/bash
        args:
        - -c
        - |
          mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
          # Self-seeding, same "only if truly empty" guarantee as Temporal's
          # worker/Dagster's user-code: fires once, only when nothing has
          # ever populated dags/ yet (fresh clone, restored backup). Checked
          # by directory contents, not per-file, so re-running airflow-init
          # (every `up airflow`, since it's restart:no) never recreates an
          # example DAG you deliberately deleted.
          if [ -z "$(ls -A /opt/airflow/dags/*.py 2>/dev/null)" ]; then
            cp /opt/airflow/dags-examples/*.py /opt/airflow/dags/
          fi
          chown -R "$(AIRFLOW_UID):0" /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
          /entrypoint airflow db migrate
          /entrypoint airflow users create --username "$(_AIRFLOW_WWW_USER_USERNAME)" --password "$(_AIRFLOW_WWW_USER_PASSWORD)" --firstname Admin --lastname User --role Admin --email "$(_AIRFLOW_WWW_USER_EMAIL)" || true
          # email_on_failure/email_on_retry route through SmtpNotifier in
          # Airflow 3, which reads this Connection, not AIRFLOW__SMTP__* config
          # (that's the older utils.email.send_email_smtp direct-config path,
          # still set separately for anyone wiring that up instead) — without
          # this, every alert email fails with "conn_id smtp_default isn't
          # defined" even with SMTP config fully set (hit this exact error
          # building example_email_alert_on_failure.py).
          /entrypoint airflow connections add smtp_default --conn-type smtp --conn-host "$(SMTP_HOST)" --conn-port "$(SMTP_PORT)" --conn-extra "{\"from_email\": \"$(SMTP_FROM_EMAIL)\", \"disable_tls\": true, \"disable_ssl\": true}" || true
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: v-airflow-data
          mountPath: /opt/airflow/dags
          subPath: dags
        - name: v-airflow-data
          mountPath: /opt/airflow/logs
          subPath: logs
        - name: v-airflow-data
          mountPath: /opt/airflow/config
          subPath: config
        - name: v-airflow-data
          mountPath: /opt/airflow/plugins
          subPath: plugins
        - name: d-airflow-init-dags-examples
          mountPath: /opt/airflow/dags-examples
          readOnly: true
      containers:
      - name: airflow-triggerer
        image: apache/airflow:3.3.1-python3.12
        args:
        - triggerer
        envFrom:
        - configMapRef:
            name: homeserver-root
        - secretRef:
            name: airflow-env
        env:
        - name: AIRFLOW_CONFIG
          value: /opt/airflow/config/airflow.cfg
        - name: AIRFLOW__API_AUTH__JWT_SECRET
          value: $(JWT_SECRET)
        - name: AIRFLOW__API__SECRET_KEY
          value: $(API_SECRET_KEY)
        - name: AIRFLOW__CORE__AUTH_MANAGER
          value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
          value: 'true'
        - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
          value: http://airflow-apiserver:8080/execution/
        - name: AIRFLOW__CORE__EXECUTOR
          value: LocalExecutor
        - name: AIRFLOW__CORE__FERNET_KEY
          value: $(FERNET_KEY)
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: $(LOAD_EXAMPLES)
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)
        - name: PYTHONPATH
          value: /opt/airflow/dags
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - airflow jobs check --job-type TriggererJob --hostname "$HOSTNAME"
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - airflow jobs check --job-type TriggererJob --hostname "$HOSTNAME"
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 10
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - airflow jobs check --job-type TriggererJob --hostname "$HOSTNAME"
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 8
        resources:
          limits:
            memory: 384Mi
        volumeMounts:
        - name: v-airflow-data
          mountPath: /opt/airflow/dags
          subPath: dags
        - name: v-airflow-data
          mountPath: /opt/airflow/logs
