apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-init-dags-examples
  labels:
    app.kubernetes.io/part-of: homeserver
    homeserver/service: airflow
data:
  example-all-options-py: |
    """Reference DAG — every `@dag` and `@task` option in one place, each shown
    at its real default value with a one-line explanation, so the whole menu
    is visible without reading Airflow's source or hunting the docs site.

    Only a handful of these are commonly touched in practice; those are set
    for real below. Everything else is listed **commented-out, at its actual
    default** inside the same `@dag(...)`/`@task(...)` calls — a checklist to
    copy from, not a live example, since most of it (RBAC, executor pools,
    callbacks...) needs infrastructure this repo's other example DAGs don't
    set up. Uncomment + edit only what your own DAG actually needs.

    Captured against Airflow 3.3.1 (`docker exec airflow-scheduler airflow
    version`) via `inspect.signature()` against `airflow.sdk.definitions.dag.DAG`
    and `airflow.sdk.bases.operator.BaseOperator` — the real source of truth if
    this ever drifts from a future Airflow version. `sla`/`sla_miss_callback`
    are Airflow 2.x concepts removed in 3.0 (`deadline`/`DeadlineAlert` is the
    replacement, itself omitted below as too new/narrow for a first pass).
    """

    from datetime import datetime, timedelta

    from airflow.sdk import dag, task
    from airflow.utils.trigger_rule import TriggerRule
    from airflow.utils.weight_rule import WeightRule


    @dag(
        # --- commonly set ---
        dag_id="example_all_options",
        description="Reference: every @dag/@task option, real defaults documented inline",
        doc_md=__doc__,
        schedule=None,  # None = manual trigger only. Also accepts a cron string, "@daily", a timedelta, or an Asset list.
        start_date=datetime(2026, 1, 1),  # no framework default — required, either here or per-task
        catchup=False,  # real default (scheduler.catchup_by_default in airflow.cfg) — True backfills missed runs on unpause, see example_backfill.py
        tags=["example"],
        # --- everything below: commented out, shown at its real default ---
        # end_date=None,                       # stop scheduling new runs after this date
        # max_active_tasks=16,                 # concurrent task instances allowed per DAG run (airflow.cfg: max_active_tasks_per_dag)
        # max_active_runs=16,                  # concurrent runs allowed for this DAG (see example_max_active_runs.py for =1, serial execution)
        # max_consecutive_failed_dag_runs=0,   # auto-pause this DAG after N consecutive failed runs (0 = never)
        # dagrun_timeout=None,                 # timedelta — fail a whole run that's been going longer than this
        # deadline=None,                       # DeadlineAlert(s) — Airflow 3's SLA replacement, alert if a run isn't done by a computed deadline
        # default_args={},                     # dict merged into every task's own kwargs below — set retries/owner/etc. once for the whole DAG instead of per task
        # params={},                           # DAG-level runtime parameters, editable per-trigger in the UI ("Trigger DAG w/ config") — see example_variables_and_connections.py for the Variables/Connections alternative
        # access_control=None,                 # per-DAG RBAC — {"role_name": {"can_read", "can_edit"...}}
        # is_paused_upon_creation=None,        # None defers to core.dags_are_paused_at_creation (True) — False = auto-unpaused the moment it's deployed
        # render_template_as_native_obj=False, # Jinja renders {{ }} to native Python types (int/list/dict) instead of always str
        # owner_links={},                      # {"owner_name": "https://link"} — clickable owner chip in the UI
        # dag_display_name=None,               # pretty name shown in the UI instead of the raw dag_id
        # fail_fast=False,                     # True = stop scheduling every remaining task the instant one fails, instead of letting independent branches keep running
        # allowed_run_types=None,              # restrict which DagRunType values (scheduled/manual/backfill/asset_triggered) may create a run
        # template_searchpath=None,            # extra filesystem paths Jinja searches for template files
        # user_defined_macros=None,            # extra names available inside {{ }} templates
        # user_defined_filters=None,           # extra Jinja filters usable inside {{ }} templates
        # jinja_environment_kwargs=None,       # raw kwargs passed straight to the underlying jinja2.Environment
        # task_group=...,                      # advanced/internal — the DAG's own root TaskGroup, auto-created; only override if you're doing custom TaskGroup composition
        # auto_register=True,                  # advanced/internal — whether entering this DAG's context manager auto-registers it; @dag-decorated DAGs never need this touched
        # disable_bundle_versioning=False,     # advanced — opt this DAG out of DAG-bundle version pinning (multi-version DAG bundles), irrelevant to this repo's single-bundle setup
        # rerun_with_latest_version=None,      # advanced — companion to bundle versioning above
    )
    def example_all_options():
        @task(
            # --- commonly set ---
            task_id="reference_task",  # only genuinely required arg — everything else below has a real default
            # --- everything below: commented out, shown at its real default ---
            # owner="airflow",                     # shown in the UI, filterable
            # retries=0,                           # retry attempts on failure — see example_scheduled_with_retries.py
            # retry_delay=timedelta(seconds=300),  # wait between retries
            # retry_exponential_backoff=False,     # multiply retry_delay by 2^attempt instead of a fixed wait
            # max_retry_delay=None,                # cap on the delay once exponential backoff is enabled
            # execution_timeout=None,              # timedelta — fail this task instance if it runs longer than this
            # depends_on_past=False,               # True = this run waits for *yesterday's* run of the same task to succeed first
            # wait_for_downstream=False,           # True = don't start until the *previous* run's immediate downstream tasks also finished
            # trigger_rule=TriggerRule.ALL_SUCCESS,  # when this task may run relative to upstream state — see example_trigger_rules.py for the other 8 values
            # priority_weight=1,                   # higher = scheduled first when a pool/queue is contended
            # weight_rule=WeightRule.DOWNSTREAM,   # how priority_weight combines with downstream tasks' own weights
            # queue="default",                     # Celery queue name — irrelevant under this repo's LocalExecutor, matters with CeleryExecutor
            # pool=None,                           # named resource pool capping concurrent tasks (Admin -> Pools) — e.g. cap concurrent access to one scarce DB
            # pool_slots=1,                        # how many pool slots one instance of this task consumes
            # executor=None,                       # override which Executor runs just this task (mixed-executor setups only)
            # executor_config=None,                # executor-specific config, e.g. KubernetesExecutor pod overrides
            # do_xcom_push=True,                   # False = don't publish this task's return value to XCom at all
            # multiple_outputs=False,              # True = unpack a dict return value into separate named XCom entries instead of one blob
            # map_index_template=None,             # custom per-instance label for dynamically mapped tasks — see example_dynamic_task_mapping.py
            # max_active_tis_per_dag=None,         # cap concurrent instances of *this task* across all of this DAG's runs
            # max_active_tis_per_dagrun=None,      # cap concurrent instances of *this task* within one DAG run (mapped tasks)
            # on_execute_callback=None,            # callable(context) fired right before the task runs
            # on_failure_callback=None,            # callable(context) fired on task failure — see example_email_alert_on_failure.py
            # on_success_callback=None,            # callable(context) fired on task success
            # on_retry_callback=None,              # callable(context) fired when a retry is about to happen
            # on_skipped_callback=None,            # callable(context) fired when the task is skipped
            # inlets=None,                         # declared upstream Datasets/Assets this task reads (lineage)
            # outlets=None,                        # declared Datasets/Assets this task produces — powers example_asset_triggered.py-style DAGs
            # task_display_name=None,              # pretty name shown in the UI instead of the raw task_id
            # doc_md=None,                         # per-task docs, its own Details -> Docs tab (separate from the DAG-level doc_md above)
            # run_as_user=None,                    # OS user to impersonate when running (LocalExecutor; needs sudoers set up on the host)
            # allow_nested_operators=True,         # False = raise instead of silently allowing this operator to invoke another operator's .execute() inside it
        )
        def reference_task() -> str:
            return "This task exists to document options, not to do real work."

        reference_task()


    example_all_options()
  example-asset-triggered-py: |
    """Starter example — Airflow's Asset feature (renamed from "Dataset" in
    Airflow 3.0): a *label* a task's output is tagged with (outlets=), used to
    trigger a *different* DAG when that label updates. Not the same thing as a
    Dagster asset — see docs/12-orchestration.md for the real
    distinction. Two DAGs:

      example_asset_producer  — a task that updates the Asset (outlets=)
      example_asset_consumer  — scheduled to run whenever that Asset updates

    Trigger the producer manually once; the consumer run appears on its own
    shortly after, with no manual trigger and no cron schedule of its own.
    """

    from datetime import datetime

    from airflow.sdk import Asset, dag, task

    report_asset = Asset("homeserver://example/report")


    @dag(
        dag_id="example_asset_producer",
        description="Starter example: a task that updates an Asset",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example"],
    )
    def example_asset_producer():
        @task(outlets=[report_asset])
        def produce_report() -> None:
            print("Report produced — this updates the homeserver://example/report Asset.")

        produce_report()


    @dag(
        dag_id="example_asset_consumer",
        description="Starter example: scheduled to run when the Asset above updates",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=[report_asset],
        catchup=False,
        tags=["example"],
    )
    def example_asset_consumer():
        @task
        def on_report_updated() -> None:
            print("Triggered automatically because homeserver://example/report was updated.")

        on_report_updated()


    example_asset_producer()
    example_asset_consumer()
  example-backfill-py: |
    """Starter example — Airflow's answer to "process historical dates":
    catchup + backfill. This is whole-DAG-run granularity (one run per missed
    schedule interval), not per-asset-partition like Dagster's daily_sales
    (see docs/12-orchestration.md for the real distinction).

    start_date is 5 days in the past with schedule="@daily" and catchup=True —
    unpausing this DAG makes Airflow automatically create 5 backfill runs (one
    per missed day) instead of just starting fresh from today:

        docker exec airflow-scheduler airflow dags unpause example_backfill

    Watch it happen in the Grid view, or:

        docker exec airflow-scheduler airflow dags list-runs example_backfill

    For an *already-running* DAG, ad-hoc backfill of an arbitrary historical
    range (regardless of catchup) is a separate, explicit command:

        docker exec airflow-scheduler airflow backfill create \\
            --dag-id example_backfill --from-date 2026-07-01 --to-date 2026-07-05
    """

    from datetime import datetime, timedelta

    from airflow.sdk import dag, task


    @dag(
        dag_id="example_backfill",
        description="Starter example: catchup fills in missed historical runs on unpause",
        doc_md=__doc__,
        start_date=datetime.now() - timedelta(days=5),
        schedule="@daily",
        catchup=True,
        tags=["example"],
    )
    def example_backfill():
        @task
        def process_day(**context) -> None:
            print(f"Processing logical date: {context['logical_date']}")

        process_day()


    example_backfill()
  example-branching-py: |
    """Starter example — BashOperator for a plain shell command, plus conditional
    branching (BranchPythonOperator): a very common real-world need — e.g. "only
    run the expensive step if today's check found new data"."""

    import random
    from datetime import datetime

    from airflow import DAG
    from airflow.providers.standard.operators.bash import BashOperator
    from airflow.providers.standard.operators.python import BranchPythonOperator, PythonOperator


    def check_for_new_data() -> str:
        # Real version: query an API/DB/file listing. This just simulates a
        # 50/50 result so the branch actually alternates across runs.
        return "process_new_data" if random.random() < 0.5 else "skip_no_data"


    def process() -> None:
        print("Processing new data...")


    with DAG(
        dag_id="example_branching",
        description="Starter example: shell command + conditional branch",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example"],
    ) as dag:
        check_disk_space = BashOperator(
            task_id="check_disk_space",
            bash_command="df -h /opt/airflow",
        )

        branch = BranchPythonOperator(
            task_id="check_for_new_data",
            python_callable=check_for_new_data,
        )

        process_new_data = PythonOperator(
            task_id="process_new_data",
            python_callable=process,
        )

        skip_no_data = BashOperator(
            task_id="skip_no_data",
            bash_command="echo 'Nothing new — skipping.'",
        )

        check_disk_space >> branch >> [process_new_data, skip_no_data]
  example-cross-dag-dependencies-py: "\"\"\"Starter example — making one DAG depend on another, Airflow's two\nbuilt-in ways\
    \ to do it. Neither needs a Sensor/Trigger you write yourself\n(see example_file_sensor.py's docstring for that same point\
    \ about waiting\non a file) — both ship in `apache-airflow-providers-standard`, already\ninstalled in this stack:\n\n\
    \  ExternalTaskSensor  — the \"pull\" direction: waiter_dag waits for a\n                         specific task in producer_dag's\
    \ run to reach a\n                         given state. Matches by logical_date by default —\n                       \
    \  trigger both with the *same* one to see it work:\n\n    docker exec airflow-scheduler airflow dags unpause producer_dag\n\
    \    docker exec airflow-scheduler airflow dags unpause waiter_dag\n    docker exec airflow-scheduler airflow dags trigger\
    \ producer_dag --logical-date 2026-01-02T00:00:00+00:00\n    docker exec airflow-scheduler airflow dags trigger waiter_dag\
    \ --logical-date 2026-01-02T00:00:00+00:00\n\n  TriggerDagRunOperator — the \"push\" direction: trigger_only_dag actively\n\
    \                          starts a *fresh* run of producer_dag itself\n                          (its own new logical_date,\
    \ no matching needed)\n                          and, with wait_for_completion=True, blocks until\n                  \
    \        that run finishes — the closest built-in analog\n                          to Temporal's execute_child_workflow\
    \ or Dagster's\n                          RunRequest, minus their independent Event\n                          History/asset\
    \ lineage.\n\n    docker exec airflow-scheduler airflow dags unpause trigger_only_dag\n    docker exec airflow-scheduler\
    \ airflow dags trigger trigger_only_dag\n\nWatch either in the Grid view — waiter_dag's `wait_for_producer` task shows\n\
    `deferred` while it waits, same zero-worker-slot mechanism as\nexample_deferrable_sensor.py/example_file_sensor.py's deferred\
    \ mode.\n\"\"\"\n\nfrom datetime import datetime, timedelta\n\nfrom airflow.providers.standard.operators.trigger_dagrun\
    \ import TriggerDagRunOperator\nfrom airflow.providers.standard.sensors.external_task import ExternalTaskSensor\nfrom\
    \ airflow.sdk import dag, task\n\nDAG_KWARGS = dict(\n    start_date=datetime(2026, 1, 1),\n    schedule=None,\n    catchup=False,\n\
    \    tags=[\"example\"],\n)\n\n\n@dag(dag_id=\"producer_dag\", description=\"Cross-DAG example: the DAG being waited on\
    \ / triggered\", **DAG_KWARGS)\ndef producer_dag():\n    @task(task_id=\"do_work\")\n    def do_work() -> str:\n     \
    \   return \"producer_dag's work is done\"\n\n    do_work()\n\n\n@dag(\n    dag_id=\"waiter_dag\",\n    description=\"\
    Cross-DAG example: ExternalTaskSensor — waits (pulls) for producer_dag's task, matched by logical_date\",\n    doc_md=__doc__,\n\
    \    **DAG_KWARGS,\n)\ndef waiter_dag():\n    wait_for_producer = ExternalTaskSensor(\n        task_id=\"wait_for_producer\"\
    ,\n        external_dag_id=\"producer_dag\",\n        external_task_id=\"do_work\",\n        poll_interval=10,\n     \
    \   timeout=timedelta(minutes=10),\n        deferrable=True,  # same zero-worker-slot wait as example_file_sensor.py's\
    \ deferred_mode_task\n    )\n\n    @task\n    def report() -> None:\n        print(\"producer_dag's do_work task reached\
    \ a matching state — proceeding.\")\n\n    wait_for_producer >> report()\n\n\n@dag(\n    dag_id=\"trigger_only_dag\",\n\
    \    description=\"Cross-DAG orchestrator: Pushes identical logical dates to both producer and waiter\",\n    **DAG_KWARGS,\n\
    )\ndef trigger_only_dag():\n    \n    # 1. Fire the producer DAG immediately with our current logical date\n    trigger_producer\
    \ = TriggerDagRunOperator(\n        task_id=\"trigger_producer\",\n        trigger_dag_id=\"producer_dag\",\n        #\
    \ Pass the exact logical date of this orchestrator run down\n        logical_date=\"{{ logical_date }}\", \n        wait_for_completion=False,\
    \ # Do not block here; let it run in parallel\n    )\n\n    # 2. Fire the waiter DAG with the same logical date and wait\
    \ for the pipeline to finish\n    trigger_waiter = TriggerDagRunOperator(\n        task_id=\"trigger_waiter\",\n     \
    \   trigger_dag_id=\"waiter_dag\",\n        # Pass the exact same logical date so ExternalTaskSensor matches perfectly\n\
    \        logical_date=\"{{ logical_date }}\", \n        wait_for_completion=True, # Block the orchestrator until waiter\
    \ completes\n        poke_interval=5,\n        deferrable=True,\n    )\n\n    # Set the dependency execution chain\n \
    \   trigger_producer >> trigger_waiter\n\n\nproducer_dag()\nwaiter_dag()\ntrigger_only_dag()\n"
  example-cross-service-pipeline-py: |
    """Starter example — the capstone: Airflow schedules, Temporal durably
    orchestrates, Dagster materializes assets with lineage. Each tool doing the
    one thing it's actually best at, instead of picking just one and stretching
    it to cover everything.

    This task starts Temporal's MaterializeDagsterAssetWorkflow and waits for
    it to finish. That workflow (services/temporal/worker/workflows.py) calls
    Dagster's GraphQL API to launch report_job and polls until it completes —
    durably: if the Temporal worker crashes mid-poll, Temporal replays and keeps
    waiting, no state lost. This DAG doesn't know or care about that — it just
    sees one task that eventually succeeds or fails.
    """

    import asyncio
    from datetime import datetime

    from airflow.sdk import dag, task


    @dag(
        dag_id="example_cross_service_pipeline",
        description="Starter example: Airflow schedules a durable Temporal workflow that materializes a Dagster asset",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example", "cross-service"],
    )
    def example_cross_service_pipeline():
        @task
        def trigger_dagster_materialization_via_temporal() -> str:
            import os

            from temporalio.client import Client
            from temporalio.envconfig import ClientConfig

            async def _run() -> str:
                # Temporal's standard environment configuration, as the worker uses
                # (TEMPORAL_ADDRESS, TEMPORAL_API_KEY, TEMPORAL_TLS*, ...): Temporal
                # Cloud is an .env change, never a code change.
                config = ClientConfig.load_client_connect_config()
                if not config.get("api_key"):  # empty key = none (self-hosted, plain text)
                    config.pop("api_key", None)
                    if config.get("tls") is True and "TEMPORAL_TLS" not in os.environ:
                        config.pop("tls")
                client = await Client.connect(**config)
                return await client.execute_workflow(
                    "MaterializeDagsterAssetWorkflow",
                    "report_job",
                    id=f"airflow-triggered-{datetime.now():%Y%m%d%H%M%S}",
                    task_queue="homeserver",
                )

            return asyncio.run(_run())

        trigger_dagster_materialization_via_temporal()


    example_cross_service_pipeline()
  example-custom-notifier-py: |
    """Starter example — a custom `BaseNotifier` subclass: a reusable,
    parameterized notification target instead of a bare `on_failure_callback`
    function. `example_email_alert_on_failure.py` already exercises a
    *built-in* Notifier (`SmtpNotifier`, wired up implicitly by
    `email_on_failure=True`) — this shows writing your own, Dagster's
    `@success_hook`/`@failure_hook` parallel on the Airflow side (see
    docs/12-orchestration.md's feature-parity table).

    A plain function callback works fine for a one-off; a `BaseNotifier`
    subclass is worth it once the same notification target (a file, a
    webhook, a ticketing system) gets reused across several tasks/DAGs with
    different messages each time — `template_fields` makes the message itself
    Jinja-templatable per call, the same as any operator argument.

        docker exec airflow-scheduler airflow dags unpause example_custom_notifier
        docker exec airflow-scheduler airflow dags trigger example_custom_notifier
        docker exec airflow-scheduler cat /opt/airflow/dags/.custom_notifier_log
    """

    from datetime import datetime

    from airflow.sdk import dag, task
    from airflow.sdk.bases.notifier import BaseNotifier

    LOG_PATH = "/opt/airflow/dags/.custom_notifier_log"


    class LocalFileNotifier(BaseNotifier):
        """Real version: POST to a webhook/ticketing API instead of writing a
        local file. The point demonstrated here is the class itself being
        reusable/parameterized/templated, not the destination."""

        template_fields = ("message",)

        def __init__(self, message: str) -> None:
            super().__init__()
            self.message = message

        def notify(self, context) -> None:
            with open(LOG_PATH, "a") as f:
                f.write(f"{self.message}\n")


    @dag(
        dag_id="example_custom_notifier",
        description="Starter example: a custom BaseNotifier subclass, reusable/templated notification target",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example"],
    )
    def example_custom_notifier():
        @task(
            on_failure_callback=LocalFileNotifier(message="ALERT: {{ ti.task_id }} failed in {{ dag.dag_id }}"),
        )
        def always_fails() -> None:
            raise ValueError("Simulated failure — on_failure_callback fires the custom Notifier.")

        always_fails()


    example_custom_notifier()
  example-deferrable-sensor-py: |
    """Starter example — a deferrable operator: waits for an external signal by
    suspending into the `airflow-triggerer` process, holding **zero** worker
    capacity for the entire wait. Contrast with `example_sensor.py`'s
    `reschedule` mode, which at least frees the worker slot *between* pokes —
    deferral frees it for the whole wait, full stop. A single triggerer can hold
    thousands of these concurrently on one async event loop; this is the actual
    mechanism real deferrable operators/sensors (S3KeySensor, TimeSensorAsync,
    etc.) are built on, hand-rolled here so the mechanism itself is visible.

    Two pieces, the same split every deferrable operator uses:

      MarkerFileTrigger        — runs in airflow-triggerer, async, polls via
                                  asyncio.sleep (not a worker-slot-holding loop)
      WaitForMarkerFileOperator — runs in the worker just long enough to call
                                  self.defer(...) and hand off to the trigger,
                                  then again briefly when the trigger fires

    Trigger this DAG, then watch the Grid view: the task's state shows
    "deferred" — a distinct state from "running", exactly because it isn't
    occupying a worker. Create the marker file to let it complete:

        docker exec airflow-scheduler touch /opt/airflow/dags/.deferrable_sensor_trigger

    Or from the host, if the dags folder is bind-mounted there too:

        touch service_data/data/airflow/dags/.deferrable_sensor_trigger
    """

    import asyncio
    from datetime import datetime
    from pathlib import Path
    from typing import Any

    from airflow.sdk import BaseOperator, dag
    from airflow.triggers.base import BaseTrigger, TriggerEvent

    MARKER_PATH = "/opt/airflow/dags/.deferrable_sensor_trigger"


    class MarkerFileTrigger(BaseTrigger):
        """Runs inside airflow-triggerer, not a worker. `serialize()` is what
        makes that possible — the trigger's constructor args get pickled into
        the metadata DB and reconstructed by the triggerer process, which is
        why they must be plain, easily-serializable values (a path and a
        number), not live objects."""

        def __init__(self, marker_path: str, poll_interval: float = 5.0) -> None:
            super().__init__()
            self.marker_path = marker_path
            self.poll_interval = poll_interval

        def serialize(self) -> tuple[str, dict[str, Any]]:
            return (
                "example_deferrable_sensor.MarkerFileTrigger",
                {"marker_path": self.marker_path, "poll_interval": self.poll_interval},
            )

        async def run(self):
            # A real trigger would `await` a genuinely async I/O call here (an
            # async HTTP client, aiofiles, etc.) — asyncio.sleep is the stand-in
            # so this needs no extra dependency, same spirit as example_sensor's
            # marker-file stub.
            while not Path(self.marker_path).exists():
                await asyncio.sleep(self.poll_interval)
            yield TriggerEvent({"found": self.marker_path})


    class WaitForMarkerFileOperator(BaseOperator):
        """`execute()` runs on a worker just long enough to call `self.defer()`
        and immediately hand off — it does NOT block waiting for the trigger.
        `execute_complete()` runs on a worker again, briefly, once the trigger
        yields its event; the worker is free for other tasks the entire time in
        between."""

        def __init__(self, marker_path: str, poll_interval: float = 5.0, **kwargs) -> None:
            super().__init__(**kwargs)
            self.marker_path = marker_path
            self.poll_interval = poll_interval

        def execute(self, context) -> None:
            self.defer(
                trigger=MarkerFileTrigger(self.marker_path, self.poll_interval),
                method_name="execute_complete",
            )

        def execute_complete(self, context, event: dict | None = None) -> None:
