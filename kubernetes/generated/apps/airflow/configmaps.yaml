  example-parallel-tasks-py: |
    """Starter example — fan-out/fan-in: multiple independent tasks running
    concurrently, then downstream tasks that wait for all of them. Every other
    multi-task example here is either a straight line (example_etl_pipeline) or
    an either/or branch (example_branching) — this is the third real shape:
    parallel work that converges. Also deliberately uses the classic Operator
    style with explicit dependencies and `ti.xcom_pull`, not TaskFlow's `@task`
    decorators — the two styles look different but produce the same kind of
    DAG; compare against example_etl_pipeline.py to see both side by side.

    Four levels, so upstream/downstream is unambiguous at every step:

        start                                     (level 0)
          -> fetch_source_a/b/c (parallel)        (level 1 — all downstream of start)
            -> combine_results                    (level 2 — downstream of all 3, upstream of notify)
              -> notify                            (level 3)

    fetch_source_a/b/c have no dependency on *each other* (only on `start`), so
    LocalExecutor runs them at the same time — watch the overlap in the UI's
    Gantt view, or `docker exec airflow-scheduler airflow tasks states-for-dag-run
    example_parallel_tasks <run_id>` mid-run. `combine_results` only starts once
    all three have finished (Airflow won't run a task until every one of its
    upstream tasks succeeds); `notify` only starts once `combine_results` has.

    Two equivalent ways to declare the same dependency — `>>` is shorthand for
    `.set_downstream()` (and `<<` for `.set_upstream()`); every other example in
    this repo uses `>>`, this one also shows the explicit method form once so
    both are visible somewhere:

        start >> fetch_source_a                    # shorthand
        start.set_downstream(fetch_source_a)        # equivalent, explicit
        fetch_source_a.set_upstream(start)           # same edge, written from the other end
    """

    from datetime import datetime

    from airflow import DAG
    from airflow.providers.standard.operators.empty import EmptyOperator
    from airflow.providers.standard.operators.python import PythonOperator


    def fetch_source(source_name: str):
        def _fetch(ti=None):
            # Real version: call that source's actual API/DB.
            value = {"source_a": 10, "source_b": 20, "source_c": 30}[source_name]
            print(f"Fetched {value} from {source_name}")
            ti.xcom_push(key="value", value=value)

        return _fetch


    def combine_results(ti=None, **_) -> None:
        values = ti.xcom_pull(task_ids=["fetch_source_a", "fetch_source_b", "fetch_source_c"], key="value")
        print(f"Combined total from all 3 sources: {sum(values)}")


    def notify(ti=None, **_) -> None:
        # Real version: post to ntfy, Slack, etc. ti.xcom_pull with no `key`
        # fetches the default return-value XCom — combine_results didn't
        # explicitly push one, but Airflow auto-XComs a task's `return` value.
        print(f"Pipeline finished. Its upstream task ({ti.task.upstream_task_ids}) already confirmed success.")


    with DAG(
        dag_id="example_parallel_tasks",
        description="Starter example: fan-out to parallel tasks, fan-in to one that waits for all of them",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example"],
    ) as dag:
        start = EmptyOperator(task_id="start")

        fetch_source_a = PythonOperator(task_id="fetch_source_a", python_callable=fetch_source("source_a"))
        fetch_source_b = PythonOperator(task_id="fetch_source_b", python_callable=fetch_source("source_b"))
        fetch_source_c = PythonOperator(task_id="fetch_source_c", python_callable=fetch_source("source_c"))

        combine = PythonOperator(task_id="combine_results", python_callable=combine_results)
        notify_task = PythonOperator(task_id="notify", python_callable=notify)

        # Shorthand form for the fan-out/fan-in (this is what every other
        # example in this repo uses):
        start >> [fetch_source_a, fetch_source_b, fetch_source_c] >> combine

        # Explicit method form for the last edge — same effect as
        # `combine >> notify_task`, written the other two ways:
        combine.set_downstream(notify_task)
        # notify_task.set_upstream(combine)   # <- the same edge again, from the downstream side (would be redundant to actually call both)
  example-python-virtualenv-operator-py: |
    """Starter example — `PythonVirtualenvOperator`: runs a callable inside a
    fresh, isolated venv with its own `requirements`, instead of whatever's
    already installed in `airflow-scheduler`'s own environment. Real fit: one
    task needs a specific/conflicting package version the rest of the DAG
    doesn't, without touching `_PIP_ADDITIONAL_REQUIREMENTS` (which installs
    into the scheduler's environment for every task, see compose.yml) or
    building a dedicated custom image.

    Honest limitation, not glossed over: this rebuilds the venv **every run**
    unless `venv_cache_path` is set (not set here, for simplicity) — fine for
    a homelab's occasional task, a real production cost at high task-run
    volume. `system_site_packages=False` below means the callable genuinely
    can't see Airflow's own installed packages either — only what's listed in
    `requirements`, plus the stdlib.

        docker exec airflow-scheduler airflow dags unpause example_python_virtualenv_operator
        docker exec airflow-scheduler airflow dags trigger example_python_virtualenv_operator
    """

    from datetime import datetime

    from airflow.providers.standard.operators.python import PythonVirtualenvOperator
    from airflow.sdk import dag


    def print_emoji() -> None:
        # Real version: any callable needing a package/version the rest of the
        # DAG doesn't have. Must import everything it uses *inside* the
        # function body — this runs in a separate subprocess/venv, so it can't
        # see names imported at module level in this file.
        import emoji

        print(emoji.emojize("Task ran inside an isolated venv :thumbs_up:"))


    @dag(
        dag_id="example_python_virtualenv_operator",
        description="Starter example: PythonVirtualenvOperator — an isolated venv with its own requirements, per task",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example"],
    )
    def example_python_virtualenv_operator():
        PythonVirtualenvOperator(
            task_id="run_in_isolated_venv",
            python_callable=print_emoji,
            requirements=["emoji"],
            system_site_packages=False,
        )


    example_python_virtualenv_operator()
  example-scheduled-with-retries-py: |
    """Starter example — a daily-scheduled DAG with retry/backoff configured,
    the two things almost every real production DAG needs: run on its own
    without manual triggering, and not fail outright on the first transient
    error (a flaky API, a momentary network blip, etc.)."""

    from datetime import datetime, timedelta

    from airflow import DAG
    from airflow.providers.standard.operators.python import PythonOperator


    def call_flaky_api() -> None:
        # Real version: an actual HTTP call. This DAG exists to show the retry
        # *configuration* below, not to simulate failure — it just succeeds.
        print("Called the API successfully.")


    with DAG(
        dag_id="example_scheduled_with_retries",
        description="Starter example: daily schedule + per-task retry/backoff",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule="@daily",
        catchup=False,
        tags=["example"],
        default_args={
            "retries": 3,
            "retry_delay": timedelta(minutes=5),
            "retry_exponential_backoff": True,
            "max_retry_delay": timedelta(minutes=30),
        },
    ) as dag:
        PythonOperator(
            task_id="call_flaky_api",
            python_callable=call_flaky_api,
        )
  example-sensor-py: |
    """Starter example — a Sensor: "don't run the next task until X is true,"
    a signature Airflow concept distinct from the task-chaining examples. This
    one waits for a marker file to appear rather than needing a pre-configured
    Connection, so it works with zero setup — trigger the DAG, then from another
    terminal:

        touch service_data/data/airflow/dags/.sensor_trigger

    ...and watch the sensor task go from running to success within ~10s (its
    poke_interval). Delete the marker file afterward if you want to run it
    again — it stays green, but this makes re-triggering cleanly reproducible.
    """

    from datetime import datetime, timedelta
    from pathlib import Path

    from airflow.sdk import PokeReturnValue, dag, task

    MARKER_FILE = Path("/opt/airflow/dags/.sensor_trigger")


    @dag(
        dag_id="example_sensor",
        description="Starter example: wait for a condition before proceeding",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example"],
    )
    def example_sensor():
        @task.sensor(poke_interval=10, timeout=timedelta(minutes=10), mode="reschedule")
        def wait_for_marker_file() -> PokeReturnValue:
            found = MARKER_FILE.exists()
            return PokeReturnValue(is_done=found, xcom_value=str(MARKER_FILE) if found else None)

        @task
        def proceed(marker_path: str) -> None:
            print(f"Marker file appeared at {marker_path} — proceeding.")

        proceed(wait_for_marker_file())


    example_sensor()
  example-stateful-retry-py: |
    """Starter example — the Task State Store (AIP-103, new in Airflow 3.3): a
    task can persist key-value state that survives across *retries*, not just
    within a single successful run. XCom (used throughout `example_etl_pipeline`
    and others) passes data between different *tasks* in the same run;
    task_state_store solves a different problem — a single task's own memory of
    what it already did, kept even when that specific attempt fails and Airflow
    retries it. A plain Python variable inside the task function is wiped out on
    every retry attempt; task_state_store isn't.

    The canonical real use: submitting a long-running external job (a Spark job,
    an export, an ML training run) and reattaching to it on retry instead of
    submitting a duplicate.

    This task's first attempt always "crashes" right after submitting a
    (simulated) job, forcing a real retry. Watch the log change from "submitted
    job: <id>" (try 1) to "reattaching to existing job: <id>" (try 2) — same
    job_id both times. Verified: both attempts logged the identical job_id, and
    the run ultimately succeeds on try 2.

        docker exec airflow-scheduler airflow dags unpause example_stateful_retry
        docker exec airflow-scheduler airflow dags trigger example_stateful_retry

    The UI's task instance view has a **Storage** tab that shows the raw
    task_state_store contents directly — a good place to watch this live.
    """

    from __future__ import annotations

    import random
    import string
    import time
    from datetime import datetime, timedelta, timezone

    from airflow.sdk import DAG, task
    from airflow.sdk.execution_time.context import NEVER_EXPIRE


    def _submit_job() -> str:
        # Real version: call the external system's submit API.
        time.sleep(1)
        return "job-" + "".join(random.choices(string.ascii_lowercase + string.digits, k=8))


    def _poll_job(job_id: str) -> dict:
        # Real version: poll the external system's status API.
        time.sleep(1)
        return {"job_id": job_id, "status": "succeeded", "rows_written": random.randint(100, 10_000)}


    with DAG(
        dag_id="example_stateful_retry",
        description="Starter example: task_state_store survives retries, unlike a plain local variable",
        doc_md=__doc__,
        schedule=None,
        start_date=datetime(2026, 1, 1),
        catchup=False,
        tags=["example"],
    ):

        @task(retries=2, retry_delay=timedelta(seconds=5))
        def run_job(task_state_store=None, ti=None):
            job_id = task_state_store.get("job_id")
            if job_id:
                print(f"Try {ti.try_number}: reattaching to existing job: {job_id}")
            else:
                job_id = _submit_job()
                # NEVER_EXPIRE so the job ID survives across every retry attempt,
                # not just until some default TTL.
                task_state_store.set("job_id", job_id, retention=NEVER_EXPIRE)
                task_state_store.set("submitted_at", datetime.now(tz=timezone.utc).isoformat())
                print(f"Try {ti.try_number}: submitted job: {job_id}")

                # Simulate a worker crash right after submission on the first
                # attempt — the retry reattaches to this same job_id instead of
                # submitting a duplicate.
                raise RuntimeError(f"Simulated failure after submitting {job_id} — retry will reattach")

            task_state_store.set("status", "running")
            result = _poll_job(job_id)
            task_state_store.set("status", "complete")
            task_state_store.set("result", result)

            print(f"Try {ti.try_number}: job complete — {result['rows_written']} rows written")
            return result["rows_written"]

        run_job()
  example-trigger-rules-py: |
    """Starter example — trigger rules: what condition on its upstream tasks a
    task needs before Airflow will run it. Every other example here uses the
    implicit default (`all_success` — every upstream must succeed), which is why
    none of them have a task that runs *because something else failed*. This is
    the "always clean up, always alert on failure" shape almost every real DAG
    needs somewhere.

        risky_task                              (deliberately fails every run)
          -> cleanup            trigger_rule=ALL_DONE     (runs no matter what — success or failure)
          -> alert_on_failure   trigger_rule=ONE_FAILED   (runs only because something upstream failed)
          -> only_if_all_ok     default (ALL_SUCCESS)     (never runs here — risky_task always fails)

    Trigger this DAG and open the Grid view: `risky_task` is red, `cleanup` and
    `alert_on_failure` are green (they *ran*, and succeeded, precisely because
    the upstream failed), and `only_if_all_ok` is grey/skipped — Airflow never
    even attempts a default-trigger-rule task once one of its upstreams fails.

    Without a trigger rule override, a failed task cascades into every
    downstream task being skipped, including your own cleanup/notification
    logic — the two rules used here are how you opt specific tasks out of that
    cascade instead of hand-rolling try/except failure-catching inside a
    PythonOperator.
    """

    from datetime import datetime

    from airflow.sdk import dag, task
    from airflow.task.trigger_rule import TriggerRule


    @dag(
        dag_id="example_trigger_rules",
        description="Starter example: trigger_rule controls whether a task runs after an upstream failure",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example"],
    )
    def example_trigger_rules():
        @task
        def risky_task() -> None:
            # Real version: a step that can genuinely fail (a flaky API, a
            # source system that's sometimes down) — deliberately always fails
            # here so every run demonstrates the same trigger-rule behavior.
            raise ValueError("Simulated failure — this task is designed to always fail")

        @task(trigger_rule=TriggerRule.ALL_DONE)
        def cleanup() -> None:
            # Real version: release a lock, delete a temp file, close a
            # connection — things that must happen whether risky_task succeeded
            # or not.
            print("Cleanup ran — this always happens, success or failure upstream.")

        @task(trigger_rule=TriggerRule.ONE_FAILED)
        def alert_on_failure() -> None:
            # Real version: post to ntfy/Slack/PagerDuty. This task's only job
            # is to exist for the failure case — with the default trigger rule
            # it would never run at all, since its upstream never succeeds.
            print("ALERT: risky_task failed — this task exists to run *because* of that.")

        @task
        def only_if_all_ok() -> None:
            # Default trigger rule (ALL_SUCCESS) — included as the contrast case.
            # This never actually runs in this DAG, because risky_task always
            # fails: Airflow marks it upstream_failed / skipped, visible in the
            # Grid view as grey next to cleanup/alert_on_failure's green.
            print("This only prints if risky_task actually succeeded.")

        started = risky_task()
        started >> cleanup()
        started >> alert_on_failure()
        started >> only_if_all_ok()


    example_trigger_rules()
  example-variables-and-connections-py: |
    """Starter example — Airflow's own lightweight secrets/config store:
    Variables (any string or JSON value) and Connections (structured
    credentials — host/login/password/extra), both encrypted at rest in
    Airflow's own metadata DB via `FERNET_KEY`. No external secrets manager
    needed for homelab-scale pipeline credentials — see docs/12-orchestration.md's
    "Built-in features that mean you don't need another service."

    Variables: set and read back entirely from inside this DAG, JSON-serialized.

    Connections: realistically admin-provisioned once, not created from inside
    a DAG on every run — same as how a human sets up a database credential a
    single time, not on every pipeline execution. Create the demo one first,
    then trigger:

        docker exec airflow-scheduler airflow connections add demo_api_connection \\
            --conn-type http --conn-host api.example.com --conn-login demo_user --conn-password super-secret-value

        docker exec airflow-scheduler airflow dags unpause example_variables_and_connections
        docker exec airflow-scheduler airflow dags trigger example_variables_and_connections

    Prove it's genuinely encrypted, not plaintext, straight from the DB — the
    password column should be an unreadable Fernet blob, not "super-secret-value":

        docker exec shared-postgres psql -U airflow -d airflow -c "SELECT conn_id, password FROM connection WHERE conn_id='demo_api_connection';"
    """

    from datetime import datetime

    from airflow.sdk import BaseHook, Variable, dag, task


    @dag(
        dag_id="example_variables_and_connections",
        description="Starter example: Airflow's own encrypted Variable/Connection store, no external secrets manager needed",
        doc_md=__doc__,
        start_date=datetime(2026, 1, 1),
        schedule=None,
        catchup=False,
        tags=["example"],
    )
    def example_variables_and_connections():
        @task
        def set_and_read_variable() -> None:
            Variable.set("demo_config", {"retries": 3, "timeout_seconds": 30}, serialize_json=True)
            config = Variable.get("demo_config", deserialize_json=True)
            print(f"Read back Variable 'demo_config': {config}")

        @task
        def read_connection() -> None:
            conn = BaseHook.get_connection("demo_api_connection")
            # Real version: use conn.host/conn.login/conn.password/conn.extra_dejson
            # to actually call the API. conn.password is decrypted here, in memory,
            # for this task's own process only — never written back out in plain text.
            masked = "*" * len(conn.password or "")
            print(f"Connection 'demo_api_connection': host={conn.host} login={conn.login} password={masked}")

        set_and_read_variable() >> read_connection()


    example_variables_and_connections()
