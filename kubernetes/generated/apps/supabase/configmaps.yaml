                    # Copies ?apikey=... from the URL into the apikey header when clients omit the header.
                    - name: envoy.filters.http.lua
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                        inline_code: |
                          local FUNCTIONS_ROUTE = "functions-v1-all"
                          local FUNCTIONS_PREFIX = "/functions/v1/"

                          local function is_functions_request(request_handle, headers)
                            if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                              return true
                            end

                            local path = headers:get(":path")
                            if path == nil then
                              return false
                            end

                            return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                          end

                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                            if is_functions_request(request_handle, headers) then
                              return
                            end

                            if headers:get("apikey") ~= nil then
                              return
                            end

                            local path = headers:get(":path")
                            local query_start = string.find(path, "?", 1, true)
                            if query_start == nil then
                              return
                            end

                            local query = string.sub(path, query_start + 1)
                            for key, value in string.gmatch(query, "([^&]+)=([^&]*)") do
                              if key == "apikey" and value ~= "" then
                                headers:add("apikey", value)
                                return
                              end
                            end
                          end

                    # Returns 401 for missing/invalid API keys on protected API routes.
                    - name: envoy.filters.http.lua
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                        inline_code: |
                          local ANON_KEY = "${ANON_KEY}"
                          local SERVICE_ROLE_KEY = "${SERVICE_ROLE_KEY}"
                          local SUPABASE_PUBLISHABLE_KEY = "${SUPABASE_PUBLISHABLE_KEY}"
                          local SUPABASE_SECRET_KEY = "${SUPABASE_SECRET_KEY}"
                          local ANON_KEY_ASYMMETRIC = "${ANON_KEY_ASYMMETRIC}"
                          local SERVICE_ROLE_KEY_ASYMMETRIC = "${SERVICE_ROLE_KEY_ASYMMETRIC}"
                          local TRANSLATION_ENABLED = SUPABASE_SECRET_KEY ~= "" and SUPABASE_PUBLISHABLE_KEY ~= "" and SERVICE_ROLE_KEY_ASYMMETRIC ~= "" and ANON_KEY_ASYMMETRIC ~= ""

                          local PROTECTED_ROUTES = {
                            ["auth-v1-protected"] = true,
                            ["rest-v1-openapi-protected"] = true,
                            ["rest-v1-protected"] = true,
                            ["graphql-v1-protected"] = true,
                            ["realtime-v1-api-protected"] = true,
                            ["realtime-v1-ws-protected"] = true,
                            ["pg-protected"] = true,
                          }

                          local function is_protected_route(route_name)
                            if route_name == nil or route_name == "" then
                              return false
                            end

                            return PROTECTED_ROUTES[route_name] == true
                          end

                          local function is_valid_apikey(apikey)
                            if apikey == nil or apikey == "" then
                              return false
                            end

                            if SERVICE_ROLE_KEY ~= "" and apikey == SERVICE_ROLE_KEY then
                              return true
                            end

                            if ANON_KEY ~= "" and apikey == ANON_KEY then
                              return true
                            end

                            if TRANSLATION_ENABLED and apikey == SUPABASE_SECRET_KEY then
                              return true
                            end

                            if TRANSLATION_ENABLED and apikey == SUPABASE_PUBLISHABLE_KEY then
                              return true
                            end

                            return false
                          end

                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                            local route_name = request_handle:streamInfo():routeName()
                            if not is_protected_route(route_name) then
                              return
                            end

                            if is_valid_apikey(headers:get("apikey")) then
                              return
                            end

                            request_handle:respond({
                              [":status"] = "401",
                              ["content-type"] = "text/plain",
                            }, "Unauthorized")
                          end

                    # Translates the query parameter apikey into the matching internal JWT and rewrites the URL so only JWTs propagate downstream.
                    - name: envoy.filters.http.lua
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                        inline_code: |
                          local FUNCTIONS_ROUTE = "functions-v1-all"
                          local FUNCTIONS_PREFIX = "/functions/v1/"
                          local SECRET_KEY = "${SUPABASE_SECRET_KEY}"
                          local PUBLISHABLE_KEY = "${SUPABASE_PUBLISHABLE_KEY}"
                          local SERVICE_ROLE_JWT = "${SERVICE_ROLE_KEY_ASYMMETRIC}"
                          local ANON_JWT = "${ANON_KEY_ASYMMETRIC}"
                          local TRANSLATION_ENABLED = SECRET_KEY ~= "" and PUBLISHABLE_KEY ~= "" and SERVICE_ROLE_JWT ~= "" and ANON_JWT ~= ""

                          local function is_functions_request(request_handle, headers)
                            if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                              return true
                            end

                            local path = headers:get(":path")
                            if path == nil then
                              return false
                            end

                            return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                          end

                          local function translate_apikey(apikey)
                            if apikey == nil or apikey == "" then
                              return nil
                            end

                            if not TRANSLATION_ENABLED then
                              return nil
                            end

                            if apikey == SECRET_KEY then
                              return SERVICE_ROLE_JWT
                            end

                            if apikey == PUBLISHABLE_KEY then
                              return ANON_JWT
                            end

                            return nil
                          end

                          local function extract_query_apikey(path)
                            if path == nil or path == "" then
                              return nil
                            end

                            local query_start = string.find(path, "?", 1, true)
                            if query_start == nil then
                              return nil
                            end

                            local query = string.sub(path, query_start + 1)
                            for key, value in string.gmatch(query, "([^&]+)=([^&]*)") do
                              if key == "apikey" and value ~= "" then
                                return value
                              end
                            end

                            return nil
                          end

                          local function replace_query_apikey(path, new_value)
                            if path == nil or path == "" or new_value == nil or new_value == "" then
                              return nil
                            end

                            local query_start = string.find(path, "?", 1, true)
                            if query_start == nil then
                              return nil
                            end

                            local base = string.sub(path, 1, query_start)
                            local query = string.sub(path, query_start + 1)
                            local updated = {}
                            local replaced = false

                            for part in string.gmatch(query, "([^&]+)") do
                              local key, value = string.match(part, "([^=]+)=(.*)")
                              if key == "apikey" then
                                part = key .. "=" .. new_value
                                replaced = true
                              end
                              table.insert(updated, part)
                            end

                            if not replaced then
                              return nil
                            end

                            return base .. table.concat(updated, "&")
                          end

                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                            if is_functions_request(request_handle, headers) then
                              return
                            end

                            local path = headers:get(":path")
                            local apikey = extract_query_apikey(path)
                            local translated = translate_apikey(apikey)

                            if translated == nil then
                              return
                            end

                            headers:replace("apikey", translated)

                            local rewritten_path = replace_query_apikey(path, translated)
                            if rewritten_path ~= nil then
                              headers:replace(":path", rewritten_path)
                            end
                          end

                    # Translates an apikey header into the appropriate internal JWT for downstream RBAC checks.
                    - name: envoy.filters.http.lua
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                        inline_code: |
                          local FUNCTIONS_ROUTE = "functions-v1-all"
                          local FUNCTIONS_PREFIX = "/functions/v1/"
                          local SECRET_KEY = "${SUPABASE_SECRET_KEY}"
                          local PUBLISHABLE_KEY = "${SUPABASE_PUBLISHABLE_KEY}"
                          local SERVICE_ROLE_JWT = "${SERVICE_ROLE_KEY_ASYMMETRIC}"
                          local ANON_JWT = "${ANON_KEY_ASYMMETRIC}"
                          local TRANSLATION_ENABLED = SECRET_KEY ~= "" and PUBLISHABLE_KEY ~= "" and SERVICE_ROLE_JWT ~= "" and ANON_JWT ~= ""

                          local function is_functions_request(request_handle, headers)
                            if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                              return true
                            end

                            local path = headers:get(":path")
                            if path == nil then
                              return false
                            end

                            return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                          end

                          local function translate_apikey(apikey)
                            if apikey == nil or apikey == "" then
                              return nil
                            end

                            if not TRANSLATION_ENABLED then
                              return nil
                            end

                            if apikey == SECRET_KEY then
                              return SERVICE_ROLE_JWT
                            end

                            if apikey == PUBLISHABLE_KEY then
                              return ANON_JWT
                            end

                            return nil
                          end

                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                            if is_functions_request(request_handle, headers) then
                              return
                            end

                            local translated = translate_apikey(headers:get("apikey"))
                            if translated ~= nil and translated ~= "" then
                              headers:replace("apikey", translated)
                            end
                          end

                    # Mirrors apikey into x-api-key for realtime WS compatibility.
                    - name: envoy.filters.http.lua
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                        inline_code: |
                          local REALTIME_WS_ROUTE = "realtime-v1-ws-protected"

                          function envoy_on_request(request_handle)
                            local route_name = request_handle:streamInfo():routeName()
                            if route_name ~= REALTIME_WS_ROUTE then
                              return
                            end

                            local headers = request_handle:headers()
                            local apikey = headers:get("apikey")
                            if apikey == nil or apikey == "" then
                              return
                            end

                            headers:replace("x-api-key", apikey)
                          end

                    # Synthesizes an Authorization header (Bearer …) from apikey when callers don’t provide a real JWT header.
                    - name: envoy.filters.http.lua
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                        inline_code: |
                          local FUNCTIONS_ROUTE = "functions-v1-all"
                          local FUNCTIONS_PREFIX = "/functions/v1/"
                          local REALTIME_WS_ROUTE = "realtime-v1-ws-protected"

                          local function is_functions_request(request_handle, headers)
                            if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                              return true
                            end

                            local path = headers:get(":path")
                            if path == nil then
                              return false
                            end

                            return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                          end

                          local function has_real_jwt(auth_header)
                            if auth_header == nil or auth_header == "" then
                              return false
                            end

                            if string.sub(auth_header, 1, 7) ~= "Bearer " then
                              return false
                            end

                            return string.sub(auth_header, 1, 10) ~= "Bearer sb_"
                          end

                          local function format_authorization(value)
                            if value == nil or value == "" then
                              return nil
                            end

                            if string.sub(value, 1, 7) == "Bearer " then
                              return value
                            end

                            return "Bearer " .. value
                          end

                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                            if request_handle:streamInfo():routeName() == REALTIME_WS_ROUTE then
                              return
                            end

                            if is_functions_request(request_handle, headers) then
                              return
                            end

                            if has_real_jwt(headers:get("authorization")) then
                              return
                            end

                            local apikey = headers:get("apikey")
                            local authorization_value = format_authorization(apikey)
                            if authorization_value ~= nil then
                              headers:replace("authorization", authorization_value)
                            end
                          end

                    # Functions: mirror the platform behavior. Translate opaque sb_
                    # keys to the pre-signed internal asymmetric JWT and inject it as a
                    # raw `sb-api-key` header (no Bearer prefix), leaving Authorization
                    # untouched. The apikey is read from the header only (+ an
                    # Authorization `Bearer sb_` fallback) - no query-string source.
                    # Strips any client-supplied sb-api-key (anti-spoof). Returns 401 only
                    # for an sb_-prefixed key that is invalid/unregistered, or an
                    # apikey-vs-bearer sb_ conflict; any non-sb_ value (legacy/user/
                    # third-party JWT, or anything else) passes through to the runtime.
                    - name: envoy.filters.http.lua
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                        inline_code: |
                          local FUNCTIONS_ROUTE = "functions-v1-all"
                          local FUNCTIONS_PREFIX = "/functions/v1/"
                          local PUBLISHABLE_KEY = "${SUPABASE_PUBLISHABLE_KEY}"
                          local SECRET_KEY = "${SUPABASE_SECRET_KEY}"
                          local ANON_JWT = "${ANON_KEY_ASYMMETRIC}"
                          local SERVICE_ROLE_JWT = "${SERVICE_ROLE_KEY_ASYMMETRIC}"
                          local TRANSLATION_ENABLED = SECRET_KEY ~= "" and PUBLISHABLE_KEY ~= "" and SERVICE_ROLE_JWT ~= "" and ANON_JWT ~= ""

                          local function is_functions_request(request_handle, headers)
                            if request_handle:streamInfo():routeName() == FUNCTIONS_ROUTE then
                              return true
                            end

                            local path = headers:get(":path")
                            if path == nil then
                              return false
                            end

                            return string.sub(path, 1, string.len(FUNCTIONS_PREFIX)) == FUNCTIONS_PREFIX
                          end

                          local function bearer_token(auth)
                            if auth == nil then
                              return nil
                            end

                            return string.match(auth, "^[Bb]earer%s+(.+)$")
                          end

                          local function unauthorized(request_handle, message)
                            request_handle:respond(
                              { [":status"] = "401", ["content-type"] = "text/plain" },
                              message
                            )
                          end

                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                            if not is_functions_request(request_handle, headers) then
                              return
                            end

                            -- Strip any client-supplied sb-api-key (anti-spoof).
                            headers:remove("sb-api-key")

                            -- No opaque keys configured: nothing to translate, pass through.
                            if not TRANSLATION_ENABLED then
                              return
                            end

                            local apikey = headers:get("apikey")
                            local bearer = bearer_token(headers:get("authorization"))

                            -- No key at all: pass through (verify_jwt:false / unauthenticated).
                            if (apikey == nil or apikey == "") and (bearer == nil or bearer == "") then
                              return
                            end

                            -- Conflict: bearer carries an sb_ key that disagrees with apikey.
                            if bearer ~= nil and string.sub(bearer, 1, 3) == "sb_"
                               and apikey ~= nil and apikey ~= "" and apikey ~= bearer then
                              unauthorized(request_handle, "Conflicting API keys")
                              return
                            end

                            -- Resolve the key from apikey, else an Authorization `Bearer sb_` fallback.
                            local key = apikey
                            if (key == nil or key == "") and bearer ~= nil and string.sub(bearer, 1, 3) == "sb_" then
                              key = bearer
                            end

                            -- Non-sb_ value (legacy/user/third-party JWT, or anything else):
                            -- pass through; the runtime verifies it.
                            if key == nil or key == "" or string.sub(key, 1, 3) ~= "sb_" then
                              return
                            end

                            -- sb_ key: translate publishable/secret, otherwise reject.
                            if key == SECRET_KEY then
                              headers:replace("sb-api-key", SERVICE_ROLE_JWT)
                            elseif key == PUBLISHABLE_KEY then
                              headers:replace("sb-api-key", ANON_JWT)
                            else
                              unauthorized(request_handle, "Invalid API key")
                            end
                          end

                    - name: envoy.filters.http.rbac
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                        rules:
                          action: ALLOW
                          policies:
                            admin:
                              permissions:
                                - url_path:
                                    path:
                                      prefix: /pg/
                              principals:
                                - header:
                                    name: apikey
                                    string_match:
                                      exact: '${SERVICE_ROLE_KEY}'
                                - header:
                                    name: apikey
                                    string_match:
                                      exact: '${SERVICE_ROLE_KEY_ASYMMETRIC}'
                            apikey:
                              permissions:
                                - url_path:
                                    path:
                                      prefix: /auth/v1/
                                - url_path:
                                    path:
                                      prefix: /rest/v1/
                                - url_path:
                                    path:
                                      prefix: /realtime/v1/api
                                - url_path:
                                    path:
                                      prefix: /realtime/v1/
                                - url_path:
                                    path:
                                      prefix: /graphql/v1
                              principals:
                                - header:
                                    name: apikey
                                    string_match:
                                      exact: '${SERVICE_ROLE_KEY}'
                                - header:
                                    name: apikey
                                    string_match:
                                      exact: '${ANON_KEY}'
                                - header:
                                    name: apikey
                                    string_match:
                                      exact: '${SERVICE_ROLE_KEY_ASYMMETRIC}'
                                - header:
                                    name: apikey
                                    string_match:
                                      exact: '${ANON_KEY_ASYMMETRIC}'
                    - name: envoy.filters.http.router
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-edge-functions-functions
  labels:
    app.kubernetes.io/part-of: homeserver
    homeserver/service: supabase
data:
  hello-index-ts: |
    // Follow this setup guide to integrate the Deno language server with your editor:
    // https://deno.land/manual/getting_started/setup_your_environment
    // This enables autocomplete, go to definition, etc.

    Deno.serve(async () => {
      return new Response(
        `"Hello from Edge Functions!"`,
        { headers: { "Content-Type": "application/json" } },
      )
    })

    // To invoke:
    // curl 'http://localhost:<KONG_HTTP_PORT>/functions/v1/hello' \
    //   --header 'Authorization: Bearer <anon/service_role API key>'
  main-index-ts: "import * as jose from 'jsr:@panva/jose@6'\n\nconsole.log('main function started')\n\nconst JWT_SECRET =\
    \ Deno.env.get('JWT_SECRET')\nconst SUPABASE_JWKS = parseJwks(Deno.env.get('SUPABASE_JWKS'))\nconst VERIFY_JWT = Deno.env.get('VERIFY_JWT')\
    \ === 'true'\n\n// NOTE:(kallebysantos) We don't check for valid keys but just the bare array parsing,\n// let this for\
    \ 'jose' lib verification\nexport function parseJwks(raw: string | undefined): jose.JSONWebKeySet | null {\n  if (!raw)\
    \ return null\n  try {\n    const parsed = JSON.parse(raw)\n    if (parsed?.keys && Array.isArray(parsed.keys)) {\n  \
    \    return parsed as jose.JSONWebKeySet\n    }\n    return null\n  } catch {\n    return null\n  }\n}\n\n/**\n * Extract\
    \ JWT token from Authorization header\n *\n * Parses the Authorization header to extract the Bearer token.\n * Expects\
    \ format: \"Bearer <token>\"\n *\n * @param req - The HTTP request object\n * @returns The JWT token string\n * @throws\
    \ Error if Authorization header is missing or malformed\n */\nfunction getAuthToken(req: Request) {\n  const authHeader\
    \ = req.headers.get('authorization')\n  if (!authHeader) {\n    throw new Error('Missing authorization header')\n  }\n\
    \  const [bearer, token] = authHeader.split(' ')\n  if (bearer !== 'Bearer') {\n    throw new Error(`Auth header is not\
    \ 'Bearer {token}'`)\n  }\n  return token\n}\n\nasync function isValidLegacyJWT(jwt: string): Promise<boolean> {\n  if\
    \ (!JWT_SECRET) {\n    console.error('JWT_SECRET not available for HS256 token verification')\n    return false\n  }\n\
    \n  const encoder = new TextEncoder();\n  const secretKey = encoder.encode(JWT_SECRET);\n\n  try {\n    await jose.jwtVerify(jwt,\
    \ secretKey);\n  } catch (e) {\n    console.error('Symmetric Legacy JWT verification error', e);\n    return false;\n\
    \  }\n  return true;\n}\n\nasync function isValidJWT(jwt: string): Promise<boolean> {\n  if (!SUPABASE_JWKS) {\n    console.error('JWKS\
    \ not available for ES256/RS256 token verification')\n    return false\n  }\n\n  try {\n    const localJwks = jose.createLocalJWKSet(SUPABASE_JWKS);\n\
    \    await jose.jwtVerify(jwt, localJwks);\n  } catch (e) {\n    console.error('Asymmetric JWT verification error', e);\n\
    \    return false\n  }\n\n  return true;\n}\n\n/**\n * Verify JWT token, handling both legacy (HS256) and newer (ES256/RS256)\
    \ algorithms\n * \n * This function automatically detects the algorithm used in the token and applies\n * the appropriate\
    \ verification method:\n * - HS256: Uses JWT_SECRET (symmetric key)\n * - ES256/RS256: Uses JWKS endpoint (asymmetric\
    \ public keys)\n * \n * This fix ensures compatibility with both legacy tokens and newer asymmetric tokens,\n * resolving\
    \ the \"Key for the ES256 algorithm must be of type CryptoKey\" error.\n * \n * @param jwt - The JWT token string to verify\n\
    \ * @returns Promise resolving to true if verification succeeds, false otherwise\n */\nasync function isValidHybridJWT(jwt:\
    \ string): Promise<boolean> {\n  const { alg: jwtAlgorithm } = jose.decodeProtectedHeader(jwt)\n\n  if (jwtAlgorithm ===\
    \ 'HS256') {\n    console.log(`Legacy token type detected, attempting ${jwtAlgorithm} verification.`)\n\n    return await\
    \ isValidLegacyJWT(jwt)\n  }\n\n  if (jwtAlgorithm === 'ES256' || jwtAlgorithm === 'RS256') {\n    return await isValidJWT(jwt)\n\
    \  }\n\n  return false;\n}\n\nDeno.serve(async (req: Request) => {\n  if (req.method !== 'OPTIONS' && VERIFY_JWT) {\n\
    \    try {\n      const token = getAuthToken(req)\n      const isValidJWT = await isValidHybridJWT(token);\n\n      if\
    \ (!isValidJWT) {\n        return new Response(JSON.stringify({ msg: 'Invalid JWT' }), {\n          status: 401,\n   \
    \       headers: { 'Content-Type': 'application/json' },\n        })\n      }\n    } catch (e) {\n      console.error(e)\n\
    \      return new Response(JSON.stringify({ msg: e.toString() }), {\n        status: 401,\n        headers: { 'Content-Type':\
    \ 'application/json' },\n      })\n    }\n  }\n\n  const url = new URL(req.url)\n  const { pathname } = url\n  const path_parts\
    \ = pathname.split('/')\n  const service_name = path_parts[1]\n\n  if (!service_name || service_name === '') {\n    const\
    \ error = { msg: 'missing function name in request' }\n    return new Response(JSON.stringify(error), {\n      status:\
    \ 400,\n      headers: { 'Content-Type': 'application/json' },\n    })\n  }\n\n  const servicePath = `/home/deno/functions/${service_name}`\n\
    \  console.error(`serving the request with ${servicePath}`)\n\n  const memoryLimitMb = 150\n  const workerTimeoutMs =\
    \ 1 * 60 * 1000\n  const noModuleCache = false\n  const importMapPath = null\n  const envVarsObj = Deno.env.toObject()\n\
    \  const envVars = Object.keys(envVarsObj).map((k) => [k, envVarsObj[k]])\n\n  try {\n    const worker = await EdgeRuntime.userWorkers.create({\n\
    \      servicePath,\n      memoryLimitMb,\n      workerTimeoutMs,\n      noModuleCache,\n      importMapPath,\n      envVars,\n\
    \    })\n    return await worker.fetch(req)\n  } catch (e) {\n    const error = { msg: e.toString() }\n    return new\
    \ Response(JSON.stringify(error), {\n      status: 500,\n      headers: { 'Content-Type': 'application/json' },\n    })\n\
    \  }\n})\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supabase-pooler-files
  labels:
    app.kubernetes.io/part-of: homeserver
    homeserver/service: supabase
data:
  services-supabase-volumes-pooler-pooler-exs: |
    {:ok, _} = Application.ensure_all_started(:supavisor)

    {:ok, version} =
      case Supavisor.Repo.query!("select version()") do
        %{rows: [[ver]]} -> Supavisor.Helpers.parse_pg_version(ver)
        _ -> nil
      end

    params = %{
      "external_id" => System.get_env("POOLER_TENANT_ID"),
      "db_host" => System.get_env("POSTGRES_HOST") || "db",
      "db_port" => System.get_env("POSTGRES_PORT"),
      "db_database" => System.get_env("POSTGRES_DB"),
      "require_user" => false,
      "auth_query" => "SELECT * FROM pgbouncer.get_auth($1)",
      "default_max_clients" => System.get_env("POOLER_MAX_CLIENT_CONN"),
      "default_pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
      "default_parameter_status" => %{"server_version" => version},
      "users" => [%{
        "db_user" => "pgbouncer",
        "db_password" => System.get_env("POSTGRES_PASSWORD"),
        "mode_type" => System.get_env("POOLER_POOL_MODE"),
        "pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
        "is_manager" => true
      }]
    }

    if !Supavisor.Tenants.get_tenant_by_external_id(params["external_id"]) do
      {:ok, _} = Supavisor.Tenants.create_tenant(params)
    end
---
