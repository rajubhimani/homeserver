    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser Hub</title>
    <style>
      :root {
        --bg: #f5f6f8; --card-bg: #ffffff; --text: #1a1a1a; --text-secondary: #666;
        --border: #e2e4e8; --accent: #A85C04;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #16181d; --card-bg: #20232b; --text: #eaeaea; --text-secondary: #999; --border: #33363f; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 2rem;
      }
      main { width: 100%; max-width: 640px; }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      p.sub { color: var(--text-secondary); margin: 0 0 1.75rem; font-size: 0.9rem; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
      a.browser-link {
        display: flex; align-items: center; gap: 0.9rem; padding: 1rem 1.1rem;
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
        text-decoration: none; color: var(--text); transition: border-color 0.15s;
      }
      a.browser-link:hover { border-color: var(--accent); }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #999; flex-shrink: 0; transition: background 0.2s; }
      .dot.online { background: #2ecc71; }
      .dot.offline { background: #c0392b; }
      .name { font-weight: 600; }
      .desc { color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.1rem; }
    </style>
    </head>
    <body>
    <main>
      <h1>Browser Hub</h1>
      <p class="sub">Remote browsers running on this server. Pick one — all traffic goes out from here, not your device.</p>
      <ul>
        <li><a class="browser-link" href="/firefox/">
          <span class="dot" data-status></span>
          <span><div class="name">Firefox</div><div class="desc">General-purpose default</div></span>
        </a></li>
        <li><a class="browser-link" href="/chromium/">
          <span class="dot" data-status></span>
          <span><div class="name">Chromium</div><div class="desc">For Chrome/Chromium-only sites and tools</div></span>
        </a></li>
        <li><a class="browser-link" href="/brave/">
          <span class="dot" data-status></span>
          <span><div class="name">Brave</div><div class="desc">Privacy-focused, ad-blocking by default</div></span>
        </a></li>
        <li><a class="browser-link" href="/mullvad-browser/">
          <span class="dot" data-status></span>
          <span><div class="name">Mullvad Browser</div><div class="desc">Hardened, anti-fingerprinting Firefox fork</div></span>
        </a></li>
        <li><a class="browser-link" href="/librewolf/">
          <span class="dot" data-status></span>
          <span><div class="name">LibreWolf</div><div class="desc">Privacy-hardened Firefox fork, telemetry removed</div></span>
        </a></li>
        <li><a class="browser-link" href="/zen/">
          <span class="dot" data-status></span>
          <span><div class="name">Zen</div><div class="desc">Firefox-based, vertical tabs and a modern layout</div></span>
        </a></li>
        <li><a class="browser-link" href="/helium/">
          <span class="dot" data-status></span>
          <span><div class="name">Helium</div><div class="desc">Privacy-first Chromium browser with ad-blocking built in</div></span>
        </a></li>
        <li><a class="browser-link" href="/chrome/">
          <span class="dot" data-status></span>
          <span><div class="name">Chrome</div><div class="desc">Official Google Chrome — for Chrome-only sites</div></span>
        </a></li>
        <li><a class="browser-link" href="/edge/">
          <span class="dot" data-status></span>
          <span><div class="name">Edge</div><div class="desc">Official Microsoft Edge — for Microsoft 365 and Edge-only sites</div></span>
        </a></li>
        <li><a class="browser-link" href="/vivaldi/">
          <span class="dot" data-status></span>
          <span><div class="name">Vivaldi</div><div class="desc">Power-user Chromium: tab stacking, built-in mail and calendar</div></span>
        </a></li>
      </ul>
    </main>
    <script>
      document.querySelectorAll('a.browser-link').forEach(async (link) => {
        const dot = link.querySelector('[data-status]');
        const slug = link.getAttribute('href').replace(/\//g, '');
        try {
          const res = await fetch(`/_status/${slug}`, { signal: AbortSignal.timeout(4000), cache: 'no-store' });
          dot.classList.add(res.status < 500 ? 'online' : 'offline');
        } catch {
          dot.classList.add('offline');
        }
      });
    </script>
    </body>
    </html>
