      initContainers:
      - name: wait-db
        image: alpine:3.24.2
        envFrom:
        - secretRef:
            name: plane-env
        command:
        - sh
        - -c
        - until nc -z -w 2 "$DB_HOST" "$DB_PORT"; do echo "waiting for $DB_HOST:$DB_PORT"; sleep 2; done
        securityContext:
          allowPrivilegeEscalation: false
      - name: wait-plane-mq
        image: alpine:3.24.2
        command:
        - sh
        - -c
        - until nc -z -w 2 plane-mq 5672; do echo waiting for plane-mq:5672; sleep 2; done
        securityContext:
          allowPrivilegeEscalation: false
      - name: wait-plane-redis
        image: alpine:3.24.2
        command:
        - sh
        - -c
        - until nc -z -w 2 plane-redis 6379; do echo waiting for plane-redis:6379; sleep 2; done
        securityContext:
          allowPrivilegeEscalation: false
      containers:
      - name: plane-worker
        image: makeplane/plane-backend:v1.4.2
        args:
        - ./bin/docker-entrypoint-worker.sh
        envFrom:
        - configMapRef:
            name: homeserver-root
        - secretRef:
            name: plane-env
        env:
        - name: AWS_ACCESS_KEY_ID
          value: $(MINIO_ROOT_USER)
        - name: AWS_S3_BUCKET_NAME
          value: uploads
        - name: AWS_S3_ENDPOINT_URL
          value: $(S3_ENDPOINT)
        - name: AWS_SECRET_ACCESS_KEY
          value: $(MINIO_ROOT_PASSWORD)
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(POSTGRES_DB)
        - name: RABBITMQ_HOST
          value: $(MQ_HOST)
        - name: REDIS_URL
          value: redis://$(CACHE_HOST):$(CACHE_PORT)/
        - name: SECRET_KEY
          value: $(SECRET_KEY)
        securityContext:
          allowPrivilegeEscalation: false
