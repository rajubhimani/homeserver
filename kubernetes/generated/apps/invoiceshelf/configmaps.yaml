  services-invoiceshelf-entrypoint-d-10-ensure-stora: |
    #!/bin/sh
    # compose.yml bind-mounts the *entire* /var/www/html/storage directory,
    # which hides the subdirectories Laravel/InvoiceShelf need (the image
    # normally ships them pre-populated, but the container's own entrypoint
    # doesn't recreate them once storage/ is an empty bind mount) -- a fresh
    # install or a --fresh restart both hit this the same way, since either
    # starts from an empty storage/. templates/pdf specifically fails the
    # boot-time "php artisan optimize" step outright ("does not exist");
    # the others fail more quietly later (cache/session errors, missing
    # upload targets) rather than at boot, but are just as required.
    # serversideup/php's own /etc/entrypoint.d/* mechanism (run in order
    # before the app boots) is the right place for this, same as
    # 99-fix-env-permissions.sh. See docs/services/invoiceshelf.md.
    for dir in \
        framework/cache/data \
        framework/sessions \
        framework/views \
        framework/testing \
        app/public \
        app/templates/pdf \
        app/estimates \
        app/invoices \
        app/company_logo \
        app/backup
    do
        mkdir -p "/var/www/html/storage/$dir"
    done
    chown -R www-data:www-data /var/www/html/storage
  services-invoiceshelf-entrypoint-d-99-fix-env-perm: |
    #!/bin/sh
    # /var/www/html/.env ships root-owned (644) in this image, but the actual
    # request-handling process runs as www-data (php-fpm's worker pool, not the
    # root master process) — so www-data can read it but not write it. The
    # install wizard's "database config" step needs to write DB settings back
    # into .env and fails with a generic "cannot write configuration" error
    # without this. .env isn't on a mounted volume, so this must run on every
    # container start, not just once — this file is serversideup/php's own
    # documented drop-in mechanism (/etc/entrypoint.d/*, run in order before the
    # app boots) for exactly this kind of fixup. See docs/services/invoiceshelf.md.
    chown www-data:www-data /var/www/html/.env
    chmod 664 /var/www/html/.env
