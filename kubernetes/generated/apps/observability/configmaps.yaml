# GENERATED by kubernetes/generate.py from services/observability/ — do not edit.
# Change Compose, .env.example or kubernetes/overrides/observability.yaml, then re-run it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-files
  labels:
    app.kubernetes.io/part-of: homeserver
    homeserver/service: observability
data:
  services-observability-alloy-config-kubernetes-all: |
    // Kubernetes version of config.alloy (kubernetes/overrides/observability.yaml
    // mounts it instead): pod logs through the Kubernetes API, Grafana's
    // recommended way (grafana.com/docs/alloy/latest/collect/logs-in-kubernetes:
    // no host privileges, unlike reading /var/log/pods). One Alloy covers the
    // whole cluster. Permissions: kubernetes/cluster/base/observability-rbac.yaml.

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      // "container" carries the same names as under Docker: the generator names
      // each workload after Compose's container_name (pod label
      // app.kubernetes.io/name); other pods keep their container's name.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "(.+)"
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_homeserver_service"]
        target_label  = "service"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-files
  labels:
    app.kubernetes.io/part-of: homeserver
    homeserver/service: observability
data:
  services-observability-loki-loki-config-yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 336h
      # Two separate things reject "old" log entries in Loki, and both
      # needed fixing — a single reject_old_samples: false is NOT enough on
      # its own (verified: confirmed live via /config, rejections continued
      # regardless):
      #  1. This distributor-level check, against reject_old_samples_max_age
      #     (default 1 week) — genuinely old/stale data.
      #  2. The ingester-level per-stream out-of-order window, sized at HALF
      #     of ingester.max_chunk_age below (default 2h -> 1h window) from
      #     that stream's own most recent entry — a completely different
      #     mechanism, the one actually producing "entry too far behind,
      #     oldest acceptable timestamp is: ..." in Alloy/Loki's own logs.
      # This stack's normal workflow is frequent up/down/restart cycles
      # (homeserver.py), and Docker/Alloy can flush a multi-hour backlog of
      # buffered log lines on reconnect after a container's been stopped for
      # a while — comfortably wider than the default ~1h ingester window.
      # Disabled/widened rather than left default: the risk of accepting
      # genuinely-old data is low for a homelab log store, and the cost of
      # silently losing real logs after ordinary restarts is worse.
      reject_old_samples: false

    ingester:
      max_chunk_age: 24h

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-files
  labels:
    app.kubernetes.io/part-of: homeserver
    homeserver/service: observability
data:
  services-observability-prometheus-prometheus-kuber: |
    # Kubernetes version of prometheus.yml (kubernetes/overrides/observability.yaml
    # mounts it instead). Container metrics come from the cAdvisor built into
    # every kubelet (/metrics/cadvisor), scraped from each kubelet directly as
    # kube-prometheus-stack does: that needs only the nodes/metrics permission,
    # not nodes/proxy (which reaches the kubelet's whole API). The standalone
    # cAdvisor container isn't needed. The kubelet's serving certificate is
    # self-signed on kind and kubeadm, so it isn't verified (as there).
    # Permissions: kubernetes/cluster/base/observability-rbac.yaml.

    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node    # targets each node's kubelet on its InternalIP:10250
        metric_relabel_configs:
          # The dashboards select containers by "name" (Docker's container name);
          # the kubelet calls it "container", and the generator gives every
          # container its Compose container_name.
          - source_labels: [container]
            regex: (.+)
            target_label: name

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [apps]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9100
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
