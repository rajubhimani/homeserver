            exec:
              command: ["bash", "-c", "airflow jobs check --job-type DagProcessorJob --hostname \"$HOSTNAME\""]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: airflow-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-triggerer
  namespace: apps
  labels:
    app: airflow-triggerer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-triggerer
  template:
    metadata:
      labels:
        app: airflow-triggerer
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
      containers:
        - name: airflow-triggerer
          image: apache/airflow:3.3.1
          args: ["triggerer"]
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: airflow-db-credentials
                  key: sql-alchemy-conn
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-credentials
                  key: fernet-key
            - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
              value: http://airflow-apiserver:8080/execution/
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: airflow-credentials
                  key: jwt-secret
            - name: AIRFLOW__API__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: airflow-credentials
                  key: api-secret-key
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW_CONFIG
              value: /opt/airflow/config/airflow.cfg
            # Deferrable operators serialize their Trigger's classpath as a
            # bare module name and the triggerer resolves it with plain
            # import_string — unlike the scheduler/dag-processor, which add
            # each DAG file's own directory to sys.path while parsing it,
            # the triggerer never does that, so a trigger class living in a
            # DAG file is otherwise unimportable here.
            - name: PYTHONPATH
              value: /opt/airflow/dags
          volumeMounts:
            - name: data
              mountPath: /opt/airflow/dags
              subPath: dags
            - name: data
              mountPath: /opt/airflow/logs
              subPath: logs
            - name: data
              mountPath: /opt/airflow/config
              subPath: config
            - name: data
              mountPath: /opt/airflow/plugins
              subPath: plugins
          resources:
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["bash", "-c", "airflow jobs check --job-type TriggererJob --hostname \"$HOSTNAME\""]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["bash", "-c", "airflow jobs check --job-type TriggererJob --hostname \"$HOSTNAME\""]
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: airflow-data
