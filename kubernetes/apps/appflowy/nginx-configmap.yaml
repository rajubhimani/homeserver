# Verbatim copy of appflowy/nginx.conf (bind-mounted in compose via
# `./nginx.conf:/etc/nginx/nginx.conf:ro`) — the upstream hostnames here
# already match this pilot's Service names one-for-one (appflowy-gotrue,
# appflowy-cloud, appflowy-admin, appflowy-web), so no edits were needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-nginx-config
  namespace: apps
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 80;
            listen [::]:80;

            underscores_in_headers on;

            # GoTrue auth service
            location /gotrue/ {
                proxy_pass http://appflowy-gotrue:9999/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }

            # AppFlowy Cloud REST API
            location /api/ {
                proxy_pass http://appflowy-cloud:8000/api/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                client_max_body_size 512m;
            }

            # AppFlowy Cloud WebSocket — web client sends /ws/{workspace_id}/ but
            # appflowy_cloud:0.16+ expects /ws/v2/{workspace_id}; rewrite here.
            location ~ ^/ws/(?!v[12]/)([^/?]+) {
                rewrite ^/ws/([^/?]+)(.*)$ /ws/v2/$1$2 break;
                proxy_pass http://appflowy-cloud:8000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 86400s;
            }

            # /ws/v1 and /ws/v2/{id} pass through directly
            location /ws {
                proxy_pass http://appflowy-cloud:8000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 86400s;
            }

            # Admin frontend
            location /web/ {
                proxy_pass http://appflowy-admin:3000/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }

            # Main web frontend
            location / {
                proxy_pass http://appflowy-web:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
    }
