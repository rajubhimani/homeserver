# No lan-service.yaml for this one, deliberately — every other gated
# service in this pilot still gets a LoadBalancer bypass path (documented
# as a tradeoff in each one's lan-service.yaml), but Dashboard carries
# cluster-admin power (see rbac.yaml): scale, exec, edit Secrets, delete
# anything, cluster-wide. A bypass here isn't "convenient LAN testing
# shortcut", it's a route around the only thing standing between "anyone
# on the LAN" and full cluster control. Access this one only through the
# Gateway, with the Authentik gate intact.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "dashboard.k8s.local"
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: dashboard
          port: 9090
