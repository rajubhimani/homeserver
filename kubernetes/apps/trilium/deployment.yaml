apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trilium-data
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
  namespace: apps
  labels:
    app: trilium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trilium
  template:
    metadata:
      labels:
        app: trilium
    spec:
      containers:
        - name: trilium
          image: triliumnext/trilium:v0.104.1
          env:
            - name: TRILIUM_DATA_DIR
              value: /home/node/trilium-data
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /home/node/trilium-data
          readinessProbe:
            httpGet:
              path: /api/health-check
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health-check
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trilium-data
---
apiVersion: v1
kind: Service
metadata:
  name: trilium
  namespace: apps
spec:
  selector:
    app: trilium
  ports:
    - port: 8080
