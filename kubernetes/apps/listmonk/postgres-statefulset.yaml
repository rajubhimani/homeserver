apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: listmonk-db
  namespace: apps
spec:
  serviceName: listmonk-db
  replicas: 1
  selector:
    matchLabels:
      app: listmonk-db
  template:
    metadata:
      labels:
        app: listmonk-db
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: listmonk
            - name: POSTGRES_USER
              value: listmonk
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: listmonk-db-credentials
                  key: password
          args:
            - -c
            - shared_buffers=128MB
            - -c
            - max_connections=20
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - effective_cache_size=256MB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "listmonk"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: listmonk-db
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: listmonk-db
  ports:
    - port: 5432
