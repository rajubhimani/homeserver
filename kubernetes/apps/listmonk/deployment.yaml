apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: listmonk-uploads
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listmonk
  namespace: apps
  labels:
    app: listmonk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: listmonk
  template:
    metadata:
      labels:
        app: listmonk
    spec:
      enableServiceLinks: false
      containers:
        - name: listmonk
          image: listmonk/listmonk:v6.2.0
          args: ["sh", "-c", "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"]
          env:
            - name: LISTMONK_app__address
              value: "0.0.0.0:9000"
            - name: LISTMONK_db__host
              value: listmonk-db
            - name: LISTMONK_db__port
              value: "5432"
            - name: LISTMONK_db__user
              value: listmonk
            - name: LISTMONK_db__password
              valueFrom:
                secretKeyRef:
                  name: listmonk-db-credentials
                  key: password
            - name: LISTMONK_db__database
              value: listmonk
            - name: LISTMONK_db__ssl_mode
              value: disable
            - name: LISTMONK_ADMIN_USER
              value: admin
            - name: LISTMONK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: listmonk-credentials
                  key: admin-password
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: uploads
              mountPath: /listmonk/uploads
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 30
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: listmonk-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: listmonk
  namespace: apps
spec:
  selector:
    app: listmonk
  ports:
    - port: 9000
