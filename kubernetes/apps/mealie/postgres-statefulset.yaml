# Own dedicated Postgres — same init-script-owns-schema pattern as
# guacamole/forgejo/firefly.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mealie-db
  namespace: apps
spec:
  serviceName: mealie-db
  replicas: 1
  selector:
    matchLabels:
      app: mealie-db
  template:
    metadata:
      labels:
        app: mealie-db
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mealie
            - name: POSTGRES_USER
              value: mealie
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db-credentials
                  key: password
          args:
            - -c
            - shared_buffers=128MB
            - -c
            - max_connections=20
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - effective_cache_size=256MB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mealie"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: init
          configMap:
            name: mealie-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mealie-db
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: mealie-db
  ports:
    - port: 5432
