# Onboards mattermost onto the shared Postgres server (kubernetes/cluster/
# postgres/) instead of a dedicated StatefulSet — copied from
# kubernetes/cluster/postgres/db-init-job.template.yaml with SERVICE_NAME
# replaced. Mattermost has no version/extension requirement that needs
# its own Postgres.
apiVersion: batch/v1
kind: Job
metadata:
  name: mattermost-db-init
  namespace: data
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:18.6-alpine
          env:
            - name: PGHOST
              value: postgres-shared.data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-shared-credentials
                  key: postgres-password
            - name: SERVICE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mattermost-db-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              psql -tc "SELECT 1 FROM pg_roles WHERE rolname='mattermost'" | grep -q 1 || \
                psql -c "CREATE ROLE \"mattermost\" LOGIN PASSWORD '$SERVICE_DB_PASSWORD';"
              psql -tc "SELECT 1 FROM pg_database WHERE datname='mattermost'" | grep -q 1 || \
                psql -c "CREATE DATABASE \"mattermost\" OWNER \"mattermost\";"
