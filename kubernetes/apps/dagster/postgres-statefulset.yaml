# Only dagster-db is ported here. services/dagster/compose.yml's other
# three services (dagster-user-code, dagster-webserver, dagster-daemon) all
# build from a local Dockerfile (user-code/Dockerfile,
# webserver-daemon/Dockerfile) instead of pulling a public image — unlike
# forgejo/n8n/plane/etc., Dagster publishes no stock "just run it" webserver
# or daemon image, because a code location (the gRPC server) *is* your own
# pipeline code and dependency set by definition, and the webserver/daemon
# image bakes in this deployment's own dagster.yaml/workspace.yaml too. This
# pilot has no CI/registry to build and push those three custom images
# (same category of gap as forgejo's CI runner or immich's offline-remover —
# see forgejo/deployment.yaml's header), so the app tier that would give you
# a working Dagster UI is left out. Only the dedicated Postgres this app
# tier would talk to is ported, so it's ready if a registry becomes
# available later. No httproute.yaml/lan-service.yaml/deployment.yaml exist
# in this directory as a result — there is no working backend to route to.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dagster-db
  namespace: apps
spec:
  serviceName: dagster-db
  replicas: 1
  selector:
    matchLabels:
      app: dagster-db
  template:
    metadata:
      labels:
        app: dagster-db
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: dagster
            - name: POSTGRES_USER
              value: dagster
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-db-credentials
                  key: password
          # compose's `command: postgres -c ...` overrides CMD only — args:
          # here (not command:), same ENTRYPOINT-preserving reasoning as
          # every other Postgres in this repo (see TROUBLESHOOTING.md).
          args:
            - -c
            - shared_buffers=128MB
            - -c
            - max_connections=50
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - effective_cache_size=384MB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dagster", "-d", "dagster"]
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: init
          configMap:
            name: dagster-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-db
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: dagster-db
  ports:
    - port: 5432
