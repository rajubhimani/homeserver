# Onboards dagster onto the shared Postgres server (kubernetes/cluster/
# postgres/) instead of a dedicated StatefulSet — copied from
# kubernetes/cluster/postgres/db-init-job.template.yaml with SERVICE_NAME
# replaced. Dagster has no version/extension requirement that needs its
# own Postgres, so it doesn't warrant a dedicated instance — see that
# template's own header for which services do (own version/extensions)
# vs don't.
#
# Only dagster-db exists here — see this directory's history/README for
# why the app tier (webserver/daemon/user-code) isn't ported: all three
# build from a local Dockerfile in Compose, and this pilot has no
# CI/registry to build and push those custom images.
apiVersion: batch/v1
kind: Job
metadata:
  name: dagster-db-init
  namespace: data
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:18.6-alpine
          env:
            - name: PGHOST
              value: postgres-shared.data.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-shared-credentials
                  key: postgres-password
            - name: SERVICE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dagster-db-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              psql -tc "SELECT 1 FROM pg_roles WHERE rolname='dagster'" | grep -q 1 || \
                psql -c "CREATE ROLE \"dagster\" LOGIN PASSWORD '$SERVICE_DB_PASSWORD';"
              psql -tc "SELECT 1 FROM pg_database WHERE datname='dagster'" | grep -q 1 || \
                psql -c "CREATE DATABASE \"dagster\" OWNER \"dagster\";"
