apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: invoiceshelf
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "invoiceshelf.k8s.local"
  rules:
    - backendRefs:
        - name: invoiceshelf
          port: 8080
