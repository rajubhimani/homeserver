apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: invoiceshelf-db
  namespace: apps
spec:
  serviceName: invoiceshelf-db
  replicas: 0
  selector:
    matchLabels:
      app: invoiceshelf-db
  template:
    metadata:
      labels:
        app: invoiceshelf-db
    spec:
      enableServiceLinks: false
      containers:
        - name: mariadb
          image: mariadb:12.3.2
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceshelf-db-credentials
                  key: root-password
            - name: MYSQL_DATABASE
              value: invoiceshelf
            - name: MYSQL_USER
              value: invoiceshelf
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: invoiceshelf-db-credentials
                  key: password
          args: ["--innodb-buffer-pool-size=128M", "--max-connections=20"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: invoiceshelf-db
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: invoiceshelf-db
  ports:
    - port: 3306
