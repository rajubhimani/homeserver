# Own dedicated Postgres — must be this exact vendor-customized image
# (pgvector/vectorchord support), same tag already pinned and proven working
# in immich/compose.yml. Deliberately NOT the newer vectorchord/pgvector
# combo available upstream, nor upstream's own official compose example
# (which pins Postgres 14, not 18) — these extensions are tightly coupled
# to Immich's own migrations/schema, so "already proven to work with this
# exact immich-server version in this repo" beats "latest available" here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-db
  namespace: apps
spec:
  serviceName: immich-db
  replicas: 1
  selector:
    matchLabels:
      app: immich-db
  template:
    metadata:
      labels:
        app: immich-db
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: password
          # -c config_file=... MUST stay first — this vendor image's default
          # CMD requires it for pgvector/vectorchord's shared_preload_libraries,
          # confirmed via `docker inspect` per docs/08-maintenance.md's
          # warning about this exact image. args here (not command) — same
          # ENTRYPOINT-vs-CMD reasoning as every other Postgres in this repo.
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - shared_buffers=512MB
            - -c
            - max_connections=50
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=256MB
            - -c
            - effective_cache_size=1536MB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            limits:
              memory: 2Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-db
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: immich-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: apps
  labels:
    app: immich-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      containers:
        - name: redis
          image: valkey/valkey:9.1-alpine
          args: ["valkey-server", "--save", "", "--stop-writes-on-bgsave-error", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: apps
spec:
  selector:
    app: immich-redis
  ports:
    - port: 6379
