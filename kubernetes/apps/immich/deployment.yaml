# Mirrors immich/compose.yml. Upload location is a PVC populated with
# placeholder test data via kubectl cp (same reasoning as jellyfin's media
# PVC — kind's nodes have no host filesystem passthrough, and this pilot
# never touches real host data regardless). immich-offline-remover
# intentionally omitted — it needs an API key generated from inside a
# already-set-up Immich instance (chicken-and-egg for a fresh pilot
# deployment), same category of decision as omitting forgejo's CI runner.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-upload-test
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-server-data
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: apps
  labels:
    app: immich-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      enableServiceLinks: false
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.1.0
          ports:
            - containerPort: 2283
          env:
            # Pre-composed as a single secret value (db-url), not built via
            # k8s's $(VAR) substitution — that only resolves references to
            # variables defined *earlier* in the same env list, and DB_URL
            # needing DB_PASSWORD (defined after it) silently failed,
            # leaving the literal unexpanded string as the value and
            # crash-looping immich-server on every restart.
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: db-url
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: password
            - name: IMMICH_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich-credentials
                  key: secret
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: DB_VECTOR_EXTENSION
              value: vectorchord
            - name: DB_SKIP_MIGRATIONS
              value: "false"
            - name: IMMICH_LOG_LEVEL
              value: log
            - name: TZ
              value: Etc/UTC
          volumeMounts:
            - name: upload
              mountPath: /usr/src/app/upload
            - name: server-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 40
            periodSeconds: 30
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: immich-upload-test
        - name: server-data
          persistentVolumeClaim:
            claimName: immich-server-data
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: apps
spec:
  selector:
    app: immich-server
  ports:
    - port: 2283
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: apps
  labels:
    app: immich-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-ml
  template:
    metadata:
      labels:
        app: immich-ml
    spec:
      enableServiceLinks: false
      containers:
        - name: immich-ml
          image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: db-url
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: password
            - name: REDIS_HOSTNAME
              value: immich-redis
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: immich-model-cache
