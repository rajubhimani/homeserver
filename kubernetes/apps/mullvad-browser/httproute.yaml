apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mullvad-browser
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "mullvad-browser.k8s.local"
  rules:
    - backendRefs:
        - name: mullvad-browser
          port: 3000
