# Gated behind Authentik forward-auth, matching services/nginx-plain/
# templates/default.conf.template's wg-admin.${DOMAIN} server block (its
# own comment there: only the admin UI is proxied this way, the actual
# WireGuard UDP tunnel never touches the proxy) — see
# kubernetes/apps/authentik/forward-auth-middleware.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wg-easy
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "wg-easy.k8s.local"
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: wg-easy
          port: 51821
