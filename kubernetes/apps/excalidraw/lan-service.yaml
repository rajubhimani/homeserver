# Direct LAN-reachable port — the "dev env" equivalent from the compose
# stack (ports exposed directly, no hostname routing needed) vs the
# HTTPRoute's "prod env" equivalent (hostname routing through Traefik).
# For local/LAN testing only, until AdGuard Home is set up as the network's
# DNS resolver to make hostname routing work from every device.
#
# Port 8116 matches excalidraw/compose.dev.yml exactly — same number you
# already know, no new one to learn. The Compose version of this service
# must stay stopped while this is running (same host port, can't both bind
# it) — not currently running, so nothing needed here.
apiVersion: v1
kind: Service
metadata:
  name: excalidraw-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: excalidraw
  ports:
    - port: 8116
      targetPort: 80
