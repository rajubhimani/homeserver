apiVersion: apps/v1
kind: Deployment
metadata:
  name: calcom
  namespace: apps
  labels:
    app: calcom
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calcom
  template:
    metadata:
      labels:
        app: calcom
    spec:
      enableServiceLinks: false
      containers:
        - name: calcom
          image: calcom/cal.com:v6.2.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: calcom-db-credentials
                  key: database-url
            - name: DATABASE_DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: calcom-db-credentials
                  key: database-url
            - name: NEXT_PUBLIC_WEBAPP_URL
              value: https://calcom.k8s.local
            - name: NEXTAUTH_URL
              value: https://calcom.k8s.local
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: calcom-credentials
                  key: nextauth-secret
            - name: CALENDSO_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: calcom-credentials
                  key: encryption-key
            - name: EMAIL_SERVER_PORT
              value: "587"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: calcom
  namespace: apps
spec:
  selector:
    app: calcom
  ports:
    - port: 3000
