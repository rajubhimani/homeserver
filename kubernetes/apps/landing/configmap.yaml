    server {
        listen 80;

        # Use Docker's internal DNS, resolve at request time not startup
        resolver 127.0.0.11 valid=10s;

        # Applied to all proxy (health check) locations that don't override add_header.
        # Prevents browsers from caching health check responses — a stale 200 would
        # show a stopped service as online. location / has its own add_header directives
        # so it does NOT inherit these; static HTML caching is controlled there.
        proxy_hide_header Content-Type;
        add_header Content-Type "text/plain" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        location /health/immich {
            set $upstream http://immich-server:2283;
            proxy_pass $upstream/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location /health/nextcloud {
            set $upstream http://nextcloud:80;
            # Nextcloud validates the Host header against trusted_domains — the bare "/"
            # arrives with an untrusted Host and gets rejected with 400. /status.php is
            # Nextcloud's own lightweight status endpoint (same one its Docker healthcheck
            # uses) and only needs a Host it trusts, e.g. localhost.
            proxy_pass $upstream/status.php;
            proxy_set_header Host localhost;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location /health/jellyfin {
            set $upstream http://jellyfin:8096;
            proxy_pass $upstream/;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
