# Config-as-code ConfigMap for the stock nginx:1.28.0-alpine image, mirroring
# landing/docker-compose.yml's three bind mounts (index.html, nginx.conf,
# entrypoint.sh) exactly. NOTE: landing's compose file lives at
# landing/docker-compose.yml, not landing/compose.yml — see CLAUDE.md for
# why (the one deliberate exception in the repo).
#
# This is NOT a custom-built image (no Dockerfile — landing just mounts
# config into the stock nginx image), so the "image needs to be pushed
# somewhere first" gap that would apply to a locally-built image doesn't
# apply here. There IS a real, analogous gap though: Compose bind-mounts
# these three files live from landing/ on disk, so an edit there takes
# effect on the next container restart with zero extra steps. A ConfigMap
# is a point-in-time copy — editing landing/index.html, landing/nginx.conf,
# or landing/entrypoint.sh in the repo does NOT automatically update this
# ConfigMap; it has to be regenerated and reapplied by hand. Treat this
# ConfigMap as a manual mirror of those three files, not a live link to
# them — worth calling out in kubernetes/README.md's "Current status" as a
# real content-drift risk, same category of gap as the other Compose→k8s
# semantic mismatches already logged in TROUBLESHOOTING.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-config
  namespace: apps
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>SITE_NAME_PLACEHOLDER</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --pt-accent: #1D9E75;
          --pt-accent-dark: #0F6E56;
          --bg-primary: #ffffff;
          --bg-secondary: #f5f5f3;
          --text-primary: #1a1a1a;
          --text-secondary: #6b6b6b;
          --text-tertiary: #9b9b9b;
          --border: rgba(0,0,0,0.10);
          --border-hover: rgba(0,0,0,0.22);
          --shadow: 0 1px 3px rgba(0,0,0,0.06);
          --shadow-hover: 0 4px 12px rgba(0,0,0,0.10);
          --radius-md: 8px;
          --radius-lg: 12px;
          --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
          :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #161616;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-tertiary: #505050;
            --border: rgba(255,255,255,0.10);
            --border-hover: rgba(255,255,255,0.22);
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.4);
            --pt-accent: #2bc492;
            --pt-accent-dark: #1D9E75;
          }
        }

        body {
          font-family: var(--font);
          background: var(--bg-secondary);
          color: var(--text-primary);
          min-height: 100vh;
          padding: 2rem 1.5rem;
        }

        .wrap {
          max-width: 1400px;
          margin: 0 auto;
        }

        /* ── Header ────────────────────────────────────────────────────── */
        .header {
          text-align: center;
          padding: 2.5rem 0 2rem;
          border-bottom: 0.5px solid var(--border);
          margin-bottom: 2.5rem;
        }

        .logo {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 0.75rem;
        }

        .logo-mark {
          width: 40px;
          height: 40px;
          border-radius: var(--radius-md);
          background: var(--pt-accent);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }

        .logo-mark svg { width: 22px; height: 22px; }

        .logo-name {
          font-size: 24px;
          font-weight: 600;
          color: var(--text-primary);
          letter-spacing: -0.4px;
        }

        .logo-name span { color: var(--pt-accent); }

        .tagline {
          font-size: 15px;
          color: var(--text-secondary);
          line-height: 1.6;
        }

        /* ── Tab bar ───────────────────────────────────────────────────── */
        .tab-bar {
          display: flex;
          gap: 2px;
          margin-bottom: 2rem;
          border-bottom: 1px solid var(--border);
        }

        .tab-btn {
          display: flex;
          align-items: center;
          gap: 7px;
          padding: 0.5rem 1.125rem 0.625rem;
          font-size: 13px;
          font-weight: 500;
          color: var(--text-secondary);
          background: none;
          border: none;
          border-bottom: 2px solid transparent;
          margin-bottom: -1px;
          cursor: pointer;
          transition: color 0.15s, border-color 0.15s;
          font-family: var(--font);
        }

        .tab-btn:hover { color: var(--text-primary); }

        .tab-btn.active {
          color: var(--text-primary);
          border-bottom-color: var(--pt-accent);
        }

        .tab-count {
          font-size: 11px;
          font-weight: 600;
          padding: 1px 7px;
          border-radius: 20px;
          background: var(--border);
          color: var(--text-secondary);
          transition: background 0.2s, color 0.2s;
        }

        .tab-btn.active[data-tab="online"]  .tab-count { background: var(--pt-accent); color: #fff; }
        .tab-btn.active[data-tab="offline"] .tab-count { background: #c0392b; color: #fff; }

        /* ── Status groups (Online / Offline) ──────────────────────────── */
        .status-group { margin-bottom: 3rem; }

        .sg-dot { display: none; }

        /* ── Category sections (within each status group) ──────────────── */
        .category { margin-bottom: 2rem; }

        .section-label {
          font-size: 11px;
          font-weight: 600;
          color: var(--text-tertiary);
          letter-spacing: 0.1em;
          text-transform: uppercase;
          margin-bottom: 0.875rem;
        }

        /* ── Subgroups (within a category) ──────────────────────────────── */
        .subgroup { margin-bottom: 1.25rem; }
        .subgroup:last-child { margin-bottom: 0; }

        .subgroup-label {
          font-size: 10px;
          font-weight: 600;
          color: var(--text-tertiary);
          letter-spacing: 0.06em;
          text-transform: uppercase;
          opacity: 0.7;
          margin-bottom: 0.625rem;
        }

        /* ── Responsive grid ───────────────────────────────────────────── */
        .grid {
          display: grid;
          gap: 12px;
          grid-template-columns: 1fr;
        }

        @media (min-width: 480px) {
          .grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 768px) {
          .grid { grid-template-columns: repeat(3, 1fr); }
          body { padding: 2rem 2rem; }
        }

        @media (min-width: 1100px) {
          .grid { grid-template-columns: repeat(4, 1fr); }
          body { padding: 2.5rem 3rem; }
        }

        @media (min-width: 1400px) {
          .grid { grid-template-columns: repeat(5, 1fr); }
        }

        /* ── Cards ─────────────────────────────────────────────────────── */
        .card {
          background: var(--bg-primary);
          border: 0.5px solid var(--border);
          border-radius: var(--radius-lg);
          padding: 1.125rem;
          display: flex;
          flex-direction: column;
          gap: 10px;
          box-shadow: var(--shadow);
          transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
          text-decoration: none;
          cursor: default;
        }

        .card:hover {
          border-color: var(--border-hover);
          box-shadow: var(--shadow-hover);
          transform: translateY(-1px);
        }

        .card-icon {
          width: 34px;
          height: 34px;
          border-radius: var(--radius-md);
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }

        .card-icon.teal   { background: #E1F5EE; }
        .card-icon.blue   { background: #E6F1FB; }
        .card-icon.purple { background: #EEE6FB; }
        .card-icon.orange { background: #FBF1E6; }
        .card-icon.red    { background: #FBE6E6; }
        .card-icon.pink   { background: #FBE6F3; }
        .card-icon.gray   { background: #EBEBEB; }
        .card-icon.yellow { background: #FBF8E6; }
        .card-icon.green  { background: #E8F5E9; }

        @media (prefers-color-scheme: dark) {
          .card-icon.teal   { background: #04342C; }
          .card-icon.blue   { background: #042C53; }
          .card-icon.purple { background: #2C0453; }
          .card-icon.orange { background: #532C04; }
          .card-icon.red    { background: #530404; }
          .card-icon.pink   { background: #530432; }
          .card-icon.gray   { background: #333333; }
          .card-icon.yellow { background: #3D3804; }
          .card-icon.green  { background: #0A2E0C; }
        }

        .card-icon svg { width: 18px; height: 18px; }

        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
        }

        .card-name {
          font-size: 14px;
          font-weight: 500;
          color: var(--text-primary);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        /* ── Status badge ──────────────────────────────────────────────── */
        .status {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          font-size: 10px;
          font-weight: 500;
          padding: 2px 7px;
          border-radius: 20px;
          white-space: nowrap;
          flex-shrink: 0;
          transition: background 0.3s, color 0.3s;
        }

        .status.checking { color: #888; background: #ebebeb; }
        .status.online   { color: var(--pt-accent-dark); background: #E1F5EE; }
        .status.offline  { color: #c0392b; background: #FBE6E6; }

        @media (prefers-color-scheme: dark) {
          .status.checking { color: #666; background: #2a2a2a; }
          .status.online   { background: #04342C; color: #2bc492; }
          .status.offline  { background: #530404; color: #e57373; }
        }

        .status-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          flex-shrink: 0;
          transition: background 0.3s;
        }

        .status.checking .status-dot { background: #999; }
        .status.online   .status-dot { background: var(--pt-accent); }
        .status.offline  .status-dot { background: #c0392b; }

        /* ── Card body ─────────────────────────────────────────────────── */
        .card-desc {
          font-size: 12px;
          color: var(--text-secondary);
          line-height: 1.5;
          flex: 1;
        }

        .card-link {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          font-size: 12px;
          color: var(--pt-accent);
          font-weight: 500;
          margin-top: 2px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .card-link svg { width: 11px; height: 11px; flex-shrink: 0; }

        .card-link-secondary {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          font-size: 11px;
          color: var(--text-tertiary);
          font-weight: 500;
          margin-top: 4px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .card-link-secondary:hover { color: var(--pt-accent); }

        .test-badge {
          display: inline-block;
          padding: 1px 5px;
          border-radius: 4px;
          font-size: 9px;
          font-weight: 700;
          letter-spacing: 0.03em;
          background: var(--pt-accent);
          color: #fff;
          opacity: 0.75;
          flex-shrink: 0;
        }

        .test-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          display: inline-block;
          flex-shrink: 0;
          background: #999;
          transition: background 0.3s;
        }

        .test-dot.online  { background: var(--pt-accent); }
        .test-dot.offline { background: #c0392b; }

        /* ── Footer ────────────────────────────────────────────────────── */
        .footer {
          text-align: center;
          padding: 1.5rem 0 0.5rem;
          border-top: 0.5px solid var(--border);
          font-size: 12px;
          color: var(--text-tertiary);
          margin-top: 1rem;
        }
      </style>
    </head>
    <body>
      <div class="wrap">
        <div class="header">
          <div class="logo">
            <div class="logo-mark">
              <svg viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="3" fill="white"/>
                <path d="M10 2 L10 5 M10 15 L10 18 M2 10 L5 10 M15 10 L18 10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M4.9 4.9 L7 7 M13 13 L15.1 15.1 M15.1 4.9 L13 7 M7 13 L4.9 15.1" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="logo-name">SITE_NAME_PLACEHOLDER</span>
          </div>
          <p class="tagline">TAGLINE_PLACEHOLDER</p>
        </div>

        <!-- ── Tab bar ────────────────────────────────────────────────── -->
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="online" onclick="switchTab('online')">
            Online <span class="tab-count">0</span>
          </button>
          <button class="tab-btn" data-tab="offline" onclick="switchTab('offline')">
            Offline <span class="tab-count">0</span>
          </button>
        </div>

        <!-- ── Online section ─────────────────────────────────────────── -->
        <div id="section-online" class="status-group" style="display:none">
          <div class="status-group-label online-label">
            <span class="sg-dot"></span>Online
          </div>
          <div class="category" data-cat="storage" style="display:none">
            <p class="section-label">Storage &amp; Media</p>
            <div class="grid"></div>
          </div>
          <div class="category" data-cat="productivity" style="display:none">
            <p class="section-label">Productivity</p>
          </div>
          <div class="category" data-cat="dev" style="display:none">
            <p class="section-label">Dev &amp; Security</p>
          </div>
          <div class="category" data-cat="system" style="display:none">
            <p class="section-label">System</p>
            <div class="grid"></div>
          </div>
        </div>

        <!-- ── Offline section ────────────────────────────────────────── -->
        <div id="section-offline" class="status-group" style="display:none">
          <div class="status-group-label offline-label">
            <span class="sg-dot"></span>Offline
          </div>
          <div class="category" data-cat="storage" style="display:none">
            <p class="section-label">Storage &amp; Media</p>
            <div class="grid"></div>
          </div>
          <div class="category" data-cat="productivity" style="display:none">
            <p class="section-label">Productivity</p>
          </div>
          <div class="category" data-cat="dev" style="display:none">
            <p class="section-label">Dev &amp; Security</p>
          </div>
          <div class="category" data-cat="system" style="display:none">
            <p class="section-label">System</p>
            <div class="grid"></div>
          </div>
        </div>

        <!-- ── Card pool (hidden — JS places cards into sections) ──────── -->
        <div id="card-pool" style="display:none"></div><!-- /card-pool -->

        <div class="footer">
          Built and maintained by AUTHOR_PLACEHOLDER · LOCATION_PLACEHOLDER · YEAR_PLACEHOLDER
        </div>
      </div>

      <script>
        const DOMAIN = 'DOMAIN_PLACEHOLDER';

        // Service data -- the only thing you touch to add/edit/remove a service.
        // category: 'storage' | 'productivity' | 'dev' | 'system'
        // subcategory: optional -- groups cards within a category under a subheading
        //   (see SUBCATEGORY_LABELS below for display names; only 'productivity'
        //   and 'dev' currently use subgroups, 'storage'/'system' don't need them)
        // sub: public subdomain, only needed when it differs from slug
        // testSub/testHealth/testLabel: optional secondary "test instance" link
        //   sharing this card -- see homeserver-add-service skill step 7a
        const SERVICES = [
      { slug: "immich", name: "Immich", category: "storage", icon: "teal", svg: "<rect x=\"2\" y=\"2\" width=\"14\" height=\"10\" rx=\"2\" stroke=\"#0F6E56\" stroke-width=\"1.4\"/> <circle cx=\"9\" cy=\"7\" r=\"2.5\" stroke=\"#0F6E56\" stroke-width=\"1.4\"/> <path d=\"M5 15 Q9 12 13 15\" stroke=\"#0F6E56\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>", desc: "Self-hosted photo and video backup. Google Photos alternative with facial recognition and smart search." },
      { slug: "nextcloud", name: "Nextcloud", category: "storage", icon: "blue", svg: "<path d=\"M3 5 L3 14 Q3 15 4 15 L14 15 Q15 15 15 14 L15 5\" stroke=\"#185FA5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/> <path d=\"M2 5 L9 2 L16 5\" stroke=\"#185FA5\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/> <path d=\"M7 15 L7 10 L11 10 L11 15\" stroke=\"#185FA5\" stroke-width=\"1.4\"/>", desc: "Personal file storage, sync, and sharing. Google Drive alternative with calendar, contacts, and more." },
      { slug: "jellyfin", name: "Jellyfin", category: "storage", icon: "purple", svg: "<rect x=\"2\" y=\"4\" width=\"14\" height=\"10\" rx=\"2\" stroke=\"#6B35B5\" stroke-width=\"1.4\"/> <path d=\"M6 9 L8 11 L12 7\" stroke=\"#6B35B5\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/> <path d=\"M9 2 L9 4\" stroke=\"#6B35B5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>", desc: "Stream movies, TV shows, and music from your own server. Netflix alternative with no subscriptions." },
      { slug: "syncthing", name: "Syncthing", category: "storage", icon: "teal", svg: "<path d=\"M9 3 A6 6 0 0 1 15 9\" stroke=\"#0F6E56\" stroke-width=\"1.4\" stroke-linecap=\"round\"/> <path d=\"M9 15 A6 6 0 0 1 3 9\" stroke=\"#0F6E56\" stroke-width=\"1.4\" stroke-linecap=\"round\"/> <path d=\"M13 7 L15 9 L13 11\" stroke=\"#0F6E56\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/> <path d=\"M5 7 L3 9 L5 11\" stroke=\"#0F6E56\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", desc: "Continuous P2P file sync between your devices. No cloud middleman — direct device-to-device." },
      { slug: "audiobookshelf", name: "Audiobookshelf", category: "storage", icon: "purple", svg: "<rect x=\"3\" y=\"3\" width=\"12\" height=\"12\" rx=\"2\" stroke=\"#6B35B5\" stroke-width=\"1.4\"/> <path d=\"M7 7 L7 11 M9 6 L9 12 M11 8 L11 11\" stroke=\"#6B35B5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>", desc: "Self-hosted audiobook and podcast server. Stream from anywhere with the mobile app." },
      { slug: "paperless", name: "Paperless", category: "productivity", subcategory: "documents", icon: "orange", svg: "<path d=\"M4 3 L14 3 Q15 3 15 4 L15 14 Q15 15 14 15 L4 15 Q3 15 3 14 L3 4 Q3 3 4 3Z\" stroke=\"#A85C04\" stroke-width=\"1.4\"/> <path d=\"M6 7 L12 7 M6 10 L10 10\" stroke=\"#A85C04\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>", desc: "Scan, index, and archive all your documents. Full-text search with OCR — go paperless." },
      { slug: "stirling-pdf-lite", name: "Stirling PDF", category: "productivity", subcategory: "documents", icon: "red", svg: "<rect x=\"3\" y=\"2\" width=\"9\" height=\"12\" rx=\"1.5\" stroke=\"#A83535\" stroke-width=\"1.4\"/> <path d=\"M6 5 L9 5 M6 8 L9 8\" stroke=\"#A83535\" stroke-width=\"1.4\" stroke-linecap=\"round\"/> <path d=\"M11 10 L15 14 M13 10 L15 12\" stroke=\"#A83535\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>", desc: "Merge, split, compress, and edit PDFs. Lightweight toolkit — always on." },
      { slug: "stirling-pdf", name: "Stirling PDF (Full)", category: "productivity", subcategory: "documents", icon: "red", svg: "<rect x=\"3\" y=\"2\" width=\"9\" height=\"12\" rx=\"1.5\" stroke=\"#A83535\" stroke-width=\"1.4\"/> <path d=\"M6 5 L9 5 M6 8 L9 8\" stroke=\"#A83535\" stroke-width=\"1.4\" stroke-linecap=\"round\"/> <path d=\"M11 10 L15 14 M13 10 L15 12\" stroke=\"#A83535\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>", desc: "Full PDF toolkit with Word/Excel conversion via LibreOffice. Start manually on demand." },
      { slug: "guacamole", name: "Guacamole", category: "system", icon: "purple", svg: "<rect x=\"2\" y=\"3\" width=\"14\" height=\"9\" rx=\"1.5\" stroke=\"#6B35B5\" stroke-width=\"1.4\"/> <path d=\"M7 15 L11 15 M9 12 L9 15\" stroke=\"#6B35B5\" stroke-width=\"1.4\" stroke-linecap=\"round\"/> <path d=\"M6 7.5 L8 9.5 L12 5.5\" stroke=\"#6B35B5\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", desc: "Clientless remote desktop gateway — access VNC/RDP/SSH targets from any browser, on your LAN or over the internet." },
      { slug: "open-webui", name: "Open WebUI", category: "productivity", subcategory: "ai", icon: "pink", svg: "<path d=\"M3 4 h12 a1 1 0 0 1 1 1 v6 a1 1 0 0 1 -1 1 h-8 l-3 3 v-3 h-1 a1 1 0 0 1 -1 -1 v-6 a1 1 0 0 1 1 -1 Z\" stroke=\"#A5356B\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>", desc: "Chat interface for local LLMs served by Ollama." },
      { slug: "mealie", name: "Mealie", category: "productivity", subcategory: "home", icon: "pink", svg: "<path d=\"M9 2 L10.5 6.5 L15.5 6.5 L11.5 9.5 L13 14 L9 11 L5 14 L6.5 9.5 L2.5 6.5 L7.5 6.5 Z\" stroke=\"#A5356B\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/>", desc: "Recipe manager and meal planner. Save recipes, plan your week, and generate shopping lists." },
      { slug: "trilium", name: "Trilium Notes", category: "productivity", subcategory: "notes", icon: "blue", svg: "<path d=\"M9 2 L9 16 M9 2 L4 5 L4 11 L9 14 M9 2 L14 5 L14 11 L9 14\" stroke=\"#1565C0\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", desc: "Hierarchical, scriptable notes with attributes and relations. A personal wiki + database hybrid." },
