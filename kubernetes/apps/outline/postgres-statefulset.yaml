apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: outline-db
  namespace: apps
spec:
  serviceName: outline-db
  replicas: 0
  selector:
    matchLabels:
      app: outline-db
  template:
    metadata:
      labels:
        app: outline-db
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: outline
            - name: POSTGRES_USER
              value: outline
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-db-credentials
                  key: password
          args:
            - -c
            - shared_buffers=128MB
            - -c
            - max_connections=20
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - effective_cache_size=256MB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            limits:
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "outline"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: outline-db
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: outline-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline-redis
  namespace: apps
  labels:
    app: outline-redis
spec:
  replicas: 0
  selector:
    matchLabels:
      app: outline-redis
  template:
    metadata:
      labels:
        app: outline-redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:8.10-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: outline-redis
  namespace: apps
spec:
  selector:
    app: outline-redis
  ports:
    - port: 6379
