# Shared Traefik ForwardAuth Middleware — the first ForwardAuth <-> Authentik
# wiring in this pilot (previously a documented gap, see kubernetes/README.md's
# "Known architectural gaps"). Any HTTPRoute in the `apps` namespace can gate
# itself behind Authentik by adding this filter:
#
#   rules:
#     - filters:
#         - type: ExtensionRef
#           extensionRef:
#             group: traefik.io
#             kind: Middleware
#             name: authentik-forward-auth
#       backendRefs: [...]
#
# Lives in the `apps` namespace (not alongside Traefik/Gateway in `infra`)
# because Traefik's Gateway API ExtensionRef expects same-namespace targets
# by default — every HTTPRoute that will reference this also lives in
# `apps`, so this avoids needing a cross-namespace ReferenceGrant.
#
# Points at Authentik's *embedded* outpost — no separate outpost Deployment
# needed, authentik-server itself serves /outpost.goauthentik.io/auth/traefik
# once a Proxy Provider is configured. That configuration is Authentik-side
# state (a Provider + Application, created via its own UI/API after the
# cluster is live), not something git can express as a manifest — see
# kubernetes/README.md's "Current status" for the one-time setup steps.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: apps
spec:
  forwardAuth:
    address: http://authentik-server.apps.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
