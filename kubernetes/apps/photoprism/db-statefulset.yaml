# Own dedicated MariaDB, mirrors photoprism/compose.yml's photoprism-db.
# Env var names kept as MARIADB_* (not the MYSQL_* aliases used by the
# other MariaDB-backed services in this pilot) because that's exactly what
# photoprism/compose.yml itself sets — both work against the same image,
# no behavior difference, just matching the source file.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photoprism-db
  namespace: apps
spec:
  serviceName: photoprism-db
  replicas: 1
  selector:
    matchLabels:
      app: photoprism-db
  template:
    metadata:
      labels:
        app: photoprism-db
    spec:
      enableServiceLinks: false
      containers:
        - name: mariadb
          image: mariadb:12.3.2
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-db-credentials
                  key: root-password
            - name: MARIADB_DATABASE
              value: photoprism
            - name: MARIADB_USER
              value: photoprism
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-db-credentials
                  key: password
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
            - name: MARIADB_INITDB_SKIP_TZINFO
              value: "1"
          args:
            - --innodb-buffer-pool-size=256M
            - --max-connections=30
            - --transaction-isolation=READ-COMMITTED
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --innodb-rollback-on-timeout=OFF
            - --innodb-lock-wait-timeout=120
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 15
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: photoprism-db
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: photoprism-db
  ports:
    - port: 3306
