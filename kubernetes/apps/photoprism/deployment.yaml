# Mirrors photoprism/compose.yml. ORIGINALS_ROOT is a PVC populated with
# placeholder test data (kubectl cp), not a real host mount — same
# reasoning as jellyfin's media PVC and immich's upload PVC: kind's node
# containers have no host filesystem passthrough, and this pilot never
# touches real host data regardless.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-storage
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-originals-test
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism
  namespace: apps
  labels:
    app: photoprism
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: photoprism
  template:
    metadata:
      labels:
        app: photoprism
    spec:
      enableServiceLinks: false
      containers:
        - name: photoprism
          image: photoprism/photoprism:260728
          env:
            - name: PHOTOPRISM_DATABASE_DRIVER
              value: mysql
            - name: PHOTOPRISM_DATABASE_SERVER
              value: photoprism-db:3306
            - name: PHOTOPRISM_DATABASE_NAME
              value: photoprism
            - name: PHOTOPRISM_DATABASE_USER
              value: photoprism
            - name: PHOTOPRISM_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-db-credentials
                  key: password
            - name: PHOTOPRISM_SITE_URL
              value: https://photoprism.k8s.local/
            - name: PHOTOPRISM_ADMIN_USER
              value: admin
            - name: PHOTOPRISM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photoprism-credentials
                  key: admin-password
            - name: PHOTOPRISM_DISABLE_TENSORFLOW
              value: "false"
            - name: PHOTOPRISM_DETECT_NSFW
              value: "false"
            - name: PHOTOPRISM_UPLOAD_NSFW
              value: "true"
            - name: PHOTOPRISM_WORKERS
              value: "2"
          workingDir: /photoprism
          ports:
            - containerPort: 2342
          volumeMounts:
            - name: storage
              mountPath: /photoprism/storage
            - name: originals
              mountPath: /photoprism/originals
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 2342
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: 2342
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: photoprism-storage
        - name: originals
          persistentVolumeClaim:
            claimName: photoprism-originals-test
---
apiVersion: v1
kind: Service
metadata:
  name: photoprism
  namespace: apps
spec:
  selector:
    app: photoprism
  ports:
    - port: 2342
