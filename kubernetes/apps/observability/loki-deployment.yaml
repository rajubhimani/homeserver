apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: apps
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: apps
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      enableServiceLinks: false
      containers:
        - name: loki
          image: grafana/loki:3.7.4
          args:
            - -config.file=/etc/loki/loki-config.yml
          env:
            - name: LOKI_RETENTION
              value: "336h"
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki-config.yml
              subPath: loki-config.yml
            - name: data
              mountPath: /loki
          # No exec/httpGet probe here on purpose — grafana/loki is a fully
          # distroless image (no /bin/sh, wget, or curl inside it), so an exec
          # probe can't run and compose itself has no healthcheck for the same
          # reason (see observability/compose.yml's comment). A tcpSocket
          # probe is the only kind that works without a shell in the
          # container — it only checks the port accepts connections, not that
          # Loki's HTTP API is actually healthy, but that's the same fidelity
          # Compose has here (dependents use service_started, not
          # service_healthy).
          readinessProbe:
            tcpSocket:
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: apps
spec:
  selector:
    app: loki
  ports:
    - port: 3100
