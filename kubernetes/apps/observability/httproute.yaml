# Two public routes — Grafana and Prometheus both have their own
# docs/11-services-reference.md row (only these two; loki/alloy/cadvisor/
# node-exporter are internal-only, same as in compose, no route for them).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "grafana.k8s.local"
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "prometheus.k8s.local"
  rules:
    - backendRefs:
        - name: prometheus
          port: 9090
