# Direct LAN-reachable ports — see excalidraw/lan-service.yaml for the "why".
#
# Two ports, matching docs/11-services-reference.md's two public rows for
# this service: Grafana 8134 -> 3000, Prometheus 8135 -> 9090. The Compose
# version must be stopped (uv run homeserver.py dev down observability) to
# free these ports before applying.
apiVersion: v1
kind: Service
metadata:
  name: grafana-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 8134
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
    - port: 8135
      targetPort: 9090
