# GoTrue (Supabase Auth). Stateless — no volumes. GOTRUE_DB_DATABASE_URL is
# pre-composed in apply-secrets.sh (as supabase-db-credentials/auth-db-url),
# not built via in-manifest $(VAR) substitution across two secretKeyRefs —
# that pattern silently fails when the referenced var isn't defined earlier
# in the same env list, see kubernetes/TROUBLESHOOTING.md's immich-db entry
# and apply-secrets.sh's comment on the same lesson.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-auth
  namespace: apps
  labels:
    app: supabase-auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: supabase-auth
  template:
    metadata:
      labels:
        app: supabase-auth
    spec:
      enableServiceLinks: false
      containers:
        - name: auth
          image: supabase/gotrue:v2.189.0
          env:
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: GOTRUE_API_PORT
              value: "9999"
            - name: API_EXTERNAL_URL
              value: https://supabase.k8s.local
            - name: GOTRUE_DB_DRIVER
              value: postgres
            - name: GOTRUE_DB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db-credentials
                  key: auth-db-url
            - name: GOTRUE_SITE_URL
              value: https://supabase.k8s.local
            - name: GOTRUE_URI_ALLOW_LIST
              value: ""
            - name: GOTRUE_DISABLE_SIGNUP
              value: "false"
            - name: GOTRUE_JWT_ADMIN_ROLES
              value: service_role
            - name: GOTRUE_JWT_AUD
              value: authenticated
            - name: GOTRUE_JWT_DEFAULT_GROUP_NAME
              value: authenticated
            - name: GOTRUE_JWT_EXP
              value: "3600"
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supabase-credentials
                  key: jwt-secret
            - name: GOTRUE_JWT_ISSUER
              value: https://supabase.k8s.local
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              value: "true"
            - name: GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED
              value: "false"
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: "false"
            - name: GOTRUE_SMTP_ADMIN_EMAIL
              value: admin@k8s.local
            - name: GOTRUE_SMTP_HOST
              value: smtp.yourprovider.com
            - name: GOTRUE_SMTP_PORT
              value: "587"
            - name: GOTRUE_SMTP_USER
              value: ""
            - name: GOTRUE_SMTP_PASS
              value: ""
            - name: GOTRUE_SMTP_SENDER_NAME
              value: Supabase
            - name: GOTRUE_MAILER_URLPATHS_INVITE
              value: /auth/v1/verify
            - name: GOTRUE_MAILER_URLPATHS_CONFIRMATION
              value: /auth/v1/verify
            - name: GOTRUE_MAILER_URLPATHS_RECOVERY
              value: /auth/v1/verify
            - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
              value: /auth/v1/verify
            - name: GOTRUE_EXTERNAL_PHONE_ENABLED
              value: "true"
            - name: GOTRUE_SMS_AUTOCONFIRM
              value: "true"
          ports:
            - containerPort: 9999
          readinessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 9999
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-auth
  namespace: apps
spec:
  selector:
    app: supabase-auth
  ports:
    - port: 9999
