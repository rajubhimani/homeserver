# Routes to Kong (supabase-kong), the platform's API gateway/public
# entrypoint — confirmed by supabase/compose.dev.yml, which only maps a host
# port for supabase-kong (8133 -> 8000), nothing else in this service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: supabase
  namespace: apps
spec:
  parentRefs:
    - name: homeserver-gateway
      namespace: infra
  hostnames:
    - "supabase.k8s.local"
  rules:
    - backendRefs:
        - name: supabase-kong
          port: 8000
