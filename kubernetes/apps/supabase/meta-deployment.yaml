# Best-effort port — supporting service (Studio's Postgres introspection
# API), not one of this pilot's priority containers. Stateless, no volumes.
# No probes: compose defines no healthcheck for this container either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supabase-meta
  namespace: apps
  labels:
    app: supabase-meta
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: supabase-meta
  template:
    metadata:
      labels:
        app: supabase-meta
    spec:
      enableServiceLinks: false
      containers:
        - name: meta
          image: supabase/postgres-meta:v0.96.6
          env:
            - name: PG_META_PORT
              value: "8080"
            - name: PG_META_DB_HOST
              value: supabase-db
            - name: PG_META_DB_PORT
              value: "5432"
            - name: PG_META_DB_NAME
              value: postgres
            - name: PG_META_DB_USER
              value: postgres
            - name: PG_META_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supabase-db-credentials
                  key: password
            - name: CRYPTO_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-credentials
                  key: pg-meta-crypto-key
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: supabase-meta
  namespace: apps
spec:
  selector:
    app: supabase-meta
  ports:
    - port: 8080
