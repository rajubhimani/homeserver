# Direct LAN-reachable port — the "dev env" equivalent from the compose
# stack (ports exposed directly, no hostname routing needed) vs the
# HTTPRoute's "prod env" equivalent (hostname routing through Traefik).
# For local/LAN testing only, until AdGuard Home is set up as the network's
# DNS resolver to make hostname routing work from every device.
#
# Port 8138 matches temporal/compose.dev.yml exactly (temporal-ui's
# "8138:8080" mapping) — same number you already know, no new one to
# learn. Not running in Compose (k8s pilot only), so no port conflict.
apiVersion: v1
kind: Service
metadata:
  name: temporal-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: temporal-ui
  ports:
    - port: 8138
      targetPort: 8080
