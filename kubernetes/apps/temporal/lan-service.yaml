# Direct LAN-reachable port — the "dev env" equivalent from the compose
# stack (ports exposed directly, no hostname routing needed) vs the
# HTTPRoute's "prod env" equivalent (hostname routing through Traefik).
# For local/LAN testing only, until AdGuard Home is set up as the network's
# DNS resolver to make hostname routing work from every device.
#
# Port 8138 matches temporal/compose.dev.yml exactly (temporal-ui's
# "8138:8080" mapping) — same number you already know, no new one to
# learn. Not running in Compose (k8s pilot only), so no port conflict.
#
# SECURITY NOTE: this LoadBalancer Service routes directly to the pod,
# bypassing Traefik entirely — including the authentik-forward-auth
# Middleware now gating this service's HTTPRoute (see
# kubernetes/apps/authentik/forward-auth-middleware.yaml). Anyone who can
# reach this LoadBalancer IP skips the auth gate completely. Same
# LAN-only/local-testing tradeoff every lan-service.yaml in this pilot
# makes, just worth flagging explicitly here since this one is
# specifically meant to be gated.
apiVersion: v1
kind: Service
metadata:
  name: temporal-lan
  namespace: apps
spec:
  type: LoadBalancer
  selector:
    app: temporal-ui
  ports:
    - port: 8138
      targetPort: 8080
