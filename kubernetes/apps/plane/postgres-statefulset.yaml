# Mirrors plane/compose.yml's plane-db + plane-redis. Own dedicated
# Postgres, same reasoning as every other service in this pilot.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plane-db
  namespace: apps
spec:
  serviceName: plane-db
  replicas: 1
  selector:
    matchLabels:
      app: plane-db
  template:
    metadata:
      labels:
        app: plane-db
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: plane
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plane-db-credentials
                  key: password
            - name: POSTGRES_DB
              value: plane
          # compose's `command: postgres -c ...` overrides CMD only — args:
          # here (not command:), same ENTRYPOINT-preserving reasoning as
          # every other Postgres in this repo (see TROUBLESHOOTING.md).
          args:
            - -c
            - shared_buffers=128MB
            - -c
            - max_connections=50
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - effective_cache_size=384MB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "plane"]
            initialDelaySeconds: 10
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plane-db
  namespace: apps
spec:
  clusterIP: None
  selector:
    app: plane-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-redis
  namespace: apps
  labels:
    app: plane-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plane-redis
  template:
    metadata:
      labels:
        app: plane-redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: valkey/valkey:9.1-alpine
          args: ["valkey-server", "--save", "", "--stop-writes-on-bgsave-error", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: plane-redis
  namespace: apps
spec:
  selector:
    app: plane-redis
  ports:
    - port: 6379
