# Mirrors plane/compose.yml's plane-api, plane-worker, plane-beat,
# plane-web, plane-admin, plane-space. See migrator-job.yaml for the
# one-shot DB migration, proxy-deployment.yaml for the public entrypoint
# that fronts all of these.
#
# Compose's depends_on chain (all of these wait on plane-db/plane-redis/
# plane-mq healthy) has no direct k8s equivalent — same documented gap as
# migrator-job.yaml and elsewhere in kubernetes/TROUBLESHOOTING.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-api
  namespace: apps
  labels:
    app: plane-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plane-api
  template:
    metadata:
      labels:
        app: plane-api
    spec:
      enableServiceLinks: false
      containers:
        - name: plane-api
          image: makeplane/plane-backend:v1.4.0
          args: ["./bin/docker-entrypoint-api.sh"]
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plane-db-credentials
                  key: database-url
            - name: REDIS_URL
              value: redis://plane-redis:6379/
            - name: RABBITMQ_HOST
              value: plane-mq
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: plane-db-credentials
                  key: minio-root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-db-credentials
                  key: minio-root-password
            - name: AWS_S3_ENDPOINT_URL
              value: http://plane-minio:9000
            - name: AWS_S3_BUCKET_NAME
              value: uploads
            - name: WEB_URL
              value: https://plane.k8s.local
            - name: CORS_ALLOWED_ORIGINS
              value: https://plane.k8s.local
            - name: APP_BASE_URL
              value: https://plane.k8s.local
            - name: ADMIN_BASE_URL
              value: https://plane.k8s.local
            - name: SPACE_BASE_URL
              value: https://plane.k8s.local
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: plane-credentials
                  key: secret-key
            - name: GUNICORN_WORKERS
              value: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: plane-api
  namespace: apps
spec:
  selector:
    app: plane-api
  ports:
    - port: 8000
---
