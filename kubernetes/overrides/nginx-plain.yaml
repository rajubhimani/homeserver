# Traefik's Gateway + generated HTTPRoutes replace nginx-plain's routing.
# These server blocks serve content themselves, so each runs as a small
# Deployment of nginx-plain's image with its block from
# templates/default.conf.template (see generate.py nginx_plain()).
sites:
  browser-hub:
    host: browser.${DOMAIN}
    html: html/browser-hub

# Upstreams nginx-plain reaches by address (host-network containers): the
# container each address means, so their routes are generated too.
upstream_hosts:
  172.18.0.1: wg-easy
