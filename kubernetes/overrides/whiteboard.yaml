containers:
  whiteboard:
    # The image's own HEALTHCHECK (ghcr.io/nextcloud-releases/whiteboard:v2.0.0), verbatim; Kubernetes ignores
    # image healthchecks. tests/test_k8s_sync.py compares it with the image.
    image_healthcheck:
      test:
      - CMD-SHELL
      - 'node -e "require(''http'').get(''http://localhost:3002'', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"'
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
