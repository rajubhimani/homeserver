containers:
  paperless:
    # The image's own HEALTHCHECK (ghcr.io/paperless-ngx/paperless-ngx:3.2.1), verbatim (kubernetes/image_healthcheck.py);
    # Kubernetes ignores image healthchecks. tests/test_k8s_sync.py checks it.
    image_healthcheck:
      test:
      - CMD
      - curl
      - -fs
      - -S
      - -L
      - --max-time
      - '2'
      - http://localhost:8000
      interval: 30s
      timeout: 10s
      retries: 5
  paperless-redis:
    ports: [6379]   # valkey's default port; Compose never publishes it
