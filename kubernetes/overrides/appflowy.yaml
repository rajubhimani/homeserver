containers:
  appflowy-cloud:
    ports: [8000]   # its own healthcheck and AppFlowy's nginx.conf use 8000; Compose never publishes it
  appflowy-db:
    ports: [5432]   # Postgres (pgvector's own image: a plain workload, not CNPG)
  appflowy-redis:
    ports: [6379]   # valkey's default port; Compose never publishes it
  appflowy-minio:
    ports: [9000]   # MinIO's S3 API (S3_ENDPOINT); Compose never publishes it
