containers:
  vaultwarden:
    # The image's own HEALTHCHECK (vaultwarden/server:1.37.3), verbatim; Kubernetes ignores
    # image healthchecks. tests/test_k8s_sync.py compares it with the image.
    image_healthcheck:
      test:
      - CMD
      - /healthcheck.sh
      interval: 60s
      timeout: 10s
