containers:
  open-webui:
    mounts:
      # Model cache (MODELS_ROOT, re-downloadable): own volume on the HDD.
      /app/backend/data/cache: {volume: cache, size: 20Gi, class: bulk}
  open-terminal:
    mounts:
      # Home directory (TERMINAL_HOME_ROOT: scratch workspace + pip/npm installs, re-creatable): own volume on the HDD.
      /home/user: {volume: terminal-home, size: 20Gi, class: bulk}
