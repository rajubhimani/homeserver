# Two storage classes mirroring the host disk layout (the host-disk-layout
# rule: databases stay on the SSD). Both use the local-path provisioner kind
# ships; nodePath picks the folder, pathPattern keeps folder names readable
# (<namespace>/<pvc-name>/) for inspection and backups.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast
provisioner: rancher.io/local-path
parameters:
  nodePath: /var/k8s/fast
  pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bulk
provisioner: rancher.io/local-path
parameters:
  nodePath: /var/k8s/bulk
  pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}/"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# Host folders services read or write in place (Jellyfin's library, Immich's
# photos, Nextcloud's OS images): static local PersistentVolumes generated per
# service, never provisioned or deleted by Kubernetes
# (kubernetes.io/docs/concepts/storage/volumes/#local).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: host
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
