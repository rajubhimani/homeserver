apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: infra   # Traefik (Gateway API) and other cluster-wide infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: data    # shared Postgres and any other shared datastores
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps    # application workloads — one shared namespace, mirrors the
                # compose stack's single "homeserver" network (flat, not
                # segmented per service)
  labels:
    # Pod Security Standards (kubernetes.io/docs/concepts/security/
    # pod-security-standards): warn on anything that breaks Baseline, record
    # Restricted violations in the audit log. Not enforced yet: Baseline's
    # remaining exceptions are the localhost hostPorts, the host media
    # folders (hostPath) and Beszel's agent (host network); docs/17
    # "Pod Security Standards".
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
