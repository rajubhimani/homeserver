# Traefik as the Gateway API implementation for this cluster — the k8s
# equivalent of nginx-plain's per-service server_name blocks (host-based
# routing to many backends behind one entry point). ingress-nginx is
# deprecated (no releases/security fixes since March 2026), so Gateway API
# + Traefik is the current recommended path, not classic Ingress objects.
providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false   # Gateway API only — no legacy Ingress objects in this cluster
  # Explicit, not just relying on the chart default (true): this is what
  # makes the `Middleware` CRD work (traefik.io/v1alpha1) — every
  # authentik-forward-auth ExtensionRef on a Gateway API HTTPRoute (see
  # kubernetes/apps/authentik/forward-auth-middleware.yaml) depends on this
  # provider being on. Silently relying on a chart default that happens to
  # match is exactly the kind of thing that breaks on a future chart
  # upgrade without anyone noticing why.
  kubernetesCRD:
    enabled: true

# The chart creates the Gateway itself (its documented way); the generated
# HTTPRoutes attach to it by name from the apps namespace, so routes from
# every namespace are allowed (the chart's default is its own namespace only).
gateway:
  enabled: true
  name: homeserver-gateway
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All

# Chart 41.3.0's own appVersion default already matches this — pinned
# explicitly anyway, not left to the chart default, so a future chart bump
# never silently changes the running Traefik version without a deliberate
# edit here. v3.7.10+ is also the version this cluster's Gateway API CRDs
# (v1.6.1) were verified against — see kubernetes/TROUBLESHOOTING.md's
# Gateway API section.


# The image comes from the chart (41.6.1 ships Traefik v3.7.13, its tested
# version); the chart version is pinned in kubernetes/versions.env.

# kind maps these NodePorts to 127.0.0.1:${K8S_HTTP_PORT}/${K8S_HTTPS_PORT} on the host.
service:
  spec:
    type: NodePort   # chart 41.x: the Service type lives under service.spec
ports:
  web:
    nodePort: 30080
    # Requests from the tunnel arrive through the edge nginx (Service
    # nginx-plain), which sets X-Real-IP, X-Forwarded-For and
    # X-Forwarded-Proto from Cloudflare's headers. Traefik keeps X-Forwarded-*
    # and X-Real-Ip only from listed sources (forwardedHeaders.trustedIPs), so
    # trust the pod network (kind's default podSubnet). docs/17 "Real client IPs".
    forwardedHeaders:
      trustedIPs: ["10.244.0.0/16"]
  websecure:
    nodePort: 30443
