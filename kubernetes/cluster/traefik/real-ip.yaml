# Real client IPs behind the Cloudflare tunnel. Traefik fills X-Real-Ip with
# whoever connected to it, which here is always the cloudflared pod, and
# Cloudflare doesn't let a Transform Rule set it. Apps that prefer X-Real-IP
# (Forgejo's proxy middleware reads it before X-Forwarded-For) would log the
# tunnel pod. Removing it (Traefik's Headers middleware: an empty value
# removes the header) makes them use X-Forwarded-For, which Traefik keeps
# correct: the visitor first, then the trusted proxies. Attached to every
# router on both entrypoints in values.yaml (entryPoints.<ep>.http.middlewares).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-x-real-ip
  namespace: infra
spec:
  headers:
    customRequestHeaders:
      X-Real-Ip: ""
