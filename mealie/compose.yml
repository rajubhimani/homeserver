services:
  mealie-db:
    image: postgres:18.4
    container_name: mealie-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - mealie-postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - homeserver

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.20.1
    container_name: mealie
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_SERVER: mealie-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BASE_URL: https://mealie.${DOMAIN}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    volumes:
      - ${DATA_ROOT}/data:/app/data
    depends_on:
      mealie-db:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  mealie-postgres:

networks:
  homeserver:
    external: true
