name: nextcloud35

# Throwaway Nextcloud 35 sandbox cloned from the live `services/nextcloud`
# (34.x) instance — see README.md. Not managed by homeserver.py, not on the
# shared `homeserver` network: its own isolated network means it physically
# cannot reach the real nextcloud-db / nextcloud-redis even if a config
# value were left pointing at them.

services:
  nextcloud35-db:
    image: postgres:18.6-alpine
    container_name: nextcloud35-db
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=50 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=384MB
    volumes:
      - nextcloud35-postgres:/var/lib/postgresql
      - ../../services/nextcloud/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nextcloud35

  nextcloud35-redis:
    image: redis:8.10.2-alpine
    container_name: nextcloud35-redis
    restart: "no"
    command: redis-server --save "" --stop-writes-on-bgsave-error no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nextcloud35

  nextcloud35:
    image: nextcloud:${NEXTCLOUD35_IMAGE:-35.0.1}
    container_name: nextcloud35
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST: nextcloud35-db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: nextcloud35-redis
      REDIS_HOST_PORT: 6379
    ports:
      - "127.0.0.1:8095:80"
      - "10.8.0.1:8095:80"
    volumes:
      - nextcloud35-html:/var/www/html
      - nextcloud35-config:/var/www/html/config
      - nextcloud35-data:/var/www/html/data
      - nextcloud35-custom-apps:/var/www/html/custom_apps
      - ./hooks/before-starting:/docker-entrypoint-hooks.d/before-starting:ro
      # Same external-storage mount as the real instance, but read-only here
      # so nothing the sandbox does can touch the files on disk.
      - ${OS_ISO_ROOT}:/mnt/os-iso:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    depends_on:
      nextcloud35-db:
        condition: service_healthy
      nextcloud35-redis:
        condition: service_healthy
    networks:
      - nextcloud35

  # No cron container on purpose: background jobs never run in the sandbox,
  # so the Mail app doesn't sync real mailboxes and no notifications go out.

volumes:
  nextcloud35-postgres:
  nextcloud35-html:
  nextcloud35-config:
  nextcloud35-data:
  nextcloud35-custom-apps:

networks:
  nextcloud35:
    name: nextcloud35
