# GitHub secret scanning: paths it skips (alerts and push protection).
#
# services/*/upstream*: word-for-word copies of a project's own compose/.env
# example files, kept to diff against when re-syncing versions (e.g.
# docs/services/supabase.md). They hold upstream's demo placeholders, such as
# Supabase's "whsec_..." hook secret, which decodes to "This is an example of a
# shorter Base64 string". Editing them would break the diff, so skip them here.
# Our real secrets are only ever in gitignored .env files.
paths-ignore:
  - "services/*/upstream*"
