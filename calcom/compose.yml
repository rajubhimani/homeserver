services:
  calcom-db:
    image: postgres:18.4-alpine
    container_name: calcom-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - calcom-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  calcom:
    image: calcom/cal.com:v6.2.0
    container_name: calcom
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_WEBAPP_URL: https://calcom.${DOMAIN}
      NEXTAUTH_URL: https://calcom.${DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/auth/login"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      calcom-db:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  calcom-postgres:

networks:
  homeserver:
    external: true
