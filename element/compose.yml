services:
  element:
    image: vectorim/element-web:v1.12.23
    container_name: element
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./config.json:/app/config.json:ro
      - ./docker-entrypoint.d/19-set-homeserver.sh:/docker-entrypoint.d/19-set-homeserver.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/config.json || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
