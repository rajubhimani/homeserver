server {
    listen 80;

    # Use Podman's internal DNS — differs from Docker's 127.0.0.11
    resolver 10.89.0.1 valid=10s;

    # Applied to all proxy (health check) locations that don't override add_header.
    # Prevents browsers from caching health check responses — a stale 200 would
    # show a stopped service as online. location / has its own add_header directives
    # so it does NOT inherit these; static HTML caching is controlled there.
    proxy_hide_header Content-Type;
    add_header Content-Type "text/plain" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location /health/immich {
        set $upstream http://immich-server:2283;
        proxy_pass $upstream/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /health/nextcloud {
        set $upstream http://nextcloud:80;
        proxy_pass $upstream/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

