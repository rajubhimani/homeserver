services:
  openproject:
    image: openproject/openproject:17.5.1
    container_name: openproject
    restart: unless-stopped
    env_file: .env
    environment:
      OPENPROJECT_HOST__NAME: openproject.${DOMAIN}
      OPENPROJECT_HTTPS: "true"
      OPENPROJECT_DEFAULT__LANGUAGE: en
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # 0=disabled, 2=email activation, 3=manual admin, 4=automatic
      OPENPROJECT_SELF__REGISTRATION: ${SELF_REGISTRATION:-2}
    volumes:
      - openproject-pgdata:/var/openproject/pgdata
      - ${DATA_ROOT}/assets:/var/openproject/assets
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health_checks/default || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - homeserver

volumes:
  openproject-pgdata:

networks:
  homeserver:
    external: true
