# Database lives on the shared Postgres server (services/shared-postgres),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-postgres.md.
services:
  # gRPC server exposing your pipeline code to both dagster-webserver and
  # dagster-daemon. DAGSTER_CURRENT_IMAGE tells the run launcher which image
  # to use when it launches a run as its own new container — must match
  # this service's own `image:` tag below.
  dagster-user-code:
    build: ./user-code
    image: homeserver/dagster-user-code:1.13.25
    container_name: dagster-user-code
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      DAGSTER_CURRENT_IMAGE: homeserver/dagster-user-code:1.13.25
    deploy:
      resources:
        limits:
          memory: 256M
    # definitions.py is built into the image (user-code/Dockerfile).
    # Sensor/asset code (marker_file_sensor, the io_manager base_dir) also
    # runs here via gRPC, not in dagster-daemon — needs the same shared
    # storage mount or marker_file_sensor can never see the file
    # dagster-daemon (or you) creates.
    volumes:
      - dagster-io-manager-storage:/tmp/io_manager_storage
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - homeserver

  dagster-webserver:
    build: ./webserver-daemon
    image: homeserver/dagster:1.13.25-dbhost
    container_name: dagster-webserver
    restart: unless-stopped
    init: true
    entrypoint: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    env_file: .env
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 512M
    # Docker client access so the webserver can launch/terminate run
    # containers (DockerRunLauncher) — see dagster.yaml's container_kwargs
    # for the per-run resource caps this mount enables.
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - dagster-io-manager-storage:/tmp/io_manager_storage
    healthcheck:
      # python:3.13-slim has no curl — use urllib instead of adding a package.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      dagster-user-code:
        condition: service_started
    networks:
      - homeserver

  # Runs scheduled/sensor-triggered jobs and dequeues runs the webserver
  # submitted to QueuedRunCoordinator.
  dagster-daemon:
    build: ./webserver-daemon
    image: homeserver/dagster:1.13.25-dbhost
    container_name: dagster-daemon
    restart: unless-stopped
    init: true
    entrypoint: ["dagster-daemon", "run"]
    env_file: .env
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - dagster-io-manager-storage:/tmp/io_manager_storage
    depends_on:
      dagster-user-code:
        condition: service_started
    # Fails if the daemon stops writing heartbeats.
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      # liveness-check reads heartbeats from Postgres and is slow; 120s/60s/2
      # is the commonly used setting (60s/20s timed out under load).
      interval: 120s
      timeout: 60s
      retries: 2
      start_period: 60s
    networks:
      - homeserver

volumes:
  dagster-io-manager-storage:

networks:
  homeserver:
    external: true
