services:
  atuin-db:
    image: postgres:18.6-alpine
    container_name: atuin-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - atuin-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # Same pattern as firefly-permissions/mattermost-permissions/etc. --
  # atuin's image runs as a hardcoded "atuin" user (uid 1000, gid 1000,
  # confirmed via /etc/passwd inside the container) with no root fallback,
  # so it can never self-heal config/ if recreated root-owned. Note: the
  # actual synced shell history lives in the atuin-db named Postgres
  # volume, not here -- this only covers server.toml, so the stakes of
  # getting this wrong are low (config regenerates), but fixed anyway for
  # consistency with the rest of this stack's now-established convention.
  atuin-permissions:
    image: alpine:3.24.1
    container_name: atuin-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}/config:/atuin-config
    command: sh -c "mkdir -p /atuin-config && chown -R 1000:1000 /atuin-config"

  atuin:
    image: ghcr.io/atuinsh/atuin:18.21.0
    container_name: atuin
    restart: unless-stopped
    command: start
    env_file: .env
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@atuin-db/${POSTGRES_DB}
    volumes:
      - ${DATA_ROOT}/config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      atuin-db:
        condition: service_healthy
      atuin-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

volumes:
  atuin-postgres-alpine:

networks:
  homeserver:
    external: true
