services:
  atuin-db:
    image: postgres:18.4-alpine
    container_name: atuin-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - atuin-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  atuin:
    image: ghcr.io/atuinsh/atuin:18.18.1
    container_name: atuin
    restart: unless-stopped
    command: start
    env_file: .env
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_DB_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@atuin-db/${POSTGRES_DB}
    volumes:
      - ${DATA_ROOT}/config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      atuin-db:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  atuin-postgres-alpine:

networks:
  homeserver:
    external: true
