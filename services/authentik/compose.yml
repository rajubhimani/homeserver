services:
  authentik-db:
    image: postgres:18.6
    container_name: authentik-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - authentik-postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # Same pattern as firefly-permissions/mattermost-permissions/etc. --
  # authentik's server/worker images run as a hardcoded uid 1000 (confirmed
  # via `docker inspect ghcr.io/goauthentik/server:2026.8.0 --format
  # '{{.Config.User}}'` -> "1000") with no root fallback, so neither can
  # self-heal media/templates/certs if recreated root-owned. Currently safe
  # only because these three directories already carry a permissive 777
  # (world-writable) mode from an earlier manual/setup step -- this fix
  # makes that no longer load-bearing, so a future full top-level wipe
  # (not just a contents wipe, which preserves the existing 777 dir itself)
  # can't silently break authentication for the whole stack.
  authentik-permissions:
    image: alpine:3.24.1
    container_name: authentik-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}:/authentik-data
    command: sh -c "mkdir -p /authentik-data/media /authentik-data/templates /authentik-data/certs && chown -R 1000:1000 /authentik-data/media /authentik-data/templates /authentik-data/certs"

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.0
    container_name: authentik-server
    restart: unless-stopped
    command: server
    env_file: .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ${DATA_ROOT}/media:/media
      - ${DATA_ROOT}/templates:/templates
    healthcheck:
      test: ["CMD-SHELL", "ak healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.0
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    env_file: .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DATA_ROOT}/media:/media
      - ${DATA_ROOT}/templates:/templates
      - ${DATA_ROOT}/certs:/certs
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

volumes:
  authentik-postgres:

networks:
  homeserver:
    external: true
