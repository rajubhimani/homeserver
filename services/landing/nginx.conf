    }

    location /health/browser {
        # Represents the hub picker page itself (services.json slug
        # "browser") — probes nginx-plain's own internal /_health (same
        # endpoint its Docker healthcheck uses), since the hub is a static
        # page nginx-plain serves directly, not a container of its own. Each
        # individual browser has its own /health/<slug> route below with its
        # own real status, now that they each have their own landing card.
        set $upstream http://nginx-plainUPSTREAM_SUFFIX_PLACEHOLDER:80;
        proxy_pass $upstream/_health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /health/firefox {
        # 401 (basic-auth gate) still counts as "up" in the landing page's
        # pingHealth() JS (any status < 500). Must hide WWW-Authenticate,
        # though — a same-origin fetch() response carrying that header makes
        # the browser pop its native login dialog on landing-page load, same
        # bug as the Supabase health route (see that block's comment above).
        set $upstream http://firefoxUPSTREAM_SUFFIX_PLACEHOLDER:3000;
        proxy_pass $upstream/;
        proxy_hide_header WWW-Authenticate;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /health/chromium {
        set $upstream http://chromiumUPSTREAM_SUFFIX_PLACEHOLDER:3000;
