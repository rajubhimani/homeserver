        # WWW-Authenticate: Basic there pops a native browser credential dialog
        # on every page load. /rest/v1/'s key-auth plugin 401s with
        # WWW-Authenticate: Key instead, a scheme browsers don't intercept.
        set $upstream http://supabase-kongUPSTREAM_SUFFIX_PLACEHOLDER:8000;
        proxy_pass $upstream/rest/v1/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
