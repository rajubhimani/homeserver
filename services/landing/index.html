<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITE_NAME_PLACEHOLDER</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pt-accent: #1D9E75;
      --pt-accent-dark: #0F6E56;
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6b6b;
      --text-tertiary: #9b9b9b;
      --border: rgba(0,0,0,0.10);
      --border-hover: rgba(0,0,0,0.22);
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.10);
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1e1e1e;
        --bg-secondary: #161616;
        --text-primary: #f0f0f0;
        --text-secondary: #a0a0a0;
        --text-tertiary: #505050;
        --border: rgba(255,255,255,0.10);
        --border-hover: rgba(255,255,255,0.22);
        --shadow: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-hover: 0 4px 16px rgba(0,0,0,0.4);
        --pt-accent: #2bc492;
        --pt-accent-dark: #1D9E75;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg-secondary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Header ────────────────────────────────────────────────────── */
    .header {
      text-align: center;
      padding: 2.5rem 0 2rem;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 2.5rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.75rem;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: var(--pt-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg { width: 22px; height: 22px; }

    .logo-name {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.4px;
    }

    .logo-name span { color: var(--pt-accent); }

    .tagline {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ── Tab bar ───────────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 2px;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0.5rem 1.125rem 0.625rem;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      font-family: var(--font);
    }

    .tab-btn:hover { color: var(--text-primary); }

    .tab-btn.active {
      color: var(--text-primary);
      border-bottom-color: var(--pt-accent);
    }

    .tab-count {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 20px;
      background: var(--border);
      color: var(--text-secondary);
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn.active[data-tab="online"]  .tab-count { background: var(--pt-accent); color: #fff; }
    .tab-btn.active[data-tab="offline"] .tab-count { background: #c0392b; color: #fff; }

    /* ── Status groups (Online / Offline) ──────────────────────────── */
    .status-group { margin-bottom: 3rem; }

    .sg-dot { display: none; }

    /* ── Category sections (within each status group) ──────────────── */
    .category { margin-bottom: 2rem; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.875rem;
    }

    /* ── Subgroups (within a category) ──────────────────────────────── */
    .subgroup { margin-bottom: 1.25rem; }
    .subgroup:last-child { margin-bottom: 0; }

    .subgroup-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 0.625rem;
    }

    /* ── Responsive grid ───────────────────────────────────────────── */
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      body { padding: 2rem 2rem; }
    }

    @media (min-width: 1100px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
      body { padding: 2.5rem 3rem; }
    }

    @media (min-width: 1400px) {
      .grid { grid-template-columns: repeat(5, 1fr); }
    }

    /* ── Cards ─────────────────────────────────────────────────────── */
    .card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.125rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      text-decoration: none;
      cursor: default;
    }

    .card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
    }

    .card-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-icon.teal   { background: #E1F5EE; }
    .card-icon.blue   { background: #E6F1FB; }
    .card-icon.purple { background: #EEE6FB; }
    .card-icon.orange { background: #FBF1E6; }
    .card-icon.red    { background: #FBE6E6; }
    .card-icon.pink   { background: #FBE6F3; }
    .card-icon.gray   { background: #EBEBEB; }
    .card-icon.yellow { background: #FBF8E6; }
    .card-icon.green  { background: #E8F5E9; }

    @media (prefers-color-scheme: dark) {
      .card-icon.teal   { background: #04342C; }
      .card-icon.blue   { background: #042C53; }
      .card-icon.purple { background: #2C0453; }
      .card-icon.orange { background: #532C04; }
      .card-icon.red    { background: #530404; }
      .card-icon.pink   { background: #530432; }
      .card-icon.gray   { background: #333333; }
      .card-icon.yellow { background: #3D3804; }
      .card-icon.green  { background: #0A2E0C; }
    }

    .card-icon svg { width: 18px; height: 18px; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Status badge ──────────────────────────────────────────────── */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.3s, color 0.3s;
    }

    .status.checking { color: #888; background: #ebebeb; }
    .status.online   { color: var(--pt-accent-dark); background: #E1F5EE; }
    .status.offline  { color: #c0392b; background: #FBE6E6; }

    @media (prefers-color-scheme: dark) {
      .status.checking { color: #666; background: #2a2a2a; }
      .status.online   { background: #04342C; color: #2bc492; }
      .status.offline  { background: #530404; color: #e57373; }
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status.checking .status-dot { background: #999; }
    .status.online   .status-dot { background: var(--pt-accent); }
    .status.offline  .status-dot { background: #c0392b; }

    /* ── Card body ─────────────────────────────────────────────────── */
    .card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      flex: 1;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--pt-accent);
      font-weight: 500;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-link svg { width: 11px; height: 11px; flex-shrink: 0; }

    .card-link-secondary {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 500;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-link-secondary:hover { color: var(--pt-accent); }

    .test-badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.03em;
      background: var(--pt-accent);
      color: #fff;
      opacity: 0.75;
      flex-shrink: 0;
    }

    .test-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      background: #999;
      transition: background 0.3s;
    }

    .test-dot.online  { background: var(--pt-accent); }
    .test-dot.offline { background: #c0392b; }

    /* ── Footer ────────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 1.5rem 0 0.5rem;
      border-top: 0.5px solid var(--border);
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="3" fill="white"/>
            <path d="M10 2 L10 5 M10 15 L10 18 M2 10 L5 10 M15 10 L18 10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M4.9 4.9 L7 7 M13 13 L15.1 15.1 M15.1 4.9 L13 7 M7 13 L4.9 15.1" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-name">SITE_NAME_PLACEHOLDER</span>
      </div>
      <p class="tagline">TAGLINE_PLACEHOLDER</p>
    </div>

    <!-- ── Tab bar ────────────────────────────────────────────────── -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="online" onclick="switchTab('online')">
        Online <span class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-tab="offline" onclick="switchTab('offline')">
        Offline <span class="tab-count">0</span>
      </button>
    </div>

    <!-- ── Online section ─────────────────────────────────────────── -->
    <div id="section-online" class="status-group" style="display:none">
      <div class="status-group-label online-label">
        <span class="sg-dot"></span>Online
      </div>
      <div class="category" data-cat="storage" style="display:none">
        <p class="section-label">Storage &amp; Media</p>
        <div class="grid"></div>
      </div>
      <div class="category" data-cat="productivity" style="display:none">
        <p class="section-label">Productivity</p>
      </div>
      <div class="category" data-cat="dev" style="display:none">
        <p class="section-label">Dev &amp; Security</p>
      </div>
      <div class="category" data-cat="system" style="display:none">
        <p class="section-label">System</p>
        <div class="grid"></div>
      </div>
    </div>

    <!-- ── Offline section ────────────────────────────────────────── -->
    <div id="section-offline" class="status-group" style="display:none">
      <div class="status-group-label offline-label">
        <span class="sg-dot"></span>Offline
      </div>
      <div class="category" data-cat="storage" style="display:none">
        <p class="section-label">Storage &amp; Media</p>
        <div class="grid"></div>
      </div>
      <div class="category" data-cat="productivity" style="display:none">
        <p class="section-label">Productivity</p>
      </div>
      <div class="category" data-cat="dev" style="display:none">
        <p class="section-label">Dev &amp; Security</p>
      </div>
      <div class="category" data-cat="system" style="display:none">
        <p class="section-label">System</p>
        <div class="grid"></div>
      </div>
    </div>

    <!-- ── Card pool (hidden — JS places cards into sections) ──────── -->
    <div id="card-pool" style="display:none"></div><!-- /card-pool -->

    <div class="footer">
      Built and maintained by AUTHOR_PLACEHOLDER · LOCATION_PLACEHOLDER · YEAR_PLACEHOLDER
    </div>
  </div>

  <script>
    const DOMAIN = 'DOMAIN_PLACEHOLDER';

    // Service + tier + grouping data lives in one place: services.json at
    // the repo root (bind-mounted in) -- see the homeserver-add-service
    // skill. Populated by loadServiceData() before renderCards() runs.
    let SERVICES = [];
    let SUBCATEGORY_LABELS = {};

    async function loadServiceData() {
      const res = await fetch('services.json', { cache: 'no-store' });
      const data = await res.json();
      // Only entries with a category get a card -- tier-only infra entries
      // (cloudflared, nginx-plain, landing itself, crowdsec, ollama) are
      // deliberately invisible here, same as before this was data-driven.
      SERVICES = data.services.filter(s => s.category);
      SUBCATEGORY_LABELS = data.subcategoryLabels || {};
    }

    const EXTERNAL_LINK_SVG = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 10 L10 2 M5 2 L10 2 L10 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    // Build one card element from a SERVICES entry, with its public link
    // already pointed at the right subdomain.
    function buildCard(s) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.service = s.slug;
      card.dataset.category = s.category;
      if (s.subcategory) card.dataset.subcategory = s.subcategory;

      const sub = s.sub || s.slug;
      const url = `https://${sub}.${DOMAIN}`;
      const label = `${sub}.${DOMAIN}`;

      let secondaryLink = '';
      if (s.testSub) {
        secondaryLink = `
        <a class="card-link-secondary" href="https://${s.testSub}.${DOMAIN}" data-testsub="${s.testSub}" data-testhealth="${s.testHealth || s.testSub}" target="_blank">
          <span class="test-badge">TEST</span><span class="test-dot"></span> ${s.testLabel || ''}
        </a>`;
      }

      card.innerHTML = `
        <div class="card-icon ${s.icon}">
          <svg viewBox="0 0 18 18" fill="none">${s.svg}</svg>
        </div>
        <div class="card-header">
          <span class="card-name">${s.name}</span>
          <span class="status checking"><span class="status-dot"></span><span class="status-text">checking</span></span>
        </div>
        <p class="card-desc">${s.desc}</p>
        <a class="card-link" href="${url}" target="_blank">${label}${EXTERNAL_LINK_SVG}</a>${secondaryLink}`;
      return card;
    }

    function renderCards() {
      const pool = document.getElementById('card-pool');
      SERVICES.forEach(s => pool.appendChild(buildCard(s)));
    }

    let activeTab = 'online';

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      applyTabVisibility();
    }

    function applyTabVisibility() {
      ['online', 'offline'].forEach(t => {
        const s = document.getElementById(`section-${t}`);
        const hasCards = s.querySelectorAll('.grid .card').length > 0;
        s.style.display = (t === activeTab && hasCards) ? '' : 'none';
      });
    }

    // Place a card into the correct online/offline section under its category
    // (and subgroup, if it has one -- categories without subgroups fall back
    // to a single direct grid, same as before subgroups existed).
    function placeCard(card, isOnline) {
      const cat = card.dataset.category;
      const subcat = card.dataset.subcategory;
      const sectionId = isOnline ? 'section-online' : 'section-offline';
      const section = document.getElementById(sectionId);
      const catDiv = section.querySelector(`[data-cat="${cat}"]`);

      let grid;
      if (subcat) {
        let subgroup = catDiv.querySelector(`.subgroup[data-subcat="${subcat}"]`);
        if (!subgroup) {
          subgroup = document.createElement('div');
          subgroup.className = 'subgroup';
          subgroup.dataset.subcat = subcat;
          const label = document.createElement('p');
          label.className = 'subgroup-label';
          label.textContent = SUBCATEGORY_LABELS[subcat] || subcat;
          grid = document.createElement('div');
          grid.className = 'grid';
          subgroup.append(label, grid);
          catDiv.appendChild(subgroup);
        } else {
          grid = subgroup.querySelector('.grid');
        }
      } else {
        grid = catDiv.querySelector(':scope > .grid');
        if (!grid) {
          grid = document.createElement('div');
          grid.className = 'grid';
          catDiv.appendChild(grid);
        }
      }
      grid.appendChild(card);
      updateVisibility();
    }

    // Show/hide category/subgroup groups, update tab counts, apply active tab
    function updateVisibility() {
      ['online', 'offline'].forEach(t => {
        const section = document.getElementById(`section-${t}`);
        let count = 0;
        section.querySelectorAll('.category').forEach(cat => {
          let n = 0;
          cat.querySelectorAll('.grid').forEach(g => { n += g.children.length; });
          cat.style.display = n > 0 ? '' : 'none';
          cat.querySelectorAll('.subgroup').forEach(sg => {
            sg.style.display = sg.querySelector('.grid').children.length > 0 ? '' : 'none';
          });
          count += n;
        });
        document.querySelector(`.tab-btn[data-tab="${t}"] .tab-count`).textContent = count;
      });
      applyTabVisibility();
    }

    async function pingHealth(service) {
      try {
        const res = await fetch(`/health/${service}`, { signal: AbortSignal.timeout(6000), redirect: 'manual', cache: 'no-store' });
        return res.status === 0 || (res.status >= 200 && res.status < 500);
      } catch {
        return false;
      }
    }

    async function checkService(card) {
      const service = card.dataset.service;
      const badge = card.querySelector('.status');
      const text  = badge.querySelector('.status-text');
      // Any card can carry one or more secondary "test instance" links --
      // set testSub (and optionally testHealth/testLabel) on its SERVICES
      // entry and it's automatically OR'd into the main status (online if
      // the main instance OR any test instance is up).
      const testLinks = Array.from(card.querySelectorAll('.card-link-secondary[data-testsub]'));

      const [mainUp, testResults] = await Promise.all([
        pingHealth(service),
        Promise.all(testLinks.map(link => pingHealth(link.dataset.testhealth || link.dataset.testsub))),
      ]);

      testLinks.forEach((link, i) => {
        const dot = link.querySelector('.test-dot');
        if (dot) dot.className = `test-dot ${testResults[i] ? 'online' : 'offline'}`;
      });

      const up = mainUp || testResults.some(Boolean);

      badge.className = `status ${up ? 'online' : 'offline'}`;
      text.textContent = up ? 'online' : 'offline';
      placeCard(card, up);
    }

    // On re-check, move cards back to pool first so they can be re-sorted
    function recheckAll() {
      const pool = document.getElementById('card-pool');
      document.querySelectorAll('.card[data-service]').forEach(card => {
        pool.appendChild(card);
      });
      updateVisibility();
      document.querySelectorAll('#card-pool .card[data-service]').forEach(checkService);
    }

    (async () => {
      await loadServiceData();
      renderCards();
      // Initial check: pull all cards from pool and check each one
      document.querySelectorAll('#card-pool .card[data-service]').forEach(checkService);
      setInterval(recheckAll, 30000);
    })();
  </script>
</body>
</html>
