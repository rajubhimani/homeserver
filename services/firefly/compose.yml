services:
  firefly-db:
    image: postgres:18.6-alpine
    container_name: firefly-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - firefly-postgres-alpine:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks:
      - homeserver

  firefly-permissions:
    image: alpine:3.24.2
    container_name: firefly-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}/storage:/var/www/html/storage
    # www-data UID/GID is 33 in Debian-based images (used by fireflyiii/core)
    command: chown -R 33:33 /var/www/html/storage

  firefly:
    image: fireflyiii/core:version-6.7.6
    container_name: firefly
    restart: unless-stopped
    user: "0:0"
    env_file: .env
    environment:
      APP_URL: https://firefly.${DOMAIN}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Pinned here rather than in the shared .env — firefly-importer and firefly-cron
      # also load .env via env_file, and their own upstream defaults for these differ
      # (importer defaults to APP_ENV=local, MAIL_MAILER=empty)
      APP_ENV: production
      # Points at Mailpit (services/mailpit/, container "mailpit") — this
      # stack's SMTP test-catcher, no real mail delivery.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: firefly@example.com
      TRUSTED_PROXIES: "**"
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      DEFAULT_LANGUAGE: en_US
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ${DATA_ROOT}/storage:/var/www/html/storage
      - ${DATA_ROOT}/storage/upload:/var/www/html/storage/upload
    # No healthcheck here on purpose: the image ships its own (curl $HEALTHCHECK_PATH = /healthcheck, 5s interval, 300s start period), and
    # upstream's compose defines none, so a compose one would only replace it.
    depends_on:
      firefly-db:
        condition: service_healthy
      firefly-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

  firefly-importer:
    image: fireflyiii/data-importer:version-2.3.5
    container_name: firefly-importer
    restart: unless-stopped
    env_file: .env
    environment:
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: https://firefly.${DOMAIN}
      FIREFLY_III_CLIENT_ID: ${FIREFLY_III_CLIENT_ID:-}
      TRUSTED_PROXIES: "**"
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - firefly-importer-upload:/var/www/html/storage/upload
    # No healthcheck here on purpose: the image ships its own (curl $HEALTHCHECK_PATH, 10s interval), and
    # upstream's compose defines none, so a compose one would only replace it.
    depends_on:
      firefly:
        condition: service_healthy
    networks:
      - homeserver

  firefly-cron:
    image: alpine:3.24.2
    container_name: firefly-cron
    restart: unless-stopped
    env_file: .env
    # Calls the Firefly cron endpoint daily at 03:00 to process recurring transactions
    command: >-
      sh -c "apk add --no-cache curl tzdata &&
             echo '0 3 * * * curl -s http://firefly:8080/api/v1/cron/$$STATIC_CRON_TOKEN' | crontab - &&
             crond -f -l 8"
    depends_on:
      firefly:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  firefly-importer-upload:
  firefly-postgres-alpine:

networks:
  homeserver:
    external: true
