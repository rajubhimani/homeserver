services:
  valkey:
    # Shared Valkey: your own projects and any service that declares
    # "shared_cache" in services.json (own ACL login + key prefix each,
    # provisioned by homeserver.py). The per-app caches (e.g. outline-redis)
    # are separate. Services reach it only through env config
    # (CACHE_HOST=valkey). Valkey, not Redis: docs/10-new-services.md
    # "Managed-cloud parity".
    image: valkey/valkey:9.1.3-alpine
    container_name: valkey
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    env_file: .env
    # Logins live in an ACL file on the data volume (survives restarts). On
    # every start only the admin ("default") line is rewritten from
    # VALKEY_PASSWORD, so editing .env rotates it; the per-service logins
    # that homeserver.py provisions (shared_cache) are left as they are.
    # Expanded by the shell ($$), so the password never sits in this file.
    command:
      - sh
      - -c
      - |
        f=/data/users.acl
        touch "$$f"
        grep -v '^user default ' "$$f" > "$$f.new"
        echo "user default on >$$VALKEY_PASSWORD ~* &* +@all" >> "$$f.new"
        mv "$$f.new" "$$f"
        exec valkey-server --aclfile "$$f" --appendonly yes \
          --maxmemory "$$VALKEY_MAXMEMORY" --maxmemory-policy "$$VALKEY_MAXMEMORY_POLICY"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    networks:
      - homeserver

volumes:
  valkey-data:

networks:
  homeserver:
    external: true
