services:
  outline-db:
    image: postgres:18.4-alpine
    container_name: outline-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - outline-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  outline-redis:
    image: redis:8.10-alpine
    container_name: outline-redis
    restart: unless-stopped
    volumes:
      - outline-redis-alpine:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  outline:
    image: outlinewiki/outline:1.9.2
    container_name: outline
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@outline-db:5432/${POSTGRES_DB}?sslmode=disable
      PGSSLMODE: disable
      REDIS_URL: redis://outline-redis:6379
      URL: https://outline.${DOMAIN}
      PORT: 3000
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
    volumes:
      - ${DATA_ROOT}/data:/var/lib/outline/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      outline-db:
        condition: service_healthy
      outline-redis:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  outline-postgres-alpine:
  outline-redis-alpine:

networks:
  homeserver:
    external: true
