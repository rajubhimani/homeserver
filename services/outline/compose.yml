services:
  outline-db:
    image: postgres:18.6-alpine
    container_name: outline-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - outline-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  outline-redis:
    image: redis:8.10-alpine
    container_name: outline-redis
    restart: unless-stopped
    volumes:
      - outline-redis-alpine:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # Same pattern as firefly-permissions/mattermost-permissions/etc. --
  # outline's image runs as a hardcoded "nodejs" user (uid 1001, gid 1001,
  # confirmed via /etc/passwd inside the container -- distinct from the
  # image's OTHER "node" user, uid 1000, which is not what the app actually
  # runs as) with no root fallback, so it can never self-heal data/ if
  # recreated root-owned (e.g. after a wipe/--fresh restart).
  outline-permissions:
    image: alpine:3.24.1
    container_name: outline-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}/data:/outline-data
    command: sh -c "mkdir -p /outline-data && chown -R 1001:1001 /outline-data"

  outline:
    image: outlinewiki/outline:1.9.2
    container_name: outline
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@outline-db:5432/${POSTGRES_DB}?sslmode=disable
      PGSSLMODE: disable
      REDIS_URL: redis://outline-redis:6379
      URL: https://outline.${DOMAIN}
      PORT: 3000
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      OIDC_AUTH_URI: https://authentik.${DOMAIN}/application/o/authorize/
      OIDC_TOKEN_URI: https://authentik.${DOMAIN}/application/o/token/
      OIDC_USERINFO_URI: https://authentik.${DOMAIN}/application/o/userinfo/
    volumes:
      - ${DATA_ROOT}/data:/var/lib/outline/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      outline-db:
        condition: service_healthy
      outline-redis:
        condition: service_healthy
      outline-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

volumes:
  outline-postgres-alpine:
  outline-redis-alpine:

networks:
  homeserver:
    external: true
