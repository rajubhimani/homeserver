# Database lives on the shared Postgres server (services/shared-postgres),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-postgres.md.
services:
  penpot-redis:
    image: valkey/valkey:9.1.2-alpine
    container_name: penpot-redis
    restart: unless-stopped
    command: valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # Same pattern as firefly-permissions/mattermost-permissions/etc. --
  # penpot's backend/frontend images run as a hardcoded "penpot" user (uid
  # 1001, gid 1001, confirmed via /etc/passwd inside the container) with no
  # root fallback, so neither can self-heal assets/ (shared by both, same
  # bind mount path) if recreated root-owned (e.g. after a wipe/--fresh
  # restart). penpot-frontend already depends_on penpot-backend, so gating
  # only the backend on this is enough to order it before both.
  penpot-permissions:
    image: alpine:3.24.2
    container_name: penpot-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}/assets:/penpot-assets
    command: sh -c "mkdir -p /penpot-assets && chown -R 1001:1001 /penpot-assets"

  penpot-backend:
    image: penpotapp/backend:2.18.1
    container_name: penpot-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PENPOT_DATABASE_URI: postgresql://${DB_HOST}:${DB_PORT}/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PENPOT_REDIS_URI: redis://${CACHE_HOST}:${CACHE_PORT}/0
      PENPOT_PUBLIC_URI: https://penpot.${DOMAIN}
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_FLAGS: ${PENPOT_FLAGS}
      PENPOT_SMTP_HOST: ${PENPOT_SMTP_HOST}
      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT}
      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME}
      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD}
    volumes:
      - ${DATA_ROOT}/assets:/opt/data/assets
    depends_on:
      penpot-redis:
        condition: service_healthy
      penpot-permissions:
        condition: service_completed_successfully
    # Penpot backend's own readiness endpoint.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6060/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - homeserver

  penpot-exporter:
    image: penpotapp/exporter:2.18.1
    container_name: penpot-exporter
    restart: unless-stopped
    env_file: .env
    environment:
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://${CACHE_HOST}:${CACHE_PORT}/0
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
    depends_on:
      penpot-redis:
        condition: service_healthy
    networks:
      - homeserver

  penpot-frontend:
    image: penpotapp/frontend:2.18.1
    container_name: penpot-frontend
    restart: unless-stopped
    environment:
      PENPOT_PUBLIC_URI: https://penpot.${DOMAIN}
    volumes:
      - ${DATA_ROOT}/assets:/opt/data/assets
    healthcheck:
      # penpotapp/frontend 2.18 dropped wget/curl/nc (Debian trixie base);
      # bash's /dev/tcp does the same GET / and requires an HTTP 200.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks:
      - homeserver

networks:
  homeserver:
    external: true
