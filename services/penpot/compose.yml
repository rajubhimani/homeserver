services:
  penpot-db:
    image: postgres:18.6-alpine
    container_name: penpot-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - penpot-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homeserver

  penpot-redis:
    image: valkey/valkey:9.1.2-alpine
    container_name: penpot-redis
    restart: unless-stopped
    command: valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # Same pattern as firefly-permissions/mattermost-permissions/etc. --
  # penpot's backend/frontend images run as a hardcoded "penpot" user (uid
  # 1001, gid 1001, confirmed via /etc/passwd inside the container) with no
  # root fallback, so neither can self-heal assets/ (shared by both, same
  # bind mount path) if recreated root-owned (e.g. after a wipe/--fresh
  # restart). penpot-frontend already depends_on penpot-backend, so gating
  # only the backend on this is enough to order it before both.
  penpot-permissions:
    image: alpine:3.24.1
    container_name: penpot-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}/assets:/penpot-assets
    command: sh -c "mkdir -p /penpot-assets && chown -R 1001:1001 /penpot-assets"

  penpot-backend:
    image: penpotapp/backend:2.17.2
    container_name: penpot-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PENPOT_DATABASE_URI: postgresql://penpot-db/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PENPOT_REDIS_URI: redis://penpot-redis/0
      PENPOT_PUBLIC_URI: https://penpot.${DOMAIN}
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_FLAGS: ${PENPOT_FLAGS}
      PENPOT_SMTP_HOST: ${PENPOT_SMTP_HOST}
      PENPOT_SMTP_PORT: ${PENPOT_SMTP_PORT}
      PENPOT_SMTP_USERNAME: ${PENPOT_SMTP_USERNAME}
      PENPOT_SMTP_PASSWORD: ${PENPOT_SMTP_PASSWORD}
    volumes:
      - ${DATA_ROOT}/assets:/opt/data/assets
    depends_on:
      penpot-db:
        condition: service_healthy
      penpot-redis:
        condition: service_healthy
      penpot-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

  penpot-exporter:
    image: penpotapp/exporter:2.17.2
    container_name: penpot-exporter
    restart: unless-stopped
    env_file: .env
    environment:
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-redis/0
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
    depends_on:
      penpot-redis:
        condition: service_healthy
    networks:
      - homeserver

  penpot-frontend:
    image: penpotapp/frontend:2.17.2
    container_name: penpot-frontend
    restart: unless-stopped
    environment:
      PENPOT_PUBLIC_URI: https://penpot.${DOMAIN}
    volumes:
      - ${DATA_ROOT}/assets:/opt/data/assets
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks:
      - homeserver

volumes:
  penpot-postgres-alpine:

networks:
  homeserver:
    external: true
