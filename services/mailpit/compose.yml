services:
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    container_name: mailpit
    restart: unless-stopped
    env_file: .env
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - ${DATA_ROOT}/data:/data
    # No healthcheck here on purpose: the image ships its own (/mailpit readyz, 15s interval, 1s while starting), and
    # upstream's compose defines none, so a compose one would only replace it.
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - homeserver

networks:
  homeserver:
    external: true
