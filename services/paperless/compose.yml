services:
  paperless-db:
    image: postgres:18.4
    container_name: paperless-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - paperless-postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  paperless-redis:
    image: redis:8.10-alpine
    container_name: paperless-redis
    restart: unless-stopped
    command: redis-server --save "" --stop-writes-on-bgsave-error no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.4
    container_name: paperless
    restart: unless-stopped
    env_file: .env
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: ${POSTGRES_DB}
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: https://paperless.${DOMAIN}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_TASK_WORKERS: ${PAPERLESS_TASK_WORKERS}
      PAPERLESS_THREADS_PER_WORKER: ${PAPERLESS_THREADS_PER_WORKER}
      PAPERLESS_DATA_DIR: /paperless/data
      PAPERLESS_MEDIA_ROOT: /paperless/media
      PAPERLESS_CONSUMPTION_DIR: /paperless/consume
      PAPERLESS_EXPORT_DIR: /paperless/export
    volumes:
      - ${DATA_ROOT}/app:/paperless
      # PAPERLESS_DATA_DIR/MEDIA_ROOT/CONSUMPTION_DIR/EXPORT_DIR above redirect
      # paperless to /paperless/* (bind-mounted), so the image's own default
      # paths below are unused — but the image still declares VOLUME on them,
      # so mount them to named volumes or Docker silently creates anonymous
      # ones for each.
      - paperless-consume-unused:/usr/src/paperless/consume
      - paperless-data-unused:/usr/src/paperless/data
      - paperless-export-unused:/usr/src/paperless/export
      - paperless-media-unused:/usr/src/paperless/media
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  paperless-postgres:
  paperless-consume-unused:
  paperless-data-unused:
  paperless-export-unused:
  paperless-media-unused:

networks:
  homeserver:
    external: true
