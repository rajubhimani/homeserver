x-erpnext-image: &erpnext_image
  image: frappe/erpnext:${ERPNEXT_VERSION:-v16.37.0}
  restart: unless-stopped

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    erpnext-configurator:
      condition: service_completed_successfully

x-bench-defaults: &bench_defaults
  <<: [*depends_on_configurator, *erpnext_image]
  env_file: .env
  volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
  networks:
    - homeserver

services:
  erpnext-db:
    image: mariadb:11.8
    container_name: erpnext-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - erpnext-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - homeserver

  erpnext-redis-cache:
    image: redis:8.10-alpine
    container_name: erpnext-redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  erpnext-redis-queue:
    image: redis:8.10-alpine
    container_name: erpnext-redis-queue
    restart: unless-stopped
    volumes:
      - erpnext-redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # One-shot: writes db/redis connection details into the shared `sites`
  # volume's common_site_config.json, then exits. Every other bench
  # container waits on it via `service_completed_successfully` (see
  # &depends_on_configurator above) so they never race a half-written config.
  erpnext-configurator:
    <<: *erpnext_image
    container_name: erpnext-configurator
    restart: on-failure
    env_file: .env
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host erpnext-db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://erpnext-redis-cache:6379";
        bench set-config -g redis_queue "redis://erpnext-redis-queue:6379";
        bench set-config -g redis_socketio "redis://erpnext-redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-db:
        condition: service_healthy
    networks:
      - homeserver

  erpnext-backend:
    <<: *bench_defaults
    container_name: erpnext-backend
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    # frappe/erpnext's own wait-for-it on the gunicorn port, as community
    # frappe_docker setups do (no dedicated health endpoint exists).
    healthcheck:
      test: ["CMD", "wait-for-it", "-t", "5", "127.0.0.1:8000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  erpnext-websocket:
    <<: *bench_defaults
    container_name: erpnext-websocket
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    healthcheck:
      test: ["CMD", "wait-for-it", "-t", "5", "127.0.0.1:9000"]
      interval: 30s
      timeout: 5s
      retries: 5

  erpnext-queue-short:
    <<: *bench_defaults
    container_name: erpnext-queue-short
    command: bench worker --queue short,default

  erpnext-queue-long:
    <<: *bench_defaults
    container_name: erpnext-queue-long
    command: bench worker --queue long,default,short

  erpnext-scheduler:
    <<: *bench_defaults
    container_name: erpnext-scheduler
    command: bench schedule

  # One-shot: creates the site on a fresh install, so ERPNext comes up usable
  # without a manual `bench new-site` (the site lives in the erpnext-sites
  # volume, so after a wipe/reset it's gone and used to need re-creating by
  # hand). Adapted from frappe_docker's own pwd.yml `create-site` service:
  # same idempotent skip-if-exists check and same new-site flags. Differences:
  # waits on the configurator via depends_on instead of polling its JSON, and
  # takes the Administrator password from .env (ERPNEXT_ADMIN_PASSWORD)
  # instead of upstream's hard-coded "admin". Keep `bench new-site` on ONE
  # line: in a YAML folded block (>), deeper-indented lines keep their line
  # breaks, which split the flags into separate shell commands (2026-10-02).
  erpnext-create-site:
    <<: *erpnext_image
    container_name: erpnext-create-site
    restart: "no"
    env_file: .env
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 erpnext-db:3306;
        wait-for-it -t 120 erpnext-redis-cache:6379;
        wait-for-it -t 120 erpnext-redis-queue:6379;
        if [ -d "sites/erpnext.${DOMAIN}" ]; then
          echo "Site erpnext.${DOMAIN} already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --db-root-username=root --db-root-password="$$DB_PASSWORD" --admin-password="$$ERPNEXT_ADMIN_PASSWORD" --install-app erpnext --set-default "erpnext.${DOMAIN}";
        fi
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    networks:
      - homeserver

  # Serves the site — this is the container fronted by nginx-plain
  # (services/nginx-plain/templates/default.conf.template).
  erpnext:
    <<: *erpnext_image
    container_name: erpnext
    env_file: .env
    entrypoint:
      - nginx-entrypoint.sh
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: erpnext.${DOMAIN}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
    # Starts only once the site exists, so its /api/method/ping check never
    # runs against a site-less fresh install (that's what showed this
    # container "unhealthy" after the 2026-10-02 reset).
    depends_on:
      erpnext-backend:
        condition: service_started
      erpnext-websocket:
        condition: service_started
      erpnext-create-site:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/method/ping || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    networks:
      - homeserver

volumes:
  erpnext-sites:
  erpnext-db-data:
  erpnext-redis-queue-data:

networks:
  homeserver:
    external: true
