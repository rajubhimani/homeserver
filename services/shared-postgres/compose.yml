# One Postgres server shared by the services above CORE that declare
# "shared_db": {"engine": "postgres", ...} in services.json. Each app gets its
# own database + login role (owner of that database only), created by
# homeserver.py's provision_shared_db. homeserver.py starts this before any
# such app and stops it once none is running — see
# docs/services/shared-postgres.md. CORE/MIN keep their own <service>-db.
services:
  shared-postgres:
    image: postgres:18.6-alpine
    container_name: shared-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    # Sized for ~20 apps at once rather than one: Temporal's roles alone open
    # ~100 connections on a cold start, Airflow and Plane run several
    # workers each. Tune with the homeserver-postgres skill's guidance.
    command: postgres -c shared_buffers=512MB -c max_connections=300 -c work_mem=4MB -c maintenance_work_mem=128MB -c effective_cache_size=1536MB
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      # Named volume at the image's declared VOLUME path (postgres 18:
      # /var/lib/postgresql) — see the homeserver-postgres skill.
      - shared-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homeserver

volumes:
  shared-postgres-data:

networks:
  homeserver:
    external: true
