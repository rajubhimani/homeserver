# Database lives on the shared MariaDB server (services/shared-mariadb),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-mariadb.md.
services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:v26.09.1-ls287
    container_name: bookstack
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: 1000
      PGID: 1000
      APP_URL: https://bookstack.${DOMAIN}
      APP_KEY: ${APP_KEY}
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ${DATA_ROOT}/config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
