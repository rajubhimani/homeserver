services:
  mullvad-browser:
    # Deliberate exception to this repo's pinned-version convention, same
    # rationale as services/firefox/compose.yml: internet-reachable, stateless
    # (profile lives in the /config volume), benefits from always-current
    # security patches. `uv run homeserver.py dev update mullvad-browser`
    # stays current.
    image: lscr.io/linuxserver/mullvad-browser:latest
    container_name: mullvad-browser
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: 1000
      PGID: 1000
      # Sourced from the repo ROOT .env (homeserver.py injects it) — same
      # credential nginx-plain's browser-hub gate uses, kept in sync by
      # design. See docs/services/browser-hub.md.
      CUSTOM_USER: ${BROWSER_HUB_USER}
      PASSWORD: ${BROWSER_HUB_PASSWORD}
      # Public-facing container: reduce blast radius if the browser itself is
      # ever compromised — disables sudo, terminal emulators, and xdg/exo-open.
      HARDEN_DESKTOP: "true"
      # Compensates for HARDEN_DESKTOP above: with no terminal/xdg-open to
      # relaunch it, accidentally closing Mullvad Browser itself (not just
      # your own viewing tab) would otherwise strand the session with no way
      # to get it back short of restarting the whole container. This
      # watchdog auto-relaunches the main app whenever it exits.
      RESTART_APP: "true"
      # Served at https://browser.${DOMAIN}/mullvad-browser/ via the shared
      # browser hub (services/nginx-plain), not its own subdomain — see
      # docs/services/browser-hub.md. Needs both slashes per upstream's docs.
      SUBFOLDER: /mullvad-browser/
    volumes:
      - ${DATA_ROOT}/config:/config
    shm_size: "1gb"
    # Firefox-based (like services/firefox), not Chromium — no seccomp
    # relaxation needed, unlike chromium/ungoogled-chromium/brave.
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u \"$$CUSTOM_USER:$$PASSWORD\" http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
