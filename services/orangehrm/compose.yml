# Database lives on the shared MariaDB server (services/shared-mariadb),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-mariadb.md.
services:
  orangehrm:
    # Pin explicitly, check https://hub.docker.com/r/orangehrm/orangehrm/tags for updates
    image: orangehrm/orangehrm:5.9
    container_name: orangehrm
    restart: unless-stopped
    # No volume mount to a data path yet — see docs/services/orangehrm.md.
    # The app root is /var/www/html (confirmed by inspecting the running
    # container), and the actual config/upload paths that need persisting
    # aren't populated until the web installer runs, so a guessed bind mount
    # risks silently overlaying (and losing) baked-in app files. All state
    # currently lives inside the container only and is lost on recreate.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
