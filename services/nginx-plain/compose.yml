services:
  nginx-plain:
    image: nginx:1.30.6-alpine
    container_name: nginx-plain
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN}
    # nginx:alpine automatically processes templates/*.conf.template via envsubst
    # AND auto-runs every /docker-entrypoint.d/*.sh script, both on startup.
    volumes:
      - ./templates:/etc/nginx/templates:ro
      - ${DATA_ROOT}/certs:/etc/nginx/certs:ro
      # Turns on the HTTPS listeners when the acme service has put a certificate in certs/
      - ./docker-entrypoint.d/30-enable-tls.sh:/docker-entrypoint.d/30-enable-tls.sh:ro
      - ./html/browser-hub:/usr/share/nginx/html/browser-hub:ro
      - ./html/company:/usr/share/nginx/html/company:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/_health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
