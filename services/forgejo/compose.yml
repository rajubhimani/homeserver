services:
  forgejo-db:
    image: postgres:18.6-alpine
    container_name: forgejo-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - forgejo-postgres-alpine:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.3
    container_name: forgejo
    restart: unless-stopped
    env_file: .env
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: ${POSTGRES_DB}
      FORGEJO__database__USER: ${POSTGRES_USER}
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
      FORGEJO__server__DOMAIN: forgejo.${DOMAIN}
      FORGEJO__server__ROOT_URL: https://forgejo.${DOMAIN}
      FORGEJO__server__SSH_PORT: 2223
      FORGEJO__service__DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      FORGEJO__security__INSTALL_LOCK: "true"
      # v16+ no longer trusts all proxies by default (was REVERSE_PROXY_TRUSTED_PROXIES=*
      # in the image) — scope it to the internal Docker network so nginx-plain's
      # X-Forwarded-For/X-Real-IP are still honored correctly.
      FORGEJO__service__REVERSE_PROXY_TRUSTED_PROXIES: 172.18.0.0/16
      FORGEJO__actions__ENABLED: "true"
      # Put the requested common choices first in the repository license picker.
      # These names match Forgejo's bundled SPDX template filenames.
      FORGEJO__repository__PREFERRED_LICENSES: ${PREFERRED_LICENSES:-Apache-2.0,GPL-3.0-only,MIT}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${DATA_ROOT}/app:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      forgejo-db:
        condition: service_healthy
    networks:
      - homeserver

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:13.0.0
    container_name: forgejo-runner
    restart: unless-stopped
    # Image defaults to uid 1000, which can't reach the bind-mounted host docker.sock
    # (owned by root:docker on the host) -- run as root like this repo's other
    # socket-mounting services (dozzle/portainer/dockge) so `docker` exec actions work.
    user: "0:0"
    environment:
      FORGEJO_INSTANCE_URL: https://forgejo.${DOMAIN}
      RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-forgejo-runner}
      # catthehacker/ubuntu is the standard community image for act/Forgejo/Gitea
      # runners -- it emulates GitHub's runner environment (Node ABI, curl, docker
      # CLI, build tools). Plain node:20-bookworm crashes on actions/checkout@v7's
      # post-run cache step (undici expects a newer Node than that image ships).
      # Aliasing GitHub's own runs-on names (ubuntu-latest/24.04/22.04) to the same
      # images means a workflow copied straight from a GitHub-mirrored repo works
      # unmodified -- no one has to know to write `runs-on: docker` instead.
      RUNNER_LABELS: ${RUNNER_LABELS:-docker:docker://catthehacker/ubuntu:act-latest,ubuntu-latest:docker://catthehacker/ubuntu:act-latest,ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04,ubuntu-22.04:docker://catthehacker/ubuntu:act-22.04}
      # How many jobs this runner executes concurrently -- default is 1
      # (strictly sequential, e.g. a 4-way matrix runs one leg at a time).
      # Tried 4: hit a real Forgejo server-side bug (500 Internal Server
      # Error from Forgejo's own UpdateTask API when two jobs' status
      # updates land in the same instant -- matches known upstream reports,
      # e.g. go-gitea/gitea#38001) plus service containers with fixed host
      # ports (this repo's own check job's postgres/redis on 5432/6379)
      # colliding across concurrent jobs. Neither is fixable from this
      # side -- see docs/services/forgejo.md before raising this again.
      RUNNER_CAPACITY: ${RUNNER_CAPACITY:-1}
    # The image's default CMD is the bare binary with no subcommand, which just prints
    # help text and exits 0 -- with restart:unless-stopped that loops forever and the
    # container never stays up long enough to `docker exec` a manual `register` into it.
    # Register once (writes /data/.runner) using RUNNER_REGISTRATION_TOKEN, then daemon.
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/.runner ]; then
          if [ -z "$$RUNNER_REGISTRATION_TOKEN" ]; then
            echo "forgejo-runner: /data/.runner not found and RUNNER_REGISTRATION_TOKEN is unset -- set it in services/forgejo/.env (get a token from https://forgejo.${DOMAIN}/-/admin/actions/runners, 'Create new Runner')" >&2
            exit 1
          fi
          forgejo-runner register --no-interactive \
            --instance "$$FORGEJO_INSTANCE_URL" \
            --token "$$RUNNER_REGISTRATION_TOKEN" \
            --name "$$RUNNER_NAME" \
            --labels "$$RUNNER_LABELS"
        fi
        # forgejo-runner itself has the host docker.sock (below), but each job
        # runs in its own separate sibling container that does NOT inherit it --
        # a workflow step running `docker build`/`docker push` fails with
        # "no such file or directory" on /var/run/docker.sock without this.
        # docker_host: automount is the runner's own purpose-built setting for
        # this (defaults to "-", meaning explicitly NOT mounted) -- it finds the
        # runner's own docker host and mounts it into the job container at
        # /var/run/docker.sock. Admin-controlled (this file), not something a
        # workflow can request itself, so this isn't a sandbox-escape vector
        # for untrusted workflow authors the way per-job volume options would be.
        #
        # An isolated Docker-in-Docker sidecar (forgejo-docker, a separate
        # docker:28-dind container) was tried and reverted -- it worked for
        # every job EXCEPT one that itself needs `docker build`/`push`: such
        # a job would need its own nested dind (job containers already live
        # inside forgejo-docker's own nested engine), and docker:dind as a
        # THIRD nesting level crashed on startup every time it was tried
        # (confirmed via forgejo-docker's own logs: the service container
        # died within seconds of creation, before any build step could run --
        # a known fragility of deeply nested DinD, not a config mistake).
        # automount is the simpler of Forgejo's own three documented options
        # for this and the one proven to actually work end to end -- see
        # docs/services/forgejo.md for the full history and trade-off.
        cat > /data/config.yaml <<-CONFIG
        runner:
          file: .runner
          capacity: $$RUNNER_CAPACITY
        container:
          docker_host: "automount"
        CONFIG
        exec forgejo-runner daemon --config /data/config.yaml
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${FORGEJO_RUNNER_DATA_ROOT}:/data
    depends_on:
      forgejo:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  forgejo-postgres-alpine:

networks:
  homeserver:
    external: true
