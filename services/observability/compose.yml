services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_ROOT}/prometheus:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - homeserver

  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION}
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${DATA_ROOT}/loki:/loki
    # No healthcheck: grafana/loki is a fully distroless image (confirmed —
    # no /bin/sh, wget, curl, or nc present), so no CMD/CMD-SHELL probe can
    # run inside the container. Dependents below use service_started instead
    # of service_healthy.
    networks:
      - homeserver

  # Ships every container's stdout/stderr to Loki. Replaces Promtail, which
  # went EOL 2026-03-02 — Alloy is Grafana's supported successor and covers
  # the same job: discover containers via the Docker socket, no per-service
  # config needed since FastAPI services here already log Loki-compatible
  # JSON to stdout (queryable in Grafana via `| json` in LogQL).
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    # Image has bash but no wget/curl — use bash's /dev/tcp instead of a
    # missing HTTP client (confirmed by exec'ing into the running container).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/12345 && printf \"GET /-/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - homeserver

  # Per-container CPU/memory/network/disk metrics for Prometheus to scrape.
  # Needs broad host access (docker internals, cgroups) to read this data —
  # standard requirement for cAdvisor, not specific to this stack.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    # Only track actual container cgroups, not the whole host cgroup tree
    # (systemd slices, root) — cuts tracked cgroups roughly in half and
    # keeps memory usage proportional to container count. That's still
    # proportional, though: at 100+ running containers this host measured
    # ~3.5GB RSS. This cAdvisor build's --disable_metrics default already
    # skips the heavy collectors this stack doesn't use (tcp/udp, process,
    # cpu_topology, hugetlb, etc — see `docker logs cadvisor` usage text),
    # so that flag isn't the lever. The actual lever: --housekeeping_interval
    # defaults to 1s *per container* (a full stats + disk-usage-walk pass
    # every second, times 116 containers), while Prometheus only scrapes
    # this endpoint every 15s (prometheus.yml global scrape_interval) — so
    # cAdvisor was recomputing/caching stats ~15x more often than anything
    # ever reads them. Matching it to the scrape interval cuts that waste
    # without losing any resolution Prometheus actually captures.
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - homeserver

  # Host-level CPU/memory/disk/network metrics. Stays on the homeserver
  # bridge network (not host networking, unlike most node-exporter recipes)
  # to match this stack's one-network convention — trades away a few
  # network-interface-level stats for consistency with every other service.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - homeserver

  grafana:
    image: grafana/grafana-oss:13.0.2
    # container_name is "observability", not "grafana", so homeserver.py's
    # wait_healthy()/get_running_services() (which match on the service
    # *directory* name, "observability") find this container — same trick
    # Guacamole uses (its webapp container is named exactly "guacamole").
    # Internal DNS hostname stays "grafana" (the compose service key below),
    # unaffected by container_name — every other container in this stack
    # still reaches it at http://grafana:3000.
    container_name: observability
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      # Grafana is admin-provisioned (no public signup expected for a
      # monitoring dashboard) — kept at the image's own default.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # SMTP for alerting emails — points at Mailpit for testing (see
      # GRAFANA_SMTP_HOST/FROM in .env). SKIP_VERIFY since Mailpit has no
      # TLS at all, not just a self-signed cert to ignore.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST}
      GF_SMTP_SKIP_VERIFY: "true"
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM}
    volumes:
      - ${DATA_ROOT}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
