services:
  portainer:
    image: portainer/portainer-ce:2.45.3
    container_name: portainer
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DATA_ROOT}/data:/data
    networks:
      - homeserver

networks:
  homeserver:
    external: true
