services:
  coolify-db:
    image: postgres:18.6-alpine
    container_name: coolify-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: coolify
      POSTGRES_USER: coolify
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - coolify-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolify"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  coolify-redis:
    image: redis:8.10-alpine
    container_name: coolify-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - coolify-redis-alpine:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  coolify-realtime:
    image: coollabsio/coolify-realtime:1.0.18
    container_name: coolify-realtime
    restart: unless-stopped
    env_file: .env
    # Needed for the terminal feature specifically: coolify-realtime SSHes
    # into whatever IP/host the "localhost" server is configured with
    # (host.docker.internal in this stack's setup docs) to spawn the shell.
    # Missing this while `coolify` itself already has it caused "Could not
    # resolve hostname host.docker.internal" inside terminal sessions even
    # though the WebSocket connection itself worked fine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Same SSH keys volume as `coolify` itself (confirmed against
    # upstream's own docker-compose.prod.yml, which mounts this into both
    # containers identically) — terminal-server.js reads the private key
    # directly from disk to open the SSH session. Named volume, not a
    # service_data/ bind mount — see the comment on `coolify`'s own ssh
    # mount below for why.
    volumes:
      - coolify-ssh-keys:/var/www/html/storage/app/ssh
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9601/usage"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - homeserver

  coolify:
    image: coollabsio/coolify:4.3.16
    container_name: coolify
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ID: ${APP_ID}
      APP_KEY: ${APP_KEY}
      APP_URL: https://coolify.${DOMAIN}
      DB_HOST: coolify-db
      DB_PORT: 5432
      DB_DATABASE: coolify
      DB_USERNAME: coolify
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: coolify-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_APP_KEY: ${PUSHER_APP_KEY}
      PUSHER_APP_SECRET: ${PUSHER_APP_SECRET}
      # PUSHER_HOST/PORT are rendered directly into the browser's own JS
      # (the terminal/live-deploy-logs WebSocket config) — must be a
      # publicly reachable host, not the Docker-internal container name.
      # Routed through nginx-plain's /app/ location on this same vhost
      # (see default.conf.template) rather than exposing coolify-realtime
      # on its own port, so it works identically on LAN and via cloudflared.
      PUSHER_HOST: coolify.${DOMAIN}
      PUSHER_PORT: 443
      # Backend (Laravel -> coolify-realtime) stays on the fast internal
      # Docker connection — these already default to the same values, set
      # explicitly so the front/back split is obvious at a glance.
      PUSHER_BACKEND_HOST: coolify-realtime
      PUSHER_BACKEND_PORT: 6001
    # All six of these previously mounted to /data/coolify/... — a path
    # this image doesn't use at all (verified: it exists on disk inside
    # the container but is dead/unused). The actual Laravel storage root
    # is /var/www/html/storage/app/ — confirmed against Coolify's own
    # official docker-compose.prod.yml. The old wrong paths meant every
    # SSH private key, deployed-application config, one-click database,
    # backup, and one-click-service config was silently ephemeral —
    # wiped on every container recreation, not actually persisted.
    #
    # ssh specifically is a *named volume*, not a service_data/ bind
    # mount like the other five — service_data/ lives on an NTFS drive
    # (fuseblk/ntfs-3g on this host), which cannot store real Unix
    # permissions/ownership at all: chmod/chown against it silently
    # no-op forever. OpenSSH refuses to load a private key unless its
    # file mode is actually 0600, so SSH-based features (the terminal)
    # would never work with the key sitting there. Named volumes live in
    # Docker's own storage (btrfs on this host — confirmed with
    # `df -T /var/lib/docker`), which supports real permissions, same
    # reasoning as this stack's database-data-as-named-volume rule (see
    # the homeserver-postgres skill).
    volumes:
      - coolify-ssh-keys:/var/www/html/storage/app/ssh
      - ${DATA_ROOT}/applications:/var/www/html/storage/app/applications
      - ${DATA_ROOT}/databases:/var/www/html/storage/app/databases
      - ${DATA_ROOT}/services:/var/www/html/storage/app/services
      - ${DATA_ROOT}/backups:/var/www/html/storage/app/backups
      - ${DATA_ROOT}/images:/var/www/html/storage/app/images
      - ${DOCKER_SOCKET}:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      coolify-db:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy
      coolify-realtime:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  coolify-postgres-alpine:
  coolify-redis-alpine:
  coolify-ssh-keys:

networks:
  homeserver:
    external: true
