services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_ROOT}/config:/config
      - ${DATA_ROOT}/cache:/cache
      - ${MEDIA_ROOT}:/media:ro
      - ${METADATA_ROOT}:/config/metadata
    networks:
      - homeserver

networks:
  homeserver:
    external: true
