services:
  gitlab:
    image: gitlab/gitlab-ce:19.2.4-ce.0
    container_name: gitlab
    restart: unless-stopped
    hostname: gitlab.${DOMAIN}
    env_file: .env
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.${DOMAIN}'
        gitlab_rails['gitlab_ssh_host'] = 'gitlab.${DOMAIN}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        gitlab_rails['gitlab_signup_enabled'] = ${SIGNUP_ENABLED:-false}
        # Cloudflare terminates TLS — serve plain HTTP internally
        nginx['listen_https'] = false
        nginx['listen_port'] = 80
        nginx['proxy_set_headers'] = {
          "X-Forwarded-Proto" => "https",
          "X-Forwarded-Ssl" => "on"
        }
        # Outgoing email — points at Mailpit (services/mailpit/, container
        # "mailpit") for testing; no real mail delivery. No auth needed.
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = 'mailpit'
        gitlab_rails['smtp_port'] = 1025
        gitlab_rails['smtp_domain'] = 'mailpit'
        gitlab_rails['smtp_authentication'] = false
        gitlab_rails['smtp_enable_starttls_auto'] = false
        gitlab_rails['smtp_tls'] = false
        gitlab_rails['gitlab_email_from'] = 'gitlab@example.com'
        gitlab_rails['gitlab_email_reply_to'] = 'gitlab@example.com'
    volumes:
      - ${DATA_ROOT}/config:/etc/gitlab
      - ${DATA_ROOT}/logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 6G
    networks:
      - homeserver

  gitlab-runner:
    image: gitlab/gitlab-runner:v19.2.1
    container_name: gitlab-runner
    restart: unless-stopped
    profiles:
      - runner
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DATA_ROOT}/runner-config:/etc/gitlab-runner
      # Image also declares VOLUME /home/gitlab-runner (runner user's home,
      # used for job cache) — mount it to a named volume so Docker doesn't
      # silently create an anonymous one.
      - gitlab-runner-home:/home/gitlab-runner
    depends_on:
      - gitlab
    networks:
      - homeserver

volumes:
  gitlab-data:
  gitlab-runner-home:

networks:
  homeserver:
    external: true
