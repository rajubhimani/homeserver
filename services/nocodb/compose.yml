services:
  nocodb-db:
    image: postgres:18.6-alpine
    container_name: nocodb-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - nocodb-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  nocodb:
    image: nocodb/nocodb:2026.08.2
    container_name: nocodb
    restart: unless-stopped
    env_file: .env
    environment:
      NC_DB: pg://nocodb-db:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}
      NC_PUBLIC_URL: https://nocodb.${DOMAIN}
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
    volumes:
      - ${DATA_ROOT}/data:/usr/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nocodb-db:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  nocodb-postgres-alpine:

networks:
  homeserver:
    external: true
