# Database lives on the shared Postgres server (services/shared-postgres),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-postgres.md.
services:
  nocodb:
    image: nocodb/nocodb:2026.09.1
    container_name: nocodb
    restart: unless-stopped
    env_file: .env
    environment:
      NC_DB: pg://${DB_HOST}:${DB_PORT}?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${POSTGRES_DB}
      NC_PUBLIC_URL: https://nocodb.${DOMAIN}
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET}
    volumes:
      - ${DATA_ROOT}/data:/usr/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
