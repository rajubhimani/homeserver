# Database lives on the shared Postgres server (services/shared-postgres),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-postgres.md.
services:
  plane-redis:
    image: valkey/valkey:9.1.2-alpine
    container_name: plane-redis
    restart: unless-stopped
    command: valkey-server --save "" --stop-writes-on-bgsave-error no
    volumes:
      - plane-redis-alpine:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  plane-mq:
    image: rabbitmq:4.3.6-alpine
    container_name: plane-mq
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - plane-rabbitmq-alpine:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - homeserver

  plane-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: plane-minio
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_ROOT}/uploads:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - homeserver

  plane-migrator:
    image: makeplane/plane-backend:v1.4.2
    container_name: plane-migrator
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://${CACHE_HOST}:${CACHE_PORT}/
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    networks:
      - homeserver

  plane-api:
    image: makeplane/plane-backend:v1.4.2
    container_name: plane-api
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://${CACHE_HOST}:${CACHE_PORT}/
      RABBITMQ_HOST: ${MQ_HOST}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_S3_BUCKET_NAME: uploads
      WEB_URL: https://plane.${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://plane.${DOMAIN}
      APP_BASE_URL: https://plane.${DOMAIN}
      ADMIN_BASE_URL: https://plane.${DOMAIN}
      SPACE_BASE_URL: https://plane.${DOMAIN}
      SECRET_KEY: ${SECRET_KEY}
      GUNICORN_WORKERS: "2"
    depends_on:
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    healthcheck:
      # Plane Community Edition's documented health check: GET / returns
      # {"status": "OK"} (developers.plane.so/self-hosting/manage/health-checks;
      # /api/health/ etc. are Commercial Edition only).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - homeserver

  plane-worker:
    image: makeplane/plane-backend:v1.4.2
    container_name: plane-worker
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://${CACHE_HOST}:${CACHE_PORT}/
      RABBITMQ_HOST: ${MQ_HOST}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_S3_BUCKET_NAME: uploads
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    networks:
      - homeserver

  plane-beat:
    image: makeplane/plane-backend:v1.4.2
    container_name: plane-beat
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://${CACHE_HOST}:${CACHE_PORT}/
      RABBITMQ_HOST: ${MQ_HOST}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    networks:
      - homeserver

  plane-web:
    image: makeplane/plane-frontend:v1.4.2
    container_name: plane-web
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://plane.${DOMAIN}
      NEXT_PUBLIC_ADMIN_BASE_URL: https://plane.${DOMAIN}
    depends_on:
      plane-api:
        condition: service_started
    networks:
      - homeserver

  plane-admin:
    image: makeplane/plane-admin:v1.4.2
    container_name: plane-admin
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://plane.${DOMAIN}
      NEXT_PUBLIC_ADMIN_BASE_URL: https://plane.${DOMAIN}
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started
    networks:
      - homeserver

  plane-space:
    image: makeplane/plane-space:v1.4.2
    container_name: plane-space
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://plane.${DOMAIN}
      NEXT_PUBLIC_ADMIN_BASE_URL: https://plane.${DOMAIN}
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started
    networks:
      - homeserver

  plane-proxy:
    image: makeplane/plane-proxy:v1.4.2
    container_name: plane-proxy
    restart: unless-stopped
    env_file: .env
    environment:
      NGINX_PORT: "80"
      FILE_SIZE_LIMIT: "5m"
      BUCKET_NAME: uploads
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started
    networks:
      - homeserver

volumes:
  plane-redis-alpine:
  plane-rabbitmq-alpine:

networks:
  homeserver:
    external: true
