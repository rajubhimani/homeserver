services:
  clamav:
    image: clamav/clamav:1.5.4_base
    container_name: clamav
    restart: unless-stopped
    env_file: .env
    environment:
      CLAMD_STARTUP_TIMEOUT: ${CLAMD_STARTUP_TIMEOUT:-1800}
      CLAMAV_MAX_SIGNATURE_AGE_DAYS: ${CLAMAV_MAX_SIGNATURE_AGE_DAYS:-3}
    # No persistent volumes at all — pure regenerable virus-signature cache,
    # nothing here that isn't re-downloadable from ClamAV's own update
    # servers, so it lives under service_data/cache/, never service_data/data/.
    volumes:
      - ${CACHE_ROOT}:/var/lib/clamav
      - ./healthcheck.sh:/usr/local/bin/healthcheck.sh:ro
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      # Overrides the image's own clamdcheck.sh (clamd ping only) with a
      # script that also checks signature freshness — see healthcheck.sh
      # for why: a dead freshclam doesn't crash anything, so the plain ping
      # check alone would report "healthy" indefinitely on stale signatures.
      test: ["CMD", "sh", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - homeserver

  # clamav's healthcheck.sh catches a silently-failing freshclam, but that
  # only surfaces to `docker ps`/`docker inspect` -- nobody watches that
  # proactively. This polls the Docker API for clamav's actual health status
  # and pushes an ntfy notification when it's been unhealthy for a while.
  # Same watchdog pattern as adguard-home's (see services/adguard-home/).
  clamav-watchdog:
    image: curlimages/curl:8.21.0
    container_name: clamav-watchdog
    restart: unless-stopped
    # curlimages/curl drops to a non-root user by default, which can't reach
    # the Docker socket regardless of its host-side group ownership (varies
    # between Docker and rootless podman). Root bypasses that permission
    # check entirely.
    user: "0:0"
    environment:
      CHECK_INTERVAL: ${WATCHDOG_CHECK_INTERVAL:-300}
      FAIL_THRESHOLD: ${WATCHDOG_FAIL_THRESHOLD:-2}
      ALERT_COOLDOWN: ${WATCHDOG_ALERT_COOLDOWN:-21600}
      NTFY_URL: ${NTFY_ALERT_URL}
      NTFY_TOKEN: ${NTFY_ALERT_TOKEN}
    entrypoint: ["/bin/sh", "/watchdog.sh"]
    volumes:
      - ./watchdog.sh:/watchdog.sh:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - homeserver
    depends_on:
      - clamav

networks:
  homeserver:
    external: true
