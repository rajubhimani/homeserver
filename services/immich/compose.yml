services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    container_name: immich-server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: ${DB_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      IMMICH_SECRET: ${IMMICH_SECRET}
      REDIS_HOSTNAME: immich-redis
      # Windows Docker Desktop bind mounts have been observed failing Immich's
      # own create->read->overwrite mount-integrity check on `upload/` (a
      # write succeeds, the very next read of the same file returns ENOENT) —
      # this is Immich's officially documented escape hatch for that case
      # (see https://docs.immich.app/administration/system-integrity). Does
      # not affect actual file read/write during normal use, only this
      # startup self-check.
      IMMICH_IGNORE_MOUNT_CHECK_ERRORS: ${IMMICH_IGNORE_MOUNT_CHECK_ERRORS:-false}
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      # Uncomment when PHOTOS_LOCATION / VIDEOS_LOCATION are set in .env
      # - ${PHOTOS_LOCATION}:/mnt/photos:ro
      # - ${VIDEOS_LOCATION}:/mnt/videos:ro
      - /etc/localtime:/etc/localtime:ro
      - immich-server-data:/data
    depends_on:
      immich-database:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    networks:
      - homeserver

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    container_name: immich-ml
    restart: unless-stopped
    env_file: .env
    volumes:
      - immich-model-cache:/cache
    networks:
      - homeserver

  immich-redis:
    image: valkey/valkey:9.1.1-alpine
    container_name: immich-redis
    restart: unless-stopped
    # Disable RDB snapshots — no disk persistence needed for cache/queue data
    command: valkey-server --save "" --stop-writes-on-bgsave-error no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  immich-database:
    image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
    container_name: immich-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c shared_buffers=512MB -c max_connections=50 -c work_mem=4MB -c maintenance_work_mem=256MB -c effective_cache_size=1536MB
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - immich-postgres:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homeserver

  immich-offline-remover:
    image: ghcr.io/tenekev/immich-offline-files-remover@sha256:73ee3a92c99cd1e43dda62d0dd5546515ad84422dbbd3988b066a1d159d53d3c
    container_name: immich-offline-remover
    restart: unless-stopped
    environment:
      API_URL: http://immich-server:2283/api
      API_KEY: ${IMMICH_OFFLINE_API_KEY}
      OFFLINE_THRESHOLD: 100
      CRON_EXPRESSION: "0 2 * * *"
    networks:
      - homeserver

volumes:
  immich-model-cache:
  immich-server-data:
  immich-postgres:

networks:
  homeserver:
    external: true
