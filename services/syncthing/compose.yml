services:
  syncthing-permissions:
    image: alpine:3.24
    container_name: syncthing-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - syncthing-config:/config
    # linuxserver images use abc (PUID 1000, PGID 1000)
    command: chown -R 1000:1000 /config

  syncthing:
    image: lscr.io/linuxserver/syncthing:2.1.3
    container_name: syncthing
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - syncthing-config:/config
      - ${DATA_ROOT}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8384/rest/noauth/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      syncthing-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

volumes:
  syncthing-config:

networks:
  homeserver:
    external: true
