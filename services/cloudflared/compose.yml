services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    container_name: cloudflared
    restart: unless-stopped
    env_file: .env
    # --metrics exposes a local health endpoint cloudflared can probe itself
    # --protocol http2 forces TCP transport instead of QUIC (UDP) — this network's
    # WiFi/router path was dropping QUIC connections repeatedly (1200+ reconnects/24h,
    # "timeout: no recent network activity"), which HTTP2 over TCP avoids.
    command: tunnel --no-autoupdate --protocol http2 --metrics localhost:9002 run --token ${TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:9002", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - homeserver

  # cloudflared's own healthcheck only checks its local connection count, which
  # doesn't detect the edge silently dropping connections (see watchdog.sh for
  # the incident this covers). This probes the real public URL and restarts
  # cloudflared when the tunnel is stale but the origin is confirmed fine.
  cloudflared-watchdog:
    image: curlimages/curl:8.21.0
    container_name: cloudflared-watchdog
    restart: unless-stopped
    # curlimages/curl drops to a non-root user by default, which can't reach the
    # Docker socket regardless of its host-side group ownership (varies between
    # Docker and rootless podman). Root bypasses that permission check entirely.
    user: "0:0"
    environment:
      DOMAIN: ${DOMAIN}
      CHECK_INTERVAL: ${WATCHDOG_CHECK_INTERVAL:-60}
      FAIL_THRESHOLD: ${WATCHDOG_FAIL_THRESHOLD:-3}
      RESTART_COOLDOWN: ${WATCHDOG_RESTART_COOLDOWN:-120}
    entrypoint: ["/bin/sh", "/watchdog.sh"]
    volumes:
      - ./watchdog.sh:/watchdog.sh:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - homeserver
    depends_on:
      - cloudflared

networks:
  homeserver:
    external: true
