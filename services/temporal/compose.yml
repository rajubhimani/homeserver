services:
  temporal-db:
    image: postgres:18.6-alpine
    container_name: temporal-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # max_connections=50 (the memory-tuned default before this) starves under
    # a cold start: temporal's bundled frontend/history/matching/worker roles
    # plus schema-setup/admin-tools/create-namespace all dial in around the
    # same time and hit "sorry, too many clients already" before temporal
    # ever reports healthy — confirmed live on this stack. 100 matches what
    # postgres ships with by default; the small memory cost is connection
    # slot bookkeeping only, not multiplied per-connection buffers.
    command: postgres -c shared_buffers=128MB -c max_connections=100 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=384MB
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - temporal-postgres-alpine:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # temporalio/auto-setup is deprecated upstream (replaced by temporalio/server
  # + external schema setup) — temporal-schema-setup below does what
  # auto-setup used to do at boot (temporal-sql-tool create/setup-schema/
  # update-schema for both the main and visibility databases), once, as its
  # own one-shot step, matching Temporal's own current reference compose
  # (temporalio/samples-server). Both `create` and `update-schema` are
  # idempotent no-ops when already applied — verified directly against this
  # stack's live temporal-db before switching (exit 0, "found zero updates
  # from current version" on a DB that already existed).
  temporal-schema-setup:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-schema-setup
    restart: "no"
    environment:
      SQL_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for db in ${POSTGRES_DB} temporal_visibility; do
          temporal-sql-tool --plugin postgres12 --ep temporal-db -u ${POSTGRES_USER} -p 5432 --db "$$db" create
          temporal-sql-tool --plugin postgres12 --ep temporal-db -u ${POSTGRES_USER} -p 5432 --db "$$db" setup-schema -v 0.0
        done
        temporal-sql-tool --plugin postgres12 --ep temporal-db -u ${POSTGRES_USER} -p 5432 --db ${POSTGRES_DB} update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --plugin postgres12 --ep temporal-db -u ${POSTGRES_USER} -p 5432 --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
    depends_on:
      temporal-db:
        condition: service_healthy
    networks:
      - homeserver

  # Runs the actual server (frontend/history/matching/worker services bundled
  # in one process — this is Temporal's own internal "worker", unrelated to
  # the temporal-worker container below, which runs *your* workflow code).
  # temporalio/server (unlike the deprecated auto-setup) expects the schema
  # to already exist — temporal-schema-setup above provides that — and does
  # nothing else differently; same env-var-driven config, same entrypoint.sh
  # under the hood, verified both `temporal` CLI and `nc` are present in this
  # image so the healthcheck below needed no changes either.
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION}
    container_name: temporal
    restart: unless-stopped
    env_file: .env
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      # temporalio/server dropped the bundled `temporal` CLI at some point
      # after 1.29.1 (binary is `temporal-server` now, no separate CLI) —
      # confirmed empirically on 1.30.4, `temporal operator cluster health`
      # broke this healthcheck outright (exec: not found), so it plain-out
      # never went healthy regardless of anything else. `nc` against the
      # frontend gRPC port is what's actually available in this image and is
      # a reasonable-enough liveness check on its own — but the frontend
      # binds only its own container-network IP, not 127.0.0.1, so the check
      # has to target the container's own name ('temporal', resolved via
      # Docker DNS to itself), not 'localhost' — confirmed live, localhost
      # connection-refused, own-hostname connection open.
      test: ["CMD", "nc", "-z", "temporal", "7233"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      temporal-db:
        condition: service_healthy
      temporal-schema-setup:
        condition: service_completed_successfully
    networks:
      - homeserver

  # temporalio/auto-setup used to also register the "default" namespace on
  # first boot — temporalio/server doesn't, so this replaces that half too.
  # Also registers "staging" as a second Namespace — the isolation boundary
  # demo: temporal-worker (worker.py) runs one Worker loop per Namespace,
  # both polling a task queue named "homeserver", and they never see each
  # other's work despite the identical queue name — see
  # docs/services/temporal/temporal.md's "Namespaces" section. "staging"/"production"
  # demonstrate the real, common reason to reach for multiple Namespaces on
  # one cluster: environment isolation without a second Temporal deployment.
  # Idempotent (describe-then-create, same as auto-setup's own logic) so
  # it's a harmless no-op on every start after the first.
  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-create-namespace
    restart: "no"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for ns in default staging production; do
          if ! temporal operator namespace describe --namespace "$$ns"; then
            temporal operator namespace create --retention 24h --description "Homeserver namespace: $$ns" --namespace "$$ns"
          else
            echo "Namespace $$ns already registered."
          fi
        done
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - homeserver

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-admin-tools
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    deploy:
      resources:
        limits:
          memory: 128M
    stdin_open: true
    tty: true
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - homeserver

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    container_name: temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: https://temporal.${DOMAIN}
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - homeserver

  # The image only has dependencies baked in (worker/Dockerfile) — the actual
  # workflow/activity code is bind-mounted from DATA_ROOT/worker (your live,
  # gitignored copy — see docs/services/temporal/temporal.md's "Where your workflow
  # code actually lives"). Docker socket mounted so activities can launch
  # their own resource-limited containers.
  temporal-worker:
    build: ./worker
    image: homeserver/temporal-worker:1.31.0
    container_name: temporal-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DATA_ROOT}/worker:/app
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  temporal-postgres-alpine:

networks:
  homeserver:
    external: true
