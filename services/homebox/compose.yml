services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    container_name: homebox
    restart: unless-stopped
    env_file: .env
    environment:
      HBOX_LOG_LEVEL: ${HBOX_LOG_LEVEL}
      HBOX_LOG_FORMAT: ${HBOX_LOG_FORMAT}
      HBOX_WEB_MAX_UPLOAD_SIZE: ${HBOX_WEB_MAX_UPLOAD_SIZE}
      HBOX_OPTIONS_ALLOW_ANALYTICS: ${HBOX_OPTIONS_ALLOW_ANALYTICS}
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${HBOX_OPTIONS_ALLOW_REGISTRATION}
      HBOX_OPTIONS_TRUST_PROXY: "true"
      HBOX_AUTH_API_KEY_PEPPER: ${HBOX_AUTH_API_KEY_PEPPER}
    volumes:
      - ${DATA_ROOT}/data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "-", "http://127.0.0.1:7745/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
