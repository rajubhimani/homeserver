# Database lives on the shared Postgres server (services/shared-postgres),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-postgres.md.
services:
  # Same pattern as firefly-permissions/mattermost-permissions -- vikunja's
  # image runs as a hardcoded uid=1000,gid=0 with no root fallback, so it
  # can never self-heal its own bind mount. Without this, a wipe/--fresh
  # leaves files/ root-owned (whatever created the empty mount point) and
  # vikunja fails every request with "storage validation failed: ...
  # permission denied [process uid=1000 gid=0, dir owner uid=0 gid=0]" --
  # confirmed live via an actual wipe-and-restart test, not assumed.
  vikunja-permissions:
    image: alpine:3.24.2
    container_name: vikunja-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}/files:/vikunja-files
    command: sh -c "mkdir -p /vikunja-files && chown -R 1000:0 /vikunja-files"

  vikunja:
    image: vikunja/vikunja:2.7.0
    container_name: vikunja
    restart: unless-stopped
    env_file: .env
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: ${DB_HOST}
      VIKUNJA_DATABASE_USER: ${POSTGRES_USER}
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VIKUNJA_DATABASE_DATABASE: ${POSTGRES_DB}
      VIKUNJA_SERVICE_PUBLICURL: https://vikunja.${DOMAIN}/
      VIKUNJA_SERVICE_ENABLEREGISTRATION: ${VIKUNJA_ENABLE_REGISTRATION}
    volumes:
      - ${DATA_ROOT}/files:/app/vikunja/files
    healthcheck:
      test: ["CMD", "/app/vikunja/vikunja", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      vikunja-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

networks:
  homeserver:
    external: true
