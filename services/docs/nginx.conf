server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # vendor/ (mermaid.min.js alone is ~3.5MB) is a fixed set of library
    # files that only change when this repo's own vendor/ files are updated
    # — safe to cache normally instead of re-fetching on every navigation.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Markdown files (and index.html, Docsify's own entry point) are fetched
    # live by Docsify's client-side router on every navigation — never cache
    # these, or an edited doc won't show up until a hard refresh.
    location ~* \.md$ {
        default_type text/plain; charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
