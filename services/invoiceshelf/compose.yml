# Database lives on the shared MariaDB server (services/shared-mariadb),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-mariadb.md.
services:
  invoiceshelf:
    image: invoiceshelf/invoiceshelf:2.4.6
    container_name: invoiceshelf
    restart: unless-stopped
    env_file: .env
    user: "0:0"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_URL: https://invoiceshelf.${DOMAIN}
      APP_KEY: ${APP_KEY}
      # The image's own default .env ships a blank SANCTUM_STATEFUL_DOMAIN
      # (singular — not a real Laravel Sanctum config key, so it's silently
      # ignored). The real key is plural. Without it set to the actual public
      # host, login succeeds (200 + session cookie) but the very next
      # auth-check request gets rejected as untrusted — surfaces during the
      # install wizard as "Domain verification failed. Please enter valid
      # domain name." even though the domain itself was entered correctly.
      # See docs/services/invoiceshelf.md.
      SANCTUM_STATEFUL_DOMAINS: invoiceshelf.${DOMAIN}
      SESSION_DOMAIN: invoiceshelf.${DOMAIN}
    volumes:
      - ${DATA_ROOT}/uploads:/var/www/html/storage
      # Both run on every start (serversideup/php's own documented drop-in
      # mechanism, /etc/entrypoint.d/*, executed in filename order before the
      # app boots). See docs/services/invoiceshelf.md and each script's own
      # comment for why.
      - ./entrypoint.d/10-ensure-storage-dirs.sh:/etc/entrypoint.d/10-ensure-storage-dirs.sh:ro
      - ./entrypoint.d/99-fix-env-permissions.sh:/etc/entrypoint.d/99-fix-env-permissions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
