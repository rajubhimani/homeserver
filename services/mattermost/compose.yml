services:
  mattermost-db:
    image: postgres:18.6-alpine
    container_name: mattermost-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c shared_buffers=128MB -c max_connections=50 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=384MB
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - mattermost-postgres-alpine:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # Same pattern as firefly-permissions (services/firefly/compose.yml) --
  # mattermost's own image hardcodes uid 2000 with no root fallback (see the
  # `user:` override below), so it can never self-heal its own bind mounts'
  # ownership. Without this, a wipe/--fresh recreates DATA_ROOT's
  # subdirectories root-owned (whatever created the empty mount point last),
  # and mattermost crash-loops on permission denied -- confirmed live by
  # actually wiping and re-testing, not assumed. Runs once (restart: "no"),
  # chowns the whole DATA_ROOT tree, then exits; mattermost itself waits for
  # it via depends_on below.
  mattermost-permissions:
    image: alpine:3.24.1
    container_name: mattermost-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}:/mattermost-data
    # mkdir first, not just chown -R -- otherwise this races mattermost's own
    # six separate bind mounts (config/data/logs/plugins/client-plugins/
    # bleve-indexes), each of which Docker creates as its own root-owned
    # empty directory the moment the main container starts, *after* this one
    # already ran and exited if the subdirs didn't exist yet. Confirmed live:
    # chown -R alone left every subdirectory root-owned on a real empty-start
    # test, this fixed it.
    command: sh -c "mkdir -p /mattermost-data/config /mattermost-data/data /mattermost-data/logs /mattermost-data/plugins /mattermost-data/client-plugins /mattermost-data/bleve-indexes && chown -R 2000:2000 /mattermost-data"

  mattermost:
    image: mattermost/mattermost-team-edition:${MATTERMOST_VERSION}
    container_name: mattermost
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mattermost-db:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=10
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      MM_SERVICESETTINGS_SITEURL: https://mattermost.${DOMAIN}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      # Routed through the shared Mailpit catcher — see docs/services/mailpit.md.
      # No auth needed (Mailpit accepts any/none).
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "true"
      MM_EMAILSETTINGS_SMTPSERVER: mailpit
      MM_EMAILSETTINGS_SMTPPORT: "1025"
      MM_EMAILSETTINGS_ENABLESMTPAUTH: "false"
      MM_EMAILSETTINGS_CONNECTIONSECURITY: ""
    # Official image runs as uid 2000 — matches DATA_ROOT subdirs created
    # (and chowned) in Setup below.
    user: "2000:2000"
    deploy:
      resources:
        limits:
          memory: 1024M
    volumes:
      - ${DATA_ROOT}/config:/mattermost/config
      - ${DATA_ROOT}/data:/mattermost/data
      - ${DATA_ROOT}/logs:/mattermost/logs
      - ${DATA_ROOT}/plugins:/mattermost/plugins
      - ${DATA_ROOT}/client-plugins:/mattermost/client/plugins
      - ${DATA_ROOT}/bleve-indexes:/mattermost/bleve-indexes
    # No healthcheck override — the official image is genuinely distroless
    # (no shell, no wget/curl, not even `ls`; confirmed the mattermost
    # binary itself has no ping/health subcommand either), but it bakes its
    # own HEALTHCHECK into the image (`mmctl system status --local`), which
    # this correctly falls back to as long as nothing here overrides it.
    depends_on:
      mattermost-db:
        condition: service_healthy
      mattermost-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

volumes:
  mattermost-postgres-alpine:

networks:
  homeserver:
    external: true
