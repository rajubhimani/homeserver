services:
  firefox:
    # Deliberate exception to this repo's pinned-version convention: this container
    # is internet-reachable and stateless (profile lives in the /config volume, not
    # the image), and Firefox ships security patches often — tracking :latest lets
    # `uv run homeserver.py dev update firefox` alone keep it current, no manual
    # tag bump needed. Every other service in this stack stays pinned; this is a
    # one-off, not a new default.
    image: lscr.io/linuxserver/firefox:latest
    container_name: firefox
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: 1000
      PGID: 1000
      # Sourced from the repo ROOT .env (homeserver.py injects it) — same
      # credential nginx-plain's browser-hub gate uses, kept in sync by
      # design. See docs/services/browser-hub.md.
      CUSTOM_USER: ${BROWSER_HUB_USER}
      PASSWORD: ${BROWSER_HUB_PASSWORD}
      # Public-facing container: reduce blast radius if the browser itself is
      # ever compromised — disables sudo, terminal emulators, and xdg/exo-open.
      HARDEN_DESKTOP: "true"
      # Compensates for HARDEN_DESKTOP above: with no terminal/xdg-open to
      # relaunch it, accidentally closing Firefox itself (not just your own
      # viewing tab) would otherwise strand the session with no way to get
      # the browser back short of restarting the whole container. This
      # watchdog auto-relaunches the main app whenever it exits.
      RESTART_APP: "true"
      # Served at https://browser.${DOMAIN}/firefox/ via the shared browser
      # hub (services/nginx-plain), not its own subdomain — see
      # docs/services/browser-hub.md. Needs both slashes per upstream's docs.
      SUBFOLDER: /firefox/
    volumes:
      - ${DATA_ROOT}/config:/config
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u \"$$CUSTOM_USER:$$PASSWORD\" http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
