services:
  documenso-db:
    image: postgres:18.4-alpine
    container_name: documenso-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - documenso-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  documenso:
    image: documenso/documenso:v2.16.0
    container_name: documenso
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NEXT_PRIVATE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@documenso-db:5432/${POSTGRES_DB}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@documenso-db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_WEBAPP_URL: https://documenso.${DOMAIN}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
    volumes:
      - ${DATA_ROOT}/data:/app/data
      - ${DATA_ROOT}/cert.p12:/opt/documenso/cert.p12:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      documenso-db:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  documenso-postgres-alpine:

networks:
  homeserver:
    external: true
