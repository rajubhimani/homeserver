services:
  documenso-db:
    image: postgres:18.6-alpine
    container_name: documenso-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - documenso-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # Same pattern as firefly-permissions/mattermost-permissions/etc. --
  # documenso's image runs as a hardcoded "nodejs" user (uid 1001, gid
  # 65533, confirmed via /etc/passwd inside the container) with no root
  # fallback, so it can never self-heal data/ if recreated root-owned
  # (e.g. after a wipe/--fresh restart). Only touches data/, not
  # cert.p12 -- that's a real file the user must provide (see docs/
  # services/documenso.md), not something to mkdir a directory over.
  documenso-permissions:
    image: alpine:3.24.1
    container_name: documenso-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}/data:/documenso-data
    command: sh -c "mkdir -p /documenso-data && chown -R 1001:65533 /documenso-data"

  documenso:
    image: documenso/documenso:v2.17.0
    container_name: documenso
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NEXT_PRIVATE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@documenso-db:5432/${POSTGRES_DB}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@documenso-db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_WEBAPP_URL: https://documenso.${DOMAIN}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
    volumes:
      - ${DATA_ROOT}/data:/app/data
      - ${DATA_ROOT}/cert.p12:/opt/documenso/cert.p12:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      documenso-db:
        condition: service_healthy
      documenso-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

volumes:
  documenso-postgres-alpine:

networks:
  homeserver:
    external: true
