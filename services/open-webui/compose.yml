services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_IMAGE_TAG:-v0.12.3-slim}
    container_name: open-webui
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      TERMINAL_SERVER_CONNECTIONS: '[{"id":"open-terminal","name":"Open Terminal","url":"${OPEN_TERMINAL_URL}","auth_type":"bearer","key":"${OPEN_TERMINAL_API_KEY}","enabled":true,"config":{"access_grants":[]}}]'
    volumes:
      - ${DATA_ROOT}/data:/app/backend/data
      - ${MODELS_ROOT}:/app/backend/data/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - homeserver

  # Code-execution sandbox for Open WebUI. Deliberately NOT env_file: .env: the model has a shell
  # in this container, so it gets only the OPEN_TERMINAL_* values below, never WEBUI_SECRET_KEY.
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:${OPEN_TERMINAL_IMAGE_TAG:-0.14.1}
    container_name: open-terminal
    restart: unless-stopped
    # Upstream's security guide: cap CPU and memory so a runaway process cannot take the host down.
    deploy:
      resources:
        limits:
          memory: ${OPEN_TERMINAL_MEMORY_LIMIT}
          cpus: ${OPEN_TERMINAL_CPUS}
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY}
      OPEN_TERMINAL_PIP_PACKAGES: ${OPEN_TERMINAL_PIP_PACKAGES}
      OPEN_TERMINAL_PACKAGES: ${OPEN_TERMINAL_PACKAGES}
      OPEN_TERMINAL_NPM_PACKAGES: ${OPEN_TERMINAL_NPM_PACKAGES}
      OPEN_TERMINAL_CORS_ALLOWED_ORIGINS: ${OPEN_TERMINAL_CORS_ALLOWED_ORIGINS}
      OPEN_TERMINAL_MAX_SESSIONS: ${OPEN_TERMINAL_MAX_SESSIONS}
      OPEN_TERMINAL_ENABLE_TERMINAL: ${OPEN_TERMINAL_ENABLE_TERMINAL}
      OPEN_TERMINAL_ENABLE_NOTEBOOKS: ${OPEN_TERMINAL_ENABLE_NOTEBOOKS}
      OPEN_TERMINAL_ENABLE_SYSTEM_PROMPT: ${OPEN_TERMINAL_ENABLE_SYSTEM_PROMPT}
      OPEN_TERMINAL_MULTI_USER: ${OPEN_TERMINAL_MULTI_USER}
      OPEN_TERMINAL_TERM: ${OPEN_TERMINAL_TERM}
      OPEN_TERMINAL_MAX_LOG_SIZE: ${OPEN_TERMINAL_MAX_LOG_SIZE}
      OPEN_TERMINAL_LOG_RETENTION: ${OPEN_TERMINAL_LOG_RETENTION}
      OPEN_TERMINAL_LOG_FLUSH_INTERVAL: ${OPEN_TERMINAL_LOG_FLUSH_INTERVAL}
      OPEN_TERMINAL_LOG_FLUSH_BUFFER: ${OPEN_TERMINAL_LOG_FLUSH_BUFFER}
      OPEN_TERMINAL_BINARY_MIME_PREFIXES: ${OPEN_TERMINAL_BINARY_MIME_PREFIXES}
      OPEN_TERMINAL_FILE_BROWSER_ROOT: ${OPEN_TERMINAL_FILE_BROWSER_ROOT}
      OPEN_TERMINAL_SESSION_CWD_TTL: ${OPEN_TERMINAL_SESSION_CWD_TTL}
    volumes:
      - ${TERMINAL_HOME_ROOT}:/home/user
    healthcheck:
      # start_period covers the first start's pip install (PyTorch is the bulk)
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
