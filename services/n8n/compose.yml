services:
  n8n-db:
    image: postgres:18.6-alpine
    container_name: n8n-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - n8n-postgres-alpine:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  # Same pattern as firefly-permissions/mattermost-permissions/
  # vikunja-permissions -- n8n's image runs as the baked-in "node" user
  # (uid 1000) with no root fallback, so it can never self-heal its own
  # bind mount. Without this, a wipe/--fresh leaves data/ root-owned and
  # n8n crashes on boot with "EACCES: permission denied, open
  # '/home/node/.n8n/config'" -- confirmed live via an actual
  # wipe-and-restart test, not assumed.
  n8n-permissions:
    image: alpine:3.24.1
    container_name: n8n-permissions
    restart: "no"
    user: "0:0"
    volumes:
      - ${DATA_ROOT}/data:/n8n-data
    command: sh -c "mkdir -p /n8n-data && chown -R 1000:1000 /n8n-data"

  n8n:
    image: n8nio/n8n:2.38.3
    container_name: n8n
    restart: unless-stopped
    env_file: .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://n8n.${DOMAIN}/
    volumes:
      - ${DATA_ROOT}/data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      n8n-db:
        condition: service_healthy
      n8n-permissions:
        condition: service_completed_successfully
    networks:
      - homeserver

volumes:
  n8n-postgres-alpine:

networks:
  homeserver:
    external: true
