# Postgres lives on the shared Postgres server (services/shared-postgres),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-postgres.md. ClickHouse (events) stays its own
# container: there is no shared ClickHouse server.
services:
  plausible-events-db:
    image: clickhouse/clickhouse-server:26.8.15.10-alpine
    container_name: plausible-events-db
    restart: unless-stopped
    env_file: .env
    environment:
      CLICKHOUSE_USER: plausible
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: plausible_events_db
    volumes:
      - plausible-clickhouse-data-alpine:/var/lib/clickhouse
      - plausible-clickhouse-logs-alpine:/var/log/clickhouse-server
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s
    networks:
      - homeserver

  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    container_name: plausible
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    env_file: .env
    environment:
      BASE_URL: https://plausible.${DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      CLICKHOUSE_DATABASE_URL: http://plausible:${CLICKHOUSE_PASSWORD}@${EVENTS_DB_HOST}:${EVENTS_DB_PORT}/plausible_events_db
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - plausible-data:/var/lib/plausible
    healthcheck:
      # Readiness endpoint from Plausible's router (/api/health is deprecated).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/system/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      plausible-events-db:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  plausible-clickhouse-data-alpine:
  plausible-clickhouse-logs-alpine:
  plausible-data:

networks:
  homeserver:
    external: true
