# Database lives on the shared Postgres server (services/shared-postgres),
# provisioned and started by homeserver.py from services.json "shared_db" —
# see docs/services/shared-postgres.md.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    container_name: mealie
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_SERVER: shared-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BASE_URL: https://mealie.${DOMAIN}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    volumes:
      - ${DATA_ROOT}/data:/app/data
    networks:
      - homeserver

networks:
  homeserver:
    external: true
