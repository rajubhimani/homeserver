services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.11.1
    container_name: silverbullet
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_ROOT}/space:/space
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/.ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - homeserver

networks:
  homeserver:
    external: true
