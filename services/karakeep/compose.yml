services:
  karakeep-chrome:
    # gcr.io/zenika-hub/alpine-chrome:124 (the image used here previously)
    # started failing to pull with a Google Cloud "billing must be enabled on
    # this project" error — an upstream GCR change unrelated to this stack.
    # Karakeep's own docker-compose.yml has since moved to a chrome image
    # they build and publish themselves; switched to that instead of chasing
    # a GCR fix or a Docker Hub mirror, since it also tracks the app version.
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    container_name: karakeep-chrome
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    networks:
      - homeserver

  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.53.1
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - karakeep-meilisearch:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health | grep -q '\"status\":\"available\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - homeserver

  karakeep:
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    container_name: karakeep
    restart: unless-stopped
    env_file: .env
    environment:
      MEILI_ADDR: http://karakeep-meilisearch:7700
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      NEXTAUTH_URL: https://karakeep.${DOMAIN}
      DATA_DIR: /data
    volumes:
      - ${DATA_ROOT}/data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      karakeep-meilisearch:
        condition: service_healthy
      karakeep-chrome:
        condition: service_started
    networks:
      - homeserver

volumes:
  karakeep-meilisearch:

networks:
  homeserver:
    external: true
