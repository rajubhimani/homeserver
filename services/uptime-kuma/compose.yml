services:
  uptime-kuma-db:
    image: mariadb:12.3.3
    container_name: uptime-kuma-db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --innodb-buffer-pool-size=128M --max-connections=20
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - uptime-kuma-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 2s
    networks:
      - homeserver

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: uptime-kuma
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      UPTIME_KUMA_DB_TYPE: mariadb
      UPTIME_KUMA_DB_HOSTNAME: ${DB_HOST}
      UPTIME_KUMA_DB_PORT: ${DB_PORT}
      UPTIME_KUMA_DB_NAME: ${MYSQL_DATABASE}
      UPTIME_KUMA_DB_USERNAME: ${MYSQL_USER}
      UPTIME_KUMA_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${DATA_ROOT}/data:/app/data
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    # No healthcheck here on purpose: the image ships its own (extra/healthcheck, 60s interval, 180s start period), and
    # upstream's compose defines none, so a compose one would only replace it.
    depends_on:
      uptime-kuma-db:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  uptime-kuma-mariadb:

networks:
  homeserver:
    external: true
