services:
  nginx-plain:
    image: nginx:1.28-alpine
    container_name: nginx-plain
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: ${DOMAIN}
    # nginx:alpine automatically processes templates/*.conf.template via envsubst
    # and writes results to /etc/nginx/conf.d/ on startup
    volumes:
      - ./templates:/etc/nginx/templates:ro
      - ${DATA_ROOT}/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/_health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      # Lets CrowdSec's docker acquisition source (see crowdsec/acquis.yaml)
      # read this container's logs via the Docker API — no file mount or
      # nginx logging config change needed.
      crowdsec.enable: "true"
      crowdsec.labels.type: "nginx"
    networks:
      - homeserver

networks:
  homeserver:
    external: true
