services:
  jellyfin-pgsql-test-db:
    image: postgres:18.4
    container_name: jellyfin-pgsql-test-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c shared_buffers=128MB -c max_connections=20 -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - jellyfin-pgsql-test-postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - homeserver

  jellyfin-pgsql-test:
    image: ghcr.io/jpvenson/jellyfin.pgsql:10.11.11-1
    container_name: jellyfin-pgsql-test
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: jellyfin-pgsql-test-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT}/config:/config
      - ${DATA_ROOT}/cache:/cache
      - ${MEDIA_ROOT}:/media:ro
      - ${METADATA_ROOT}:/config/metadata
    depends_on:
      jellyfin-pgsql-test-db:
        condition: service_healthy
    networks:
      - homeserver

volumes:
  jellyfin-pgsql-test-postgres:

networks:
  homeserver:
    external: true
